# Controller Console operation inventory - dome domain(s): dome
# Analysis-slice artifact for #208 (epic #206). Generated skeleton: 55 rows from
# docs/action-registry.yaml at base f0b0dbc. Every `FILL` cell is decided by READING the
# firmware and replaced with evidence; a file containing FILL is unfinished by definition.
#
# Row schema (decide these):
#   anchor_kind:        api | rc_internal | event | config | aggregate-field | none
#                       aggregate-field = describes one field/section inside a larger query's
#                       response; stays metadata, cites the owning aggregate + builder line
#   evidence:           list of "file:line - what it shows" citations. Required per anchor_kind:
#                         api          -> route registration + handler declaration header + definition + domain core
#                         rc_internal  -> dispatcher site + enum/token + owning queue or core
#                         event        -> emitter + SSE registration
#                         config       -> read path + apply path + persistence path
#                         aggregate-field -> owning aggregate query name + the builder line that emits it
#                         none         -> explicit file:line evidence that NO executor exists
#   executor_or_core:   the function/core the Console must call (or "none")
#   missing_metadata:   registry fields the Console needs that are absent (argument schema, alias,
#                       availability metadata, executor reference) - [] if none
#   notes:              grouped HTTP surfaces reached from here with no registry entry, oddities
# Gathered fields (read-only context copied from the registry) are prefixed `registry_`.
