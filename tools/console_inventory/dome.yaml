# Controller Console operation inventory - dome domain(s): dome
# Written in the inventory pass, #208 (epic #206): one row per registry entry in these
# domains, decided by reading the firmware.
#
# Row schema, one row per registry entry (decide these):
#   anchor_kind:        api | rc_internal | event | config | aggregate-field | none
#                       aggregate-field = describes one field/section inside a larger query's
#                       response; stays metadata, cites the owning aggregate + builder line
#   evidence:           list of "file - what it shows" citations. What the file must contain goes
#                       in `backticks`, and `make check-action-drift` fails when it no longer
#                       does: a symbol, never a line number (#459). Required per anchor_kind:
#                         api          -> route registration + handler declaration header + definition + domain core
#                         rc_internal  -> dispatcher site + enum/token + owning queue or core
#                         event        -> emitter + SSE registration
#                         config       -> read path + apply path + persistence path
#                         aggregate-field -> owning aggregate query name + the builder line that emits it
#                         none         -> explicit evidence, cited the same way, that NO executor exists
#   notes:              grouped HTTP surfaces reached from here with no registry entry, oddities
# A row holds `name` and the three fields above, nothing else. What the operation is - its
# type, route, executor, params, whether it is on the Console - is the registry's
# (docs/action-registry.yaml), and is never copied here (ADR 0037 Amendment 2026-10-06, #474).
