name: Auto Release

# Every `uses:` is pinned to a full commit SHA with its `# vX.Y.Z`, and a new
# action lands pinned the same way (#473). Dependabot's grouped weekly
# updates move the pins.

# A merge to main releases itself (issue #285).
#
# The project has always said releases are "small and frequent - main is tagged
# per semver as merged work accrues" (AGENTS.md) with "no umbrella releases"
# (CONTRIBUTING.md). Nothing automated that sentence, so tagging happened only
# when someone remembered, which in practice meant at the end of an epic: every
# tag in the repo was x.y.0, while 193 fix: commits since v1.0.0 never shipped.
# This workflow is the missing half. tools/release_plan.py reads the
# Conventional Commits in the range since the last release tag and applies
# CONTRIBUTING.md's own type table - feat -> MINOR, fix -> PATCH, feat!/fix! or
# a BREAKING CHANGE: footer -> MAJOR, everything else -> no release. A
# docs/chore-only merge decides "none" and exits green; it is not a failure for
# a merge to not be a release.
#
# When it tags (#473, operator decision on #285's two tiers):
#
#   * A patch tags immediately, on the push to main. A fix should reach
#     people quickly, and a patch release ships no images.
#   * A minor or major waits for a green Verification of the commit it would
#     tag. The push run only says so; the tag is cut by the run that
#     `workflow_run` starts when Verification completes on main. That run
#     follows GitHub's workflow_run contract: the Verification run concluded
#     success, was for this repository (not a fork), on main, from a push or
#     a dispatch, and its `verification` job itself passed (a bot commit's
#     push run skips every job). This file runs from the default branch and
#     checks out main, never the run's own tree. main's tip is tagged only
#     when it is the verified commit or every commit after it is release
#     machinery (tools/release_plan.py `verified`: a bot commit touching only
#     the version JSON, CHANGELOG.md or the README Showcase pictures); main
#     having moved on with code means waiting for that commit's own run. A
#     Markdown-only commit gets no
#     Verification run of its own (verification.yml's path filter), so a minor
#     held behind one is released by dispatching Verification on main. While
#     main's Verification is red, no minor or major is cut.
#
# The push authenticates via the write deploy key (VERSION_SYNC_DEPLOY_KEY),
# not GITHUB_TOKEN, for the reason version-sync.yml's header gives: the main
# ruleset requires pull requests, GITHUB_TOKEN cannot be a ruleset bypass actor
# and a deploy key can. The deploy key must ALSO be a bypass actor on the
# protect-release-tags ruleset, which blocks `creation` on refs/tags/v* - it
# was not when this workflow was written, and the tag push step says so
# explicitly rather than failing with a bare git error.
#
# Loop safety (the thing that would otherwise be self-sustaining and public):
#
#   * A deploy-key push DOES trigger workflows, unlike a GITHUB_TOKEN push.
#     Every push to main that can follow a release - version-sync.yml's
#     version-JSON commit, this workflow's own CHANGELOG promotion, and the
#     `showcase` job's README pictures (#480) - is authored by
#     github-actions[bot], and the job-level `if` below skips them. That guard
#     is load-bearing, not belt-and-braces.
#   * The tag push cannot re-enter here at all: this workflow triggers on a
#     branch push, and a tag is not a branch. It triggers release.yml, which
#     pushes nothing.
#   * Nor through workflow_run: Verification never runs on a tag, and the
#     CHANGELOG promotion is a Markdown-only bot commit, which Verification's
#     path filter skips and whose push run, if any, the job-level `if` turns
#     away. The version-sync commit's push run is turned away the same way,
#     and so is the Showcase picture commit's.
#   * Belt to that brace: after a release the range since the last tag is
#     empty, so even an unguarded re-run decides "none".
on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Verification
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: decide and tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # One release decision at a time. Never cancel one in flight: a cancelled run
    # between the CHANGELOG push and the tag push is exactly the half-done state
    # the promotion step is written to be re-runnable through. GitHub still
    # replaces a PENDING run in this group when a newer one queues; every run
    # recomputes the whole decision from main and the last tag, so the newer one
    # decides in its place. A Verification signal lost that way returns with the
    # next run on main, or by re-running that Verification run.
    #
    # On this job, not the workflow: the `showcase` job below runs for many
    # minutes after a tag, and holding this group through it would leave every
    # release decision queued behind a capture, where a pending one is replaced
    # and its Verification signal lost far more often (#480).
    concurrency:
      group: auto-release-main
      cancel-in-progress: false
    # Skip this workflow's own CHANGELOG commit and version-sync.yml's version
    # JSON commit. See the loop-safety note in the header. A workflow_run must
    # be a successful Verification of a push to (or dispatch on) main in this
    # repository. A bot commit's PUSH run skips every job, so it is turned
    # away here (and the jobs check below would fail it anyway); a DISPATCH
    # on main runs every job whatever the tip's author, which is the remedy
    # when main's tip is a commit Verification never ran on by itself.
    if: >-
      (github.event_name == 'push' &&
       github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event != 'push' ||
        github.event.workflow_run.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'))
    permissions:
      contents: read
      # Reading the Verification run's jobs (the gate below).
      actions: read
    # What the showcase job below needs: which release this run cut, if any.
    outputs:
      bump: ${{ steps.plan.outputs.bump }}
      tag: ${{ steps.plan.outputs.tag }}
      tagged: ${{ steps.tag.outputs.pushed }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The branch, not the pushed SHA: this job may commit and push, which
          # needs a branch to push. Deciding from whatever main holds when the
          # job runs is correct either way - the range is recomputed from the
          # last release tag, so a merge that landed in between is included
          # rather than skipped.
          ref: main
          # Full history and every tag: the bump is computed from the commit
          # range since the last release tag, and a shallow clone has neither.
          fetch-depth: 0
          # Fetch and push over SSH as the deploy key, so the push is a
          # ruleset-bypass actor (see header).
          ssh-key: ${{ secrets.VERSION_SYNC_DEPLOY_KEY }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: 🧮 Decide the release
        id: plan
        run: python3 tools/release_plan.py decide --github-output

      - name: 🛑 Nothing to release
        if: steps.plan.outputs.bump == 'none'
        run: |
          echo "No feat:, fix: or breaking change since ${{ steps.plan.outputs.current }}."
          echo "Nothing to release, which is a normal outcome for a docs or chore merge."

      - name: 🚦 Decide whether to tag now
        # push: a patch tags now, a minor or major waits for Verification.
        # workflow_run: tag when that Verification run's own `verification`
        # job passed and main's tip is its commit or release machinery after it.
        id: gate
        if: steps.plan.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BUMP: ${{ steps.plan.outputs.bump }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            if [ "$BUMP" = "patch" ]; then
              echo "go=true" >> "$GITHUB_OUTPUT"
              echo "A patch tags immediately."
            else
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "A $BUMP release waits for a green Verification run on main of $(git rev-parse --short HEAD)."
            fi
            exit 0
          fi
          job=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name == "verification") | .conclusion')
          if [ "$job" != "success" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Verification run $RUN_ID's verification job ended '${job:-absent}', not success."
            exit 0
          fi
          result=$(python3 tools/release_plan.py verified "$HEAD_SHA")
          echo "$result"
          verified=$(printf '%s' "$result" | python3 -c 'import json, sys; print(str(json.load(sys.stdin)["verified"]).lower())')
          echo "go=$verified" >> "$GITHUB_OUTPUT"
          if [ "$verified" != true ]; then
            reason=$(printf '%s' "$result" | python3 -c 'import json, sys; print(json.load(sys.stdin)["reason"])')
            echo "Not tagging: $reason."
            echo "Waiting for a green Verification of main's tip; if that commit never gets"
            echo "a run of its own (a Markdown-only change), dispatch Verification on main."
          fi

      - name: 🔍 Check the tag is not already published
        id: exists
        if: steps.gate.outputs.go == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already on the remote - an earlier run got there first."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📝 Promote the Unreleased CHANGELOG section
        # Minor and major only. A patch release publishes generated notes from
        # the commit subjects instead and never touches CHANGELOG.md, per the
        # two-tier decision in #285.
        #
        # This runs BEFORE the tag is created, and pushes first, so the tag
        # lands on a commit that already carries the section release.yml will
        # look for. promote_changelog.py is a no-op when the section is already
        # there, so a run that dies between this push and the tag push is fixed
        # by the next run rather than wedging main.
        if: >-
          steps.gate.outputs.go == 'true' &&
          steps.exists.outputs.published == 'false' &&
          (steps.plan.outputs.bump == 'minor' || steps.plan.outputs.bump == 'major')
        env:
          NEXT: ${{ steps.plan.outputs.next }}
        run: |
          python3 tools/promote_changelog.py "$NEXT"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already carried the [$NEXT] section - nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(plan): open the CHANGELOG section for $NEXT"
          git push

      - name: 🏷️ Tag the release
        id: tag
        if: steps.gate.outputs.go == 'true' && steps.exists.outputs.published == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          BUMP: ${{ steps.plan.outputs.bump }}
          TIER: ${{ steps.plan.outputs.tier }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha="$(git rev-parse --short HEAD)"
          git tag -a "$TAG" \
            -m "$TAG" \
            -m "Tagged automatically from $sha on a $BUMP bump ($TIER release)."
          if ! git push origin "$TAG"; then
            echo "::error::Pushing $TAG was refused. The protect-release-tags"\
              "ruleset blocks creation on refs/tags/v*, so the deploy key used"\
              "here has to be listed among its bypass actors the way it already"\
              "is on protect-main. Nothing was released; main is unchanged apart"\
              "from any CHANGELOG promotion above, which the next run reuses."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed $TAG - release.yml takes it from here."

      - name: 📊 Summary
        if: always()
        env:
          BUMP: ${{ steps.plan.outputs.bump }}
          CURRENT: ${{ steps.plan.outputs.current }}
          TAG: ${{ steps.plan.outputs.tag }}
          TIER: ${{ steps.plan.outputs.tier }}
          COMMITS: ${{ steps.plan.outputs.commits }}
          GO: ${{ steps.gate.outputs.go }}
        run: |
          {
            echo "## Auto Release"
            echo
            if [ "$BUMP" = "none" ] || [ -z "$BUMP" ]; then
              echo "No release. $COMMITS commit(s) since \`$CURRENT\`, none of them"
              echo "a \`feat:\`, a \`fix:\` or a breaking change."
            else
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Previous release | \`$CURRENT\` |"
              echo "| Commits in range | $COMMITS |"
              echo "| Bump | \`$BUMP\` |"
              echo "| New tag | \`$TAG\` |"
              echo "| Tier | \`$TIER\` |"
              echo
              if [ "$GO" != "true" ]; then
                echo "Not tagged by this run. A minor or major tag waits for a green"
                echo "Verification of the commit it tags; the gate step's log says which."
              elif [ "$TIER" = "patch" ]; then
                echo "A patch release: generated notes and the source tag, no images."
              else
                echo "A full release: the curated CHANGELOG section and each board's images."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A minor or major release recaptures the README Showcase from the commit it
  # tagged, and commits the twenty pictures straight to main (#480, operator
  # decisions 2026-10-06 and 2026-10-08). Its own job, after the tag, so a
  # capture that fails cannot stop or undo a release: the tag is already
  # pushed by the time this starts. A patch, a held minor and a merge that
  # releases nothing skip it, and so does a re-run that finds its tag already
  # published (that run's capture was the earlier run's to make).
  #
  # The picture commit is authored by github-actions[bot] and touches only
  # docs/images/readme/, so the `release` job's author guard turns its push
  # run away, Verification skips it, and tools/release_plan.py counts it as
  # release machinery, so it never holds the next minor behind a Verification
  # run it will not get.
  showcase:
    name: recapture the README Showcase
    needs: release
    if: >-
      needs.release.outputs.tagged == 'true' &&
      (needs.release.outputs.bump == 'minor' || needs.release.outputs.bump == 'major')
    runs-on: ubuntu-26.04
    # One capture at a time, never cancelled: two pushes to main at once would
    # race. A newer release's capture that queues replaces a pending older one,
    # and the newer release is the one the pictures should show.
    concurrency:
      group: readme-showcase
      cancel-in-progress: false
    # Provisional: one screenshot per frame, about 14,300 frames. Measured on
    # the first CI run and set from that (#480).
    timeout-minutes: 90
    permissions:
      # The push is the deploy key's, not GITHUB_TOKEN's.
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # main and every tag: the capture runs on the tag, the commit lands
          # on main.
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.VERSION_SYNC_DEPLOY_KEY }}

      - name: 🏷️ Check out the released commit
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: git checkout --detach "refs/tags/$TAG"

      # Pinned to the bench's own, as .github/actions/setup does.
      - name: 🟢 Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install Playwright and ffmpeg
        # The playwright devDependency and the Chromium build it pins, with its
        # system libraries and fonts. ffmpeg encodes the master (libx264) and
        # the published scrolls (libwebp); the script checks both encoders.
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 🎬 Capture
        run: node tools/readme_showcase.mjs

      - name: 📤 Commit the pictures to main
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          # The script writes the twenty Showcase paths and nothing else. Any
          # other change in the tree, or a new file beside them, is a run that
          # broke that promise, and nothing is committed.
          stray=$(git status --porcelain --untracked-files=all | grep -Ev '^ M docs/images/readme/[a-z-]+\.(png|webp)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::The capture changed paths outside the twenty Showcase files:"
            echo "$stray"
            exit 1
          fi
          if git diff --quiet -- docs/images/readme/; then
            echo "The pictures from $TAG match the ones on main's history - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/readme/
          git commit -m "docs(plan): recapture the README Showcase from $TAG"
          # The capture took minutes and main may have moved: replay the one
          # commit on main's tip and push, a few times if main keeps moving.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Pushed the Showcase from $TAG to main."
              exit 0
            fi
            echo "Push attempt $attempt was refused; main moved, retrying."
          done
          echo "::error::Could not push the Showcase commit to main after three attempts."
          exit 1
