name: Auto Release

# A merge to main releases itself (issue #285).
#
# The project has always said releases are "small and frequent - main is tagged
# per semver as merged work accrues" (AGENTS.md) with "no umbrella releases"
# (CONTRIBUTING.md). Nothing automated that sentence, so tagging happened only
# when someone remembered, which in practice meant at the end of an epic: every
# tag in the repo was x.y.0, while 193 fix: commits since v1.0.0 never shipped.
# This workflow is the missing half. tools/release_plan.py reads the
# Conventional Commits in the range since the last release tag and applies
# CONTRIBUTING.md's own type table - feat -> MINOR, fix -> PATCH, feat!/fix! or
# a BREAKING CHANGE: footer -> MAJOR, everything else -> no release. A
# docs/chore-only merge decides "none" and exits green; it is not a failure for
# a merge to not be a release.
#
# The push authenticates via the write deploy key (VERSION_SYNC_DEPLOY_KEY),
# not GITHUB_TOKEN, for the reason version-sync.yml's header gives: the main
# ruleset requires pull requests, GITHUB_TOKEN cannot be a ruleset bypass actor
# and a deploy key can. The deploy key must ALSO be a bypass actor on the
# protect-release-tags ruleset, which blocks `creation` on refs/tags/v* - it
# was not when this workflow was written, and the tag push step says so
# explicitly rather than failing with a bare git error.
#
# Loop safety (the thing that would otherwise be self-sustaining and public):
#
#   * A deploy-key push DOES trigger workflows, unlike a GITHUB_TOKEN push.
#     Both pushes this workflow can make - version-sync.yml's version-JSON
#     commit and this workflow's own CHANGELOG promotion - are authored by
#     github-actions[bot], and the job-level `if` below skips them. That guard
#     is load-bearing, not belt-and-braces.
#   * The tag push cannot re-enter here at all: this workflow triggers on a
#     branch push, and a tag is not a branch. It triggers release.yml, which
#     pushes nothing.
#   * Belt to that brace: after a release the range since the last tag is
#     empty, so even an unguarded re-run decides "none".
on:
  push:
    branches:
      - main

permissions:
  contents: read

# One release decision at a time. Never cancel one in flight: a cancelled run
# between the CHANGELOG push and the tag push is exactly the half-done state
# the promotion step is written to be re-runnable through.
concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    name: decide and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip this workflow's own CHANGELOG commit and version-sync.yml's version
    # JSON commit. See the loop-safety note in the header.
    if: github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7
        with:
          # The branch, not the pushed SHA: this job may commit and push, which
          # needs a branch to push. Deciding from whatever main holds when the
          # job runs is correct either way - the range is recomputed from the
          # last release tag, so a merge that landed in between is included
          # rather than skipped.
          ref: main
          # Full history and every tag: the bump is computed from the commit
          # range since the last release tag, and a shallow clone has neither.
          fetch-depth: 0
          # Fetch and push over SSH as the deploy key, so the push is a
          # ruleset-bypass actor (see header).
          ssh-key: ${{ secrets.VERSION_SYNC_DEPLOY_KEY }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: 🧮 Decide the release
        id: plan
        run: python3 tools/release_plan.py decide --github-output

      - name: 🛑 Nothing to release
        if: steps.plan.outputs.bump == 'none'
        run: |
          echo "No feat:, fix: or breaking change since ${{ steps.plan.outputs.current }}."
          echo "Nothing to release, which is a normal outcome for a docs or chore merge."

      - name: 🔍 Check the tag is not already published
        id: exists
        if: steps.plan.outputs.bump != 'none'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already on the remote - an earlier run got there first."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📝 Promote the Unreleased CHANGELOG section
        # Minor and major only. A patch release publishes generated notes from
        # the commit subjects instead and never touches CHANGELOG.md, per the
        # two-tier decision in #285.
        #
        # This runs BEFORE the tag is created, and pushes first, so the tag
        # lands on a commit that already carries the section release.yml will
        # look for. promote_changelog.py is a no-op when the section is already
        # there, so a run that dies between this push and the tag push is fixed
        # by the next run rather than wedging main.
        if: >-
          steps.exists.outputs.published == 'false' &&
          (steps.plan.outputs.bump == 'minor' || steps.plan.outputs.bump == 'major')
        env:
          NEXT: ${{ steps.plan.outputs.next }}
        run: |
          python3 tools/promote_changelog.py "$NEXT"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already carried the [$NEXT] section - nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(plan): open the CHANGELOG section for $NEXT"
          git push

      - name: 🏷️ Tag the release
        if: steps.exists.outputs.published == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          BUMP: ${{ steps.plan.outputs.bump }}
          TIER: ${{ steps.plan.outputs.tier }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha="$(git rev-parse --short HEAD)"
          git tag -a "$TAG" \
            -m "$TAG" \
            -m "Tagged automatically from $sha on a $BUMP bump ($TIER release)."
          if ! git push origin "$TAG"; then
            echo "::error::Pushing $TAG was refused. The protect-release-tags"\
              "ruleset blocks creation on refs/tags/v*, so the deploy key used"\
              "here has to be listed among its bypass actors the way it already"\
              "is on protect-main. Nothing was released; main is unchanged apart"\
              "from any CHANGELOG promotion above, which the next run reuses."
            exit 1
          fi
          echo "Pushed $TAG - release.yml takes it from here."

      - name: 📊 Summary
        if: always()
        env:
          BUMP: ${{ steps.plan.outputs.bump }}
          CURRENT: ${{ steps.plan.outputs.current }}
          TAG: ${{ steps.plan.outputs.tag }}
          TIER: ${{ steps.plan.outputs.tier }}
          COMMITS: ${{ steps.plan.outputs.commits }}
        run: |
          {
            echo "## Auto Release"
            echo
            if [ "$BUMP" = "none" ] || [ -z "$BUMP" ]; then
              echo "No release. $COMMITS commit(s) since \`$CURRENT\`, none of them"
              echo "a \`feat:\`, a \`fix:\` or a breaking change."
            else
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Previous release | \`$CURRENT\` |"
              echo "| Commits in range | $COMMITS |"
              echo "| Bump | \`$BUMP\` |"
              echo "| New tag | \`$TAG\` |"
              echo "| Tier | \`$TIER\` |"
              echo
              if [ "$TIER" = "patch" ]; then
                echo "A patch release: generated notes and the source tag, no images."
              else
                echo "A full release: the curated CHANGELOG section and all eight images."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
