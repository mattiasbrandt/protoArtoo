name: Release

# Purely additive to verification.yml — triggers only on a vX.Y.Z tag push,
# never on branch push/PR, so the existing PR/merge gate is unaffected.
on:
  push:
    tags:
      - 'v*.*.*'

# One run per tag; never cancel a release mid-publish — a killed publish job
# could leave a half-uploaded release behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Which of the two release tiers is this tag? (#285)
  #
  #   patch — release notes generated from the commit subjects in the range,
  #           and the source tag. No firmware images: a fix should reach people
  #           quickly, and rebuilding four environments for a one-line change
  #           should not gate that.
  #   full  — the curated CHANGELOG.md section as notes, plus all eight
  #           firmware and filesystem images and SHA256SUMS.txt, as v1.2.0 did.
  #
  # Decided by semver alone: a patch release is the only kind whose Z is
  # non-zero, so vX.Y.Z with Z > 0 is a patch and Z == 0 is a minor or major.
  # No history lookup, and no table to keep in step with anything.
  classify:
    name: classify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: 🎚️ Decide the tier
        id: tier
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release_plan.py tier "$TAG" --github-output

  build:
    name: build (${{ matrix.env }})
    needs: classify
    # A patch release ships no images, so the four builds are skipped outright
    # rather than run and thrown away.
    if: needs.classify.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Flashable, user-relevant envs only: one artoo-esp32 image per sound
        # backend, and the FireBeetle 2 image (its default DY-SV5W backend).
        # Adding a future backend or board is one entry here — do not
        # hand-roll more jobs. Excluded on purpose: artoo_esp32_prod
        # (self-build-only), *_check (compile-only), *_profiler* (dev
        # tooling), *_bringup and *_bench (not the firmware), *_ota
        # (identical firmware.bin to its non-OTA counterpart, just a
        # different upload_protocol).
        #
        # Each chip target has its own PlatformIO core dir, as in the
        # Makefile and verification.yml: the classic ESP32 toolchain lives in
        # ~/.platformio, the ESP32-P4 one (a different pioarduino platform
        # version) in ~/.platformio-p4. `pool` names the cache, `core_dir`
        # the directory under $HOME.
        include:
          - env: artoo_esp32_chirp
            pool: classic
            core_dir: .platformio
          - env: artoo_esp32_mp3trigger
            pool: classic
            core_dir: .platformio
          - env: artoo_esp32_dysv5w
            pool: classic
            core_dir: .platformio
          - env: firebeetle2
            pool: p4
            core_dir: .platformio-p4
    steps:
      # Default depth-1 checkout is enough for the version stamp: on a tag
      # push the tag ref itself is fetched, so git describe resolves it at
      # distance 0 (verified by replicating the checkout fetch locally).
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 📦 Install PlatformIO and Python tools
        # Pinned to the core the tree is verified with. An unpinned install
        # picked up PlatformIO 6.2.0 on 2026-09-06, whose tool-scons 4.11
        # fails every env at the link step with "No module named
        # 'SCons.Tool.FortranCommon'"; 6.1.19 with tool-scons 4.8 links all
        # of them. Bump deliberately, with a green run, not by drift.
        run: pip install platformio==6.1.19 && pip install -r tools/requirements.txt

      - name: 💾 Cache PlatformIO packages and toolchains
        uses: actions/cache@v6
        with:
          # Cache the whole core-dir tree for this chip target. The key
          # matches verification.yml's, so a tag build restores the cache
          # the PR gate already filled instead of re-downloading and
          # re-unpacking the ESP-IDF toolchain.
          path: ~/${{ matrix.core_dir }}
          key: ${{ runner.os }}-pio-${{ matrix.pool }}-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-${{ matrix.pool }}-

      # No secrets.h is provisioned here on purpose: release binaries must be
      # built without one so the Developer WiFi Shortcut (ADR 0015) stays
      # unavailable and a fresh controller boots into WiFi Provisioning.
      # Even the placeholder secrets.h.example defines the shortcut macros.
      - name: 🏗️ Build firmware
        run: |
          export PLATFORMIO_CORE_DIR="$HOME/${{ matrix.core_dir }}"
          mkdir -p "$PLATFORMIO_CORE_DIR"
          pio run -e ${{ matrix.env }}

      - name: 🗂️ Build filesystem image
        run: |
          export PLATFORMIO_CORE_DIR="$HOME/${{ matrix.core_dir }}"
          pio run -e ${{ matrix.env }} -t buildfs

      - name: 📦 Stage release artifacts
        run: |
          mkdir -p release-artifacts
          cp .pio/build/${{ matrix.env }}/firmware.bin \
             release-artifacts/${{ matrix.env }}-firmware.bin
          cp .pio/build/${{ matrix.env }}/littlefs.bin \
             release-artifacts/${{ matrix.env }}-filesystem.bin

      - name: ⬆️ Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.env }}
          path: release-artifacts/
          retention-days: 1

  publish:
    name: publish release
    needs: [classify, build]
    # `build` is skipped for a patch tag, and a skipped dependency skips its
    # dependants by default — so publish states the condition itself: run when
    # the tier is known and the builds either passed or were never needed.
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TIER: ${{ needs.classify.outputs.tier }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7
        with:
          # Generated patch notes are read from the commit range since the
          # previous release tag, which a shallow clone does not have.
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: ⬇️ Download all build artifacts
        if: needs.classify.outputs.tier == 'full'
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: 🔏 Generate SHA256 checksums
        if: needs.classify.outputs.tier == 'full'
        run: |
          cd release-artifacts
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 📝 Extract CHANGELOG section for this tag
        # Minor and major only. A missing section fails the release rather than
        # publishing generated notes in its place: a feature reached main with
        # nothing written about it, and a bare heading is worse than stopping.
        # auto-release.yml promotes [Unreleased] into place before it tags, so
        # reaching here without a section means the tag was pushed by hand.
        if: needs.classify.outputs.tier == 'full'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          python3 tools/extract_changelog_section.py "$version" > release-notes.md

      - name: 📝 Generate notes for this patch tag
        # Patch only. Terse, honest and clearly machine-written — an automatic
        # patch release cannot wait for someone to write maker-voice prose,
        # which is the whole reason the two tiers exist (#285).
        if: needs.classify.outputs.tier == 'patch'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release_plan.py notes "$TAG" > release-notes.md
          cat release-notes.md

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Draft-first so watchers never see a release before all assets are
          # attached. A hyphenated semver tag (e.g. v1.0.0-rc.1) is marked
          # prerelease so it can never become the repo's "latest" release.
          args=(--title "$TAG" --notes-file release-notes.md --verify-tag --draft)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          if [ "$TIER" = "full" ]; then
            gh release create "$TAG" "${args[@]}" release-artifacts/*
          else
            # No assets: the glob would expand to nothing and take the command
            # with it, so a patch release is its own line rather than a clever
            # empty array.
            gh release create "$TAG" "${args[@]}"
          fi
          gh release edit "$TAG" --draft=false
