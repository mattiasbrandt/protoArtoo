name: Verification

# Every `uses:` is pinned to a full commit SHA with its `# vX.Y.Z`, and a new
# action lands pinned the same way (#473). Dependabot's grouped weekly
# updates move the pins.
#
# Shape (#473, #355): `changes` sorts the changed files into one class per
# job (tools/ci_changes.py); the two boards and the checks run as parallel
# jobs on the shared setup (.github/actions/setup), each board job and each
# classed check only when its class is on; the final job, named
# `verification` because protect-main requires that name, writes the summary,
# posts the pull request comment and is the gate. It fails on any job that
# failed, was cancelled, or was skipped for any reason but its own class
# saying `false`.

on:
  pull_request:
    branches:
      - main
  push:
    # An epic branch is verified on every push too, so a long epic is not
    # first checked by its closure pull request (#473: epic/operator-experience
    # went its whole life without a run).
    branches:
      - main
      - 'epic/**'
    # A commit that only touches Markdown cannot change what the firmware
    # does, with one exception: docs/spec-sheets/. Every wiring card in
    # docs/products.yaml cites sections of its product's sheet, and the drift
    # check that generates the Wiring page's partial under data/ refuses a
    # citation of a section the sheet no longer has
    # (tools/generate_wiring_cards.py, #458, #475), so a sheet edit has to run
    # it. No other .md file is shipped in the image or compiled in. The list reads top down and the last match wins:
    # everything, minus Markdown and LICENSE, plus the spec sheets again.
    #
    # This filter only decides whether a push starts a run at all. Inside a
    # run, push and pull request alike, `changes` decides which jobs it needs
    # from the files themselves. A pull request has no filter here, because
    # GitHub evaluates pull_request path filters against the whole PR diff,
    # not the commit just pushed, so they would never skip anything on a
    # branch that also carries code.
    paths:
      - '**'
      - '!**/*.md'
      - '!LICENSE'
      - 'docs/spec-sheets/**'
  workflow_dispatch:

# Workflow-level default: read-only. Each job widens only what it needs:
# `changes` reads the pull request's file list, `verification` posts the
# sticky comment.
permissions:
  contents: read

# One run per pull request or epic branch: a newer push supersedes the run in
# flight, which otherwise keeps a 20-minute build alive for a commit nobody is
# waiting on any more. A run on main and a manual dispatch each get a group of
# their own (the run id), because cancel-in-progress: false only spares the
# run in progress: GitHub still cancels a PENDING run in the same group when a
# newer one queues. Shared, version-sync's bot push would cancel a merge's
# pending run on main, and an epic push would cancel a dispatch. main keeps a
# result for every commit.
concurrency:
  group: verification-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/epic/')) }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Version-sync's bot commit pushes via a deploy key, and deploy-key
    # pushes (unlike GITHUB_TOKEN pushes) trigger on:push workflows. A
    # version-JSON-only commit needs no verification run - skip it. Every
    # other job needs this one, so they skip with it; `verification` repeats
    # the guard because it runs always().
    if: github.event_name != 'push' || github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
    permissions:
      contents: read
      pull-requests: read
    # One output per job class, each `true` or `false`, and `reasons`, the
    # Markdown the summary shows. Which paths turn which class on is
    # tools/ci_changes.py's to say, not this file's.
    outputs:
      boards: ${{ steps.changes.outputs.boards }}
      native: ${{ steps.changes.outputs.native }}
      analysis: ${{ steps.changes.outputs.analysis }}
      web: ${{ steps.changes.outputs.web }}
      tools: ${{ steps.changes.outputs.tools }}
      reasons: ${{ steps.changes.outputs.reasons }}
    steps:
      # The classifier and nothing else: it is stdlib Python and runs on the
      # runner's own python3, so this job needs no setup. A push to main also
      # takes the whole history, for the release tags it is classified
      # against. (fetch-depth is written as `!= main ... && 1 || 0` because 0
      # is falsy in an expression: `== main && 0 || 1` would always say 1.)
      - name: ⬇️ Checkout the classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: tools/ci_changes.py
          sparse-checkout-cone-mode: false
          fetch-depth: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') && 1 || 0 }}

      - name: 🧭 Decide which jobs run
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Every way of not knowing the files runs every class: a manual
          # dispatch, a new branch (no `before`), main with no release tag
          # behind it, a compare that fails, a force push (anything but
          # `ahead`), or a list at the API's cap (300 files for a compare,
          # 3000 for a pull request), which may be cut short.
          # A rename passes its old path too: moving a file out of data/
          # changes the image as much as editing it does.
          reasons="$RUNNER_TEMP/reasons.md"
          files="$RUNNER_TEMP/files.txt"
          emit() {
            { echo 'reasons<<REASONS_EOF'; cat "$reasons"; echo 'REASONS_EOF'; } >> "$GITHUB_OUTPUT"
            cat "$reasons"
          }
          all() {
            python3 tools/ci_changes.py --all "$1" --explain "$reasons" >> "$GITHUB_OUTPUT"
            emit
            exit 0
          }
          case "$EVENT" in
            pull_request)
              gh api "repos/$REPO/pulls/$PR/files" --paginate \
                --jq '.[] | .filename, (.previous_filename // empty)' > "$files" ||
                all "the pull request's files could not be listed"
              [ "$(gh api "repos/$REPO/pulls/$PR" --jq .changed_files)" -lt 3000 ] ||
                all "the pull request lists 3000 files or more"
              ;;
            push)
              # On main the range starts at the latest release tag the pushed
              # commit carries, not at `before`. auto-release.yml tags main's
              # tip on this run's `verification` job, so a green gate there
              # has to cover every unreleased commit: classified from
              # `before`, a docs push after a red run would come out green
              # and let a minor or major be tagged over the failure. From the
              # tag, a docs push right after a release runs nothing heavy,
              # and while a feat or fix is unreleased every push runs what
              # that code needs.
              if [ "$REF" = refs/heads/main ]; then
                base=$(git describe --tags --abbrev=0 --match 'v*' "$SHA") ||
                  all "no release tag is reachable from the pushed commit"
                range="the range since $base"
              else
                [ -n "${BEFORE//0/}" ] || all "a new branch"
                base=$BEFORE
                range="the pushed range"
              fi
              compare="$RUNNER_TEMP/compare.json"
              gh api "repos/$REPO/compare/$base...$SHA" > "$compare" ||
                all "$range could not be compared"
              status=$(jq -r .status "$compare")
              [ "$status" = ahead ] || all "$range is $status, not ahead"
              [ "$(jq '.files | length' "$compare")" -lt 300 ] ||
                all "$range lists 300 files or more"
              jq -r '.files[] | .filename, (.previous_filename // empty)' "$compare" > "$files"
              ;;
            *)
              all "a $EVENT run"
              ;;
          esac
          python3 tools/ci_changes.py --explain "$reasons" < "$files" >> "$GITHUB_OUTPUT"
          emit

  # ── Boards ─────────────────────────────────────────────────────────────────
  # One job per board, each on its own PlatformIO core dir and cache. A board
  # job that succeeds saves its cache; one that fails saves nothing, so a
  # pool a failed build left broken is never restored by the next run.
  #
  # Each job reports its rows as `outcome<TAB>label<TAB>command<TAB>class`
  # lines and the budget script's headroom table as outputs; `verification`
  # renders them. A board row's class is `boards`.

  artoo:
    name: artoo
    needs: changes
    if: needs.changes.outputs.boards == 'true'
    runs-on: ubuntu-26.04
    # A warm run builds in ~10 min (profiler build, firmware, buildfs); a
    # cold one adds the toolchain download. Without a limit a hung pio holds
    # the runner for GitHub's 6 h default.
    timeout-minutes: 45
    outputs:
      rows: ${{ steps.record.outputs.rows }}
      headroom: ${{ steps.build-budgets.outputs.headroom }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🧰 Set up the build
        uses: ./.github/actions/setup
        with:
          pool: classic
          cache-name: artoo

      - name: 🔑 Provision CI placeholder secrets.h
        run: cp src/secrets.h.example src/secrets.h

      - name: 🏗️ Profiler build
        id: profiler-build
        run: pio run -e artoo_esp32_profiler

      - name: 🏗️ Build and size budgets
        id: build-budgets
        # Runs after a failed profiler build too: the two images are
        # independent, and one failing must not hide the other.
        if: ${{ !cancelled() }}
        # This step IS the firmware build: a build that fails and a build that
        # overruns its budget both fail it. The headroom table is published
        # whatever the verdict.
        run: |
          set +e
          python3 tools/check_build_budgets.py --env artoo_esp32 --summary headroom.md
          code=$?
          if [ -f headroom.md ]; then
            { echo 'headroom<<HEADROOM_EOF'; cat headroom.md; echo 'HEADROOM_EOF'; } >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      # The budget script keeps every pio run's whole output in build-logs/
      # and prints only the tail of a failed one; a link error can start
      # above it.
      - name: 📤 Upload build logs
        if: ${{ !cancelled() && steps.build-budgets.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-logs-${{ github.job }}
          path: build-logs/
          retention-days: 7

      - name: 🧾 Record results
        id: record
        if: always()
        env:
          PROFILER_OUTCOME: ${{ steps.profiler-build.outcome }}
          BUDGETS_OUTCOME: ${{ steps.build-budgets.outcome }}
        run: |
          {
            echo 'rows<<ROWS_EOF'
            printf '%s\t%s\t%s\t%s\n' "$PROFILER_OUTCOME" "Profiler build" "pio run -e artoo_esp32_profiler" boards
            printf '%s\t%s\t%s\t%s\n' "$BUDGETS_OUTCOME" "artoo_esp32 build and size budgets" "python3 tools/check_build_budgets.py --env artoo_esp32" boards
            echo 'ROWS_EOF'
          } >> "$GITHUB_OUTPUT"

  firebeetle2:
    name: firebeetle2
    needs: changes
    if: needs.changes.outputs.boards == 'true'
    runs-on: ubuntu-26.04
    # A cold ESP32-P4 build is ~7.5 min (2026-10-06), plus the penv pin and
    # the toolchain download.
    timeout-minutes: 40
    outputs:
      rows: ${{ steps.record.outputs.rows }}
      headroom: ${{ steps.build-budgets.outputs.headroom }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🧰 Set up the build
        uses: ./.github/actions/setup
        with:
          pool: p4
          cache-name: firebeetle2

      - name: 🔑 Provision CI placeholder secrets.h
        run: cp src/secrets.h.example src/secrets.h

      - name: 🏗️ Build and size budgets
        id: build-budgets
        run: |
          set +e
          python3 tools/check_build_budgets.py --env firebeetle2 --summary headroom.md
          code=$?
          if [ -f headroom.md ]; then
            { echo 'headroom<<HEADROOM_EOF'; cat headroom.md; echo 'HEADROOM_EOF'; } >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: 📤 Upload build logs
        if: ${{ !cancelled() && steps.build-budgets.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-logs-${{ github.job }}
          path: build-logs/
          retention-days: 7

      - name: 🧾 Record results
        id: record
        if: always()
        env:
          BUDGETS_OUTCOME: ${{ steps.build-budgets.outcome }}
        run: |
          {
            echo 'rows<<ROWS_EOF'
            printf '%s\t%s\t%s\t%s\n' "$BUDGETS_OUTCOME" "firebeetle2 build and size budgets" "python3 tools/check_build_budgets.py --env firebeetle2" boards
            echo 'ROWS_EOF'
          } >> "$GITHUB_OUTPUT"

  # ── Checks ─────────────────────────────────────────────────────────────────
  # Every check step uses continue-on-error: true so every check runs
  # regardless of earlier failures; the job's own gate at the end fails it if
  # any check did not succeed. steps.<id>.outcome reflects the actual
  # pass/fail even when continue-on-error is set. Native tests, static
  # analysis, the web tests and the tooling tests each run only when their
  # class is on; every other check runs on every event.

  checks:
    name: checks
    needs: changes
    runs-on: ubuntu-26.04
    # Native tests ~3 min, static analysis ~2 min, the rest seconds each,
    # plus a cold classic platform and the native toolchain.
    timeout-minutes: 40
    outputs:
      rows: ${{ steps.record.outputs.rows }}
    env:
      NATIVE: ${{ needs.changes.outputs.native }}
      ANALYSIS: ${{ needs.changes.outputs.analysis }}
      WEB: ${{ needs.changes.outputs.web }}
      TOOLS: ${{ needs.changes.outputs.tools }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🧰 Set up the build
        uses: ./.github/actions/setup
        with:
          # PlatformIO only for the checks that use it: the native tests and
          # static analysis run pio, and the tooling tests read platformio.ini
          # through PlatformIO's own config parser (test_asset_sets.py,
          # test_build_budgets.py), skipping those cases when it is missing.
          pool: ${{ (needs.changes.outputs.native == 'true' || needs.changes.outputs.analysis == 'true' || needs.changes.outputs.tools == 'true') && 'classic' || '' }}
          cache-name: checks

      - name: 🔧 Install cppcheck
        if: needs.changes.outputs.analysis == 'true'
        run: sudo apt-get install -y --no-install-recommends cppcheck

      - name: 🔑 Provision CI placeholder secrets.h
        run: cp src/secrets.h.example src/secrets.h

      - name: 🧪 Native tests
        id: native-tests
        continue-on-error: true
        if: needs.changes.outputs.native == 'true'
        run: pio test -e native

      # check_severity in platformio.ini only filters what is printed;
      # cppcheck exits 0 whatever it finds unless told which severity fails.
      - name: 🔍 Static analysis
        id: static-analysis
        continue-on-error: true
        if: needs.changes.outputs.analysis == 'true'
        run: pio check -e artoo_esp32 --fail-on-defect=high

      - name: 📋 Action registry drift
        id: action-drift
        continue-on-error: true
        run: make check-action-drift

      - name: 🧩 Component registry drift
        id: component-drift
        continue-on-error: true
        run: make check-component-drift

      - name: 📌 Pin drift
        id: pin-drift
        continue-on-error: true
        run: make check-pin-drift

      # The Surface Anatomy's two mechanical rules (#399, ADR 0066): no
      # pictograph on a surface the sweep has reached, and every icon
      # reference resolving against the sprite data/shell.js injects. It runs
      # here, beside the other three report-never-rewrite checks, because an
      # unresolved <use> renders an empty box and says nothing at all.
      - name: 🎨 Surface Anatomy
        id: surface-anatomy
        continue-on-error: true
        run: make check-surface-anatomy

      # #298 banned the bare word "controller" in operator copy unconditionally
      # and #348 swept it out. Nothing mechanical stopped it coming back, and
      # nothing else in this workflow reads copy, so it runs here beside the
      # other report-never-rewrite checks (#353).
      - name: 🗣️ Vocabulary drift
        id: vocabulary-drift
        continue-on-error: true
        run: make check-vocabulary-drift

      # The glossary is GLOSSARY.md since 50c74203. The slice gate refuses the
      # old name on lines a slice adds (tools/slice_verify.py OLD_GLOSSARY_RE);
      # this is the backstop for a commit that never went through the gate.
      # The brackets keep the pattern from matching this file.
      - name: 📖 Glossary name
        id: glossary-name
        continue-on-error: true
        run: |
          if git grep -nE 'CONTEXT[.]md|CONTEXT[-]MAP'; then
            echo "The glossary is GLOSSARY.md; the lines above use its old name." >&2
            exit 1
          fi

      # No operator surface keeps its own copy of one board's wiring (ADR 0033).
      # It also runs the pin comparison #367 owns, so the two halves of the same
      # question answer in one place (#353).
      - name: 🔖 Board label drift
        id: board-label-drift
        continue-on-error: true
        run: make check-board-label-drift

      # "There is no second palette to drift against" (GLOSSARY.md "Status
      # Color"). The stylesheet's own half is test_style_token_layer.js, in the
      # web suite below; this is everything else data/ paints with (#353).
      - name: 🎨 Color drift
        id: color-drift
        continue-on-error: true
        run: make check-color-drift

      # docs/servo-motion.yaml generates the planner ServoTask moves with and
      # the one the Rehearsal times a move with (#439). The tooling tests below
      # run the same check; this names it in the summary beside the other
      # report-never-rewrite checks.
      - name: 🦾 Servo motion drift
        id: servo-motion-drift
        continue-on-error: true
        run: make check-servo-motion-drift

      # The browser half of the protocol-check corpus: data/seq_protocol_check.js
      # against test/fixtures/protocol_mirror.json. Its firmware half is the
      # native test test_protocol_mirror; this half ran nowhere in CI (#473).
      - name: 🪞 Protocol mirror
        id: protocol-mirror
        continue-on-error: true
        run: make check-protocol-mirror

      - name: 🌐 Web logic tests
        id: web-tests
        continue-on-error: true
        if: needs.changes.outputs.web == 'true'
        run: node --test test/test_web/*.js

      # Host-side checks on the repo's own tooling and build description:
      # the budgets registry, the slice gate's self-tests, and the guard
      # that every env in platformio.ini resolves a PA_BOARD flag. The
      # v1.1.0 release run found three envs without one; nothing here built
      # them, and this suite is where that is caught in seconds. The make
      # target also runs the test/test_tools/*.js files, which unittest
      # discovery never sees.
      - name: 🧰 Tooling tests
        id: tooling-tests
        continue-on-error: true
        if: needs.changes.outputs.tools == 'true'
        run: make test-tools

      # Each budgeted env is one board job above. A board added to
      # tools/build_budgets.json and not to this workflow would never be built
      # here, so the set is held to the two jobs that exist.
      - name: 🧮 Board jobs cover the budgets
        id: board-jobs
        continue-on-error: true
        run: |
          envs=$(python3 -c 'import json; print(" ".join(sorted(json.load(open("tools/build_budgets.json"))["envs"])))')
          if [ "$envs" != "artoo_esp32 firebeetle2" ]; then
            echo "tools/build_budgets.json budgets: $envs" >&2
            echo "verification.yml has board jobs for: artoo_esp32 firebeetle2" >&2
            echo "Add a board job for each new env in .github/workflows/verification.yml (and its row here)." >&2
            exit 1
          fi

      # Lints every workflow, with ShellCheck on each workflow run: block, and
      # checks the inputs each workflow passes the shared setup action. It does
      # not lint the composite action's own run: blocks. A pinned release
      # binary, checked against the digest actionlint's own checksums file
      # lists for it, rather than an action.
      - name: 🧹 actionlint
        id: actionlint
        continue-on-error: true
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # actionlint skips its ShellCheck pass silently when the binary is
          # missing, so its absence fails the row instead.
          command -v shellcheck
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: 🧾 Record results
        id: record
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.native-tests.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.static-analysis.outcome }}
          DRIFT_OUTCOME: ${{ steps.action-drift.outcome }}
          COMPONENT_DRIFT_OUTCOME: ${{ steps.component-drift.outcome }}
          PIN_DRIFT_OUTCOME: ${{ steps.pin-drift.outcome }}
          ANATOMY_OUTCOME: ${{ steps.surface-anatomy.outcome }}
          VOCABULARY_OUTCOME: ${{ steps.vocabulary-drift.outcome }}
          GLOSSARY_NAME_OUTCOME: ${{ steps.glossary-name.outcome }}
          BOARD_LABEL_OUTCOME: ${{ steps.board-label-drift.outcome }}
          COLOR_OUTCOME: ${{ steps.color-drift.outcome }}
          SERVO_MOTION_OUTCOME: ${{ steps.servo-motion-drift.outcome }}
          PROTOCOL_MIRROR_OUTCOME: ${{ steps.protocol-mirror.outcome }}
          WEB_OUTCOME: ${{ steps.web-tests.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling-tests.outcome }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          BOARD_JOBS_OUTCOME: ${{ steps.board-jobs.outcome }}
        run: |
          # The last field is the row's class: `always` for a check that runs
          # on every event, so its skip can never pass the gate below.
          row() { printf '%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4"; }
          {
            row "$TESTS_OUTCOME"           "Native tests"             "pio test -e native" native
            row "$ANALYSIS_OUTCOME"        "Static analysis"          "pio check -e artoo_esp32 --fail-on-defect=high" analysis
            row "$DRIFT_OUTCOME"           "Action registry drift"    "make check-action-drift" always
            row "$COMPONENT_DRIFT_OUTCOME" "Component registry drift" "make check-component-drift" always
            row "$PIN_DRIFT_OUTCOME"       "Pin drift"                "make check-pin-drift" always
            row "$ANATOMY_OUTCOME"         "Surface Anatomy"          "make check-surface-anatomy" always
            row "$VOCABULARY_OUTCOME"      "Vocabulary drift"         "make check-vocabulary-drift" always
            row "$GLOSSARY_NAME_OUTCOME"   "Glossary name"            "git grep for the old glossary name" always
            row "$BOARD_LABEL_OUTCOME"     "Board label drift"        "make check-board-label-drift" always
            row "$COLOR_OUTCOME"           "Color drift"              "make check-color-drift" always
            row "$SERVO_MOTION_OUTCOME"    "Servo motion drift"       "make check-servo-motion-drift" always
            row "$PROTOCOL_MIRROR_OUTCOME" "Protocol mirror"          "make check-protocol-mirror" always
            row "$WEB_OUTCOME"             "Web logic tests"          "node --test test/test_web/*.js" web
            row "$TOOLING_OUTCOME"         "Tooling tests"            "make test-tools" tools
            row "$BOARD_JOBS_OUTCOME"      "Board jobs cover the budgets" "tools/build_budgets.json envs" always
            row "$ACTIONLINT_OUTCOME"      "Workflow lint"            "actionlint" always
          } > "$RUNNER_TEMP/rows.tsv"
          { echo 'rows<<ROWS_EOF'; cat "$RUNNER_TEMP/rows.tsv"; echo 'ROWS_EOF'; } >> "$GITHUB_OUTPUT"

      # A skipped check passes ONLY when `changes` positively said its own
      # class is `false` -- the one condition under which it was deliberately
      # not run; an empty or missing answer fails closed, and an `always`
      # row has no class to say so. Skipped for any other reason is a
      # failure, so a step that never executes can never quietly satisfy
      # the gate.
      - name: 🚦 Fail if any check failed
        if: always()
        run: |
          failed=()
          while IFS=$'\t' read -r outcome label _ class; do
            [ "$outcome" = success ] && continue
            case "$class" in
              native) said=$NATIVE ;;
              analysis) said=$ANALYSIS ;;
              web) said=$WEB ;;
              tools) said=$TOOLS ;;
              *) said="" ;;
            esac
            [ "$outcome" = skipped ] && [ "$said" = false ] && continue
            failed+=("$label ($outcome)")
          done < "$RUNNER_TEMP/rows.tsv"
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'Failed: %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All checks passed."

  # ── Gate ───────────────────────────────────────────────────────────────────

  verification:
    name: verification
    needs: [changes, artoo, firebeetle2, checks]
    # always(), not !cancelled(): a skipped required check counts as passed,
    # so a cancelled run must still reach this job and fail here. The bot
    # guard repeats the one on `changes`, since always() would otherwise run
    # this job on version-sync's commit.
    if: always() && (github.event_name != 'push' || github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📊 Write run summary
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ARTOO_RESULT: ${{ needs.artoo.result }}
          FIREBEETLE2_RESULT: ${{ needs.firebeetle2.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          ARTOO_ROWS: ${{ needs.artoo.outputs.rows }}
          FIREBEETLE2_ROWS: ${{ needs.firebeetle2.outputs.rows }}
          CHECKS_ROWS: ${{ needs.checks.outputs.rows }}
          REASONS: ${{ needs.changes.outputs.reasons }}
          ARTOO_HEADROOM: ${{ needs.artoo.outputs.headroom }}
          FIREBEETLE2_HEADROOM: ${{ needs.firebeetle2.outputs.headroom }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mark() {
            case "$1" in
              success) echo "✅" ;;
              skipped) echo "⏭️" ;;
              *) echo "❌" ;;
            esac
          }
          job() { echo "| $(mark "$2") | $1 | $2 |"; }
          headroom() {
            [ -n "$2" ] || return 0
            printf '\n### Headroom: %s\n\n%s\n' "$1" "$2"
          }
          {
            echo "## 🤖 Verification"
            echo ""
            if [ -n "$REASONS" ]; then
              echo "### Which classes ran"
              echo ""
              printf '%s\n' "$REASONS"
              echo ""
            fi
            echo "| | Job | Result |"
            echo "|---|---|---|"
            job changes "$CHANGES_RESULT"
            job artoo "$ARTOO_RESULT"
            job firebeetle2 "$FIREBEETLE2_RESULT"
            job checks "$CHECKS_RESULT"
            echo ""
            echo "| | Check | Command | Class | Status |"
            echo "|---|---|---|---|---|"
            printf '%s\n' "$ARTOO_ROWS" "$FIREBEETLE2_ROWS" "$CHECKS_ROWS" |
              while IFS=$'\t' read -r outcome label cmd class; do
                [ -n "$outcome" ] || continue
                case "$outcome" in
                  success) status="Passed" ;;
                  skipped) status="Skipped" ;;
                  *) status="**Failed** ($outcome)" ;;
                esac
                echo "| $(mark "$outcome") | $label | \`$cmd\` | $class | $status |"
              done
            headroom artoo_esp32 "$ARTOO_HEADROOM"
            headroom firebeetle2 "$FIREBEETLE2_HEADROOM"
            echo ""
            echo "Run: [$(date -u '+%Y-%m-%d %H:%M UTC')]($RUN_URL)"
          } | tee .ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 💬 Post PR comment
        # Not on a cancelled run: a superseded run must not post its partial
        # table over the newer one. The gate below keeps always().
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: verification
          path: .ci-summary.md

      # `changes` and `checks` must succeed. A board job skipped passes only
      # when `changes` positively said `boards=false`; an empty or missing
      # answer fails closed. Skipped, failed or cancelled for any other
      # reason fails the required check. `checks` judges its own skipped
      # steps by their classes.
      - name: 🚦 Gate - fail if any job did not succeed
        if: always()
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ARTOO_RESULT: ${{ needs.artoo.result }}
          FIREBEETLE2_RESULT: ${{ needs.firebeetle2.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BOARDS: ${{ needs.changes.outputs.boards }}
        run: |
          failed=()
          [ "$CHANGES_RESULT" = success ] || failed+=("changes ($CHANGES_RESULT)")
          [ "$CHECKS_RESULT" = success ] || failed+=("checks ($CHECKS_RESULT)")
          for job in "artoo $ARTOO_RESULT" "firebeetle2 $FIREBEETLE2_RESULT"; do
            name=${job% *} result=${job#* }
            [ "$result" = success ] && continue
            [ "$result" = skipped ] && [ "$BOARDS" = false ] && continue
            failed+=("$name ($result)")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'A required job did not succeed: %s\n' "${failed[@]}"
            exit 1
          fi
          echo "Every job passed."
