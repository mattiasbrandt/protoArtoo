name: Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Workflow-level default: read-only. Pull-requests: write is scoped to the job
# that posts the sticky comment, not applied globally.
permissions:
  contents: read

jobs:
  verification:
    name: verification
    runs-on: ubuntu-latest
    # Version-sync's bot commit now pushes via a deploy key, and deploy-key
    # pushes (unlike GITHUB_TOKEN pushes) trigger on:push workflows. A
    # version-JSON-only commit needs no verification run — skip it.
    if: github.event_name != 'push' || github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 🔧 Install cppcheck
        run: sudo apt-get install -y --no-install-recommends cppcheck

      - name: 📦 Install PlatformIO and Python tools
        # Pinned to the core the tree is verified with. An unpinned install
        # picked up PlatformIO 6.2.0 on 2026-09-06, whose tool-scons 4.11
        # fails every env at the link step with "No module named
        # 'SCons.Tool.FortranCommon'"; 6.1.19 with tool-scons 4.8 links all
        # of them. Bump deliberately, with a green run, not by drift.
        run: pip install platformio==6.1.19 && pip install -r tools/requirements.txt

      - name: 💾 Cache PlatformIO packages and toolchains (classic)
        uses: actions/cache@v6
        with:
          # Cache the whole ~/.platformio tree (platforms, packages, toolchains,
          # library downloads) — not just the download cache — so a warm run
          # skips re-downloading and re-unpacking the ESP-IDF toolchain, cppcheck,
          # etc. Build artifacts (.pio/build/) are never cached and must not be
          # treated as verification evidence.
          path: ~/.platformio
          key: ${{ runner.os }}-pio-classic-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-classic-

      - name: 💾 Cache PlatformIO packages and toolchains (ESP32-P4)
        uses: actions/cache@v6
        with:
          # Separate cache for P4 toolchain (different pioarduino platform version)
          path: ~/.platformio-p4
          key: ${{ runner.os }}-pio-p4-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-p4-

      - name: 🟢 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔑 Provision CI placeholder secrets.h
        run: cp src/secrets.h.example src/secrets.h

      # ── Checks ───────────────────────────────────────────────────────────────
      # All check steps use continue-on-error: true so every check runs
      # regardless of earlier failures. The gate step at the end fails the job
      # if any check did not succeed. steps.<id>.outcome reflects the actual
      # pass/fail even when continue-on-error is set.

      - name: 🏗️ Firmware build
        id: firmware-build
        continue-on-error: true
        run: pio run -e artoo_esp32

      - name: 🏗️ Profiler build
        id: profiler-build
        continue-on-error: true
        run: pio run -e artoo_esp32_profiler

      - name: 🏗️ FireBeetle 2 build (full firmware)
        id: firebeetle2-full-build
        continue-on-error: true
        run: mkdir -p ~/.platformio-p4 && PLATFORMIO_CORE_DIR=~/.platformio-p4 pio run -e firebeetle2

      - name: 📏 Build size budgets
        id: build-budgets
        continue-on-error: true
        run: python3 tools/check_build_budgets.py

      - name: 🧪 Native tests
        id: native-tests
        continue-on-error: true
        run: pio test -e native

      - name: 🔍 Static analysis
        id: static-analysis
        continue-on-error: true
        run: pio check -e artoo_esp32

      - name: 📋 Action registry drift
        id: action-drift
        continue-on-error: true
        run: make check-action-drift

      - name: 🌐 Web logic tests
        id: web-tests
        continue-on-error: true
        run: node --test test/test_web/*.js

      # Host-side checks on the repo's own tooling and build description:
      # the budgets registry, the slice gate's self-tests, and the guard
      # that every env in platformio.ini resolves a PA_BOARD flag. The
      # v1.1.0 release run found three envs without one; nothing here built
      # them, and this suite is where that is caught in seconds.
      - name: 🧰 Tooling tests
        id: tooling-tests
        continue-on-error: true
        run: python3 -m unittest discover -s test/test_tools -q

      # ── Summary ──────────────────────────────────────────────────────────────

      - name: 📊 Write run summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.firmware-build.outcome }}
          PROFILER_OUTCOME: ${{ steps.profiler-build.outcome }}
          FIREBEETLE2_OUTCOME: ${{ steps.firebeetle2-full-build.outcome }}
          BUDGETS_OUTCOME: ${{ steps.build-budgets.outcome }}
          TESTS_OUTCOME: ${{ steps.native-tests.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.static-analysis.outcome }}
          DRIFT_OUTCOME: ${{ steps.action-drift.outcome }}
          WEB_OUTCOME: ${{ steps.web-tests.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling-tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          row() {
            local outcome="$1" label="$2" cmd="$3"
            if [ "$outcome" = "success" ]; then
              echo "| ✅ | $label | \`$cmd\` | Passed |"
            else
              echo "| ❌ | $label | \`$cmd\` | **Failed** |"
            fi
          }

          {
            echo "## 🤖 Verification"
            echo ""
            echo "| | Check | Command | Status |"
            echo "|---|---|---|---|"
            row "$BUILD_OUTCOME"     "Firmware build"       "pio run -e artoo_esp32"
            row "$PROFILER_OUTCOME"  "Profiler build"       "pio run -e artoo_esp32_profiler"
            row "$FIREBEETLE2_OUTCOME" "FireBeetle 2 build"  "pio run -e firebeetle2"
            row "$BUDGETS_OUTCOME"   "Build size budgets"   "python3 tools/check_build_budgets.py"
            row "$TESTS_OUTCOME"    "Native tests"          "pio test -e native"
            row "$ANALYSIS_OUTCOME" "Static analysis"      "pio check -e artoo_esp32"
            row "$DRIFT_OUTCOME"    "Action registry drift" "make check-action-drift"
            row "$WEB_OUTCOME"      "Web logic tests"       "node --test test/test_web/*.js"
            row "$TOOLING_OUTCOME"  "Tooling tests"         "python3 -m unittest discover -s test/test_tools -q"
            echo ""
            echo "Run: [$(date -u '+%Y-%m-%d %H:%M UTC')]($RUN_URL)"
          } | tee .ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 💬 Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: verification
          path: .ci-summary.md

      # ── Gate ─────────────────────────────────────────────────────────────────
      # Fail the job (and therefore the required status check) if any check
      # did not succeed. Runs after summary so the findings are always visible.

      - name: 🚦 Gate — fail if any check failed
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.firmware-build.outcome }}
          PROFILER_OUTCOME: ${{ steps.profiler-build.outcome }}
          FIREBEETLE2_OUTCOME: ${{ steps.firebeetle2-full-build.outcome }}
          BUDGETS_OUTCOME: ${{ steps.build-budgets.outcome }}
          TESTS_OUTCOME: ${{ steps.native-tests.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.static-analysis.outcome }}
          DRIFT_OUTCOME: ${{ steps.action-drift.outcome }}
          WEB_OUTCOME: ${{ steps.web-tests.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling-tests.outcome }}
        run: |
          failed=()
          [ "$BUILD_OUTCOME"    != "success" ] && failed+=("firmware-build")
          [ "$PROFILER_OUTCOME" != "success" ] && failed+=("profiler-build")
          [ "$FIREBEETLE2_OUTCOME" != "success" ] && failed+=("firebeetle2-full-build")
          [ "$BUDGETS_OUTCOME"  != "success" ] && failed+=("build-budgets")
          [ "$TESTS_OUTCOME"    != "success" ] && failed+=("native-tests")
          [ "$ANALYSIS_OUTCOME" != "success" ] && failed+=("static-analysis")
          [ "$DRIFT_OUTCOME"    != "success" ] && failed+=("action-drift")
          [ "$WEB_OUTCOME"      != "success" ] && failed+=("web-tests")
          [ "$TOOLING_OUTCOME"  != "success" ] && failed+=("tooling-tests")
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed checks: ${failed[*]}"
            exit 1
          fi
          echo "All checks passed."
