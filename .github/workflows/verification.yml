name: Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # A commit that only touches Markdown cannot change what the firmware
    # does: no .md file is shipped in the filesystem image (data/ has none)
    # and none is compiled in. Only push is filtered here -- a pull request
    # is filtered per-PR in the "Decide whether code changed" step, because
    # GitHub evaluates pull_request path filters against the whole PR diff,
    # not the commit just pushed, so they would never skip anything on a
    # branch that also carries code.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

# Workflow-level default: read-only. Pull-requests: write is scoped to the job
# that posts the sticky comment, not applied globally.
permissions:
  contents: read

# One run per pull request. Pushing again supersedes the run already in
# flight, which otherwise keeps a 40-minute build alive for a commit nobody
# is waiting on any more. Runs on main are never cancelled: main's history
# keeps a result for every commit.
concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification:
    name: verification
    runs-on: ubuntu-latest
    # Version-sync's bot commit now pushes via a deploy key, and deploy-key
    # pushes (unlike GITHUB_TOKEN pushes) trigger on:push workflows. A
    # version-JSON-only commit needs no verification run — skip it.
    if: github.event_name != 'push' || github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 🧭 Decide whether code changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Markdown and LICENSE cannot change what the firmware does. Anything
          # else -- .py, .yaml, .json, data/, src/, include/, test/, tools/,
          # platformio.ini, Makefile, .github/workflows/ -- counts as code and
          # runs the full set. The list is deliberately an allow-list of two
          # harmless extensions rather than a deny-list of source directories:
          # a new source directory then fails closed, running everything.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request - running every check."
            exit 0
          fi
          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' || true)
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Could not list the pull request's files - running every check."
            exit 0
          fi
          code=$(printf '%s\n' "$files" | grep -vE '(\.md|^LICENSE)$' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changed - running every check. First 20:"
            printf '%s\n' "$code" | head -20
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only - skipping the builds, budgets, native tests"
            echo "and static analysis. Drift, web and tooling checks still run."
          fi

      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 🔧 Install cppcheck
        if: steps.changes.outputs.code == 'true'
        run: sudo apt-get install -y --no-install-recommends cppcheck

      - name: 📦 Install PlatformIO
        # Pinned to the core the tree is verified with. An unpinned install
        # picked up PlatformIO 6.2.0 on 2026-09-06, whose tool-scons 4.11
        # fails every env at the link step with "No module named
        # 'SCons.Tool.FortranCommon'"; 6.1.19 with tool-scons 4.8 links all
        # of them. Bump deliberately, with a green run, not by drift.
        if: steps.changes.outputs.code == 'true'
        run: pip install platformio==6.1.19

      - name: 📦 Install Python tools
        # Always installed: the drift, web and tooling checks run on every
        # change, including a documentation-only one.
        run: pip install -r tools/requirements.txt

      - name: 💾 Cache PlatformIO packages and toolchains (classic)
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          # Cache the whole ~/.platformio tree (platforms, packages, toolchains,
          # library downloads) — not just the download cache — so a warm run
          # skips re-downloading and re-unpacking the ESP-IDF toolchain, cppcheck,
          # etc. Build artifacts (.pio/build/) are never cached and must not be
          # treated as verification evidence.
          path: ~/.platformio
          key: ${{ runner.os }}-pio-classic-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-classic-

      - name: 💾 Cache PlatformIO packages and toolchains (ESP32-P4)
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          # Separate cache for P4 toolchain (different pioarduino platform version)
          path: ~/.platformio-p4
          key: ${{ runner.os }}-pio-p4-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-p4-

      - name: 🟢 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔑 Provision CI placeholder secrets.h
        run: cp src/secrets.h.example src/secrets.h

      # ── Checks ───────────────────────────────────────────────────────────────
      # All check steps use continue-on-error: true so every check runs
      # regardless of earlier failures. The gate step at the end fails the job
      # if any check did not succeed. steps.<id>.outcome reflects the actual
      # pass/fail even when continue-on-error is set.

      - name: 🏗️ Firmware build
        id: firmware-build
        continue-on-error: true
        if: steps.changes.outputs.code == 'true'
        run: pio run -e artoo_esp32

      - name: 🏗️ Profiler build
        id: profiler-build
        continue-on-error: true
        if: steps.changes.outputs.code == 'true'
        run: pio run -e artoo_esp32_profiler

      - name: 🏗️ FireBeetle 2 build (full firmware)
        id: firebeetle2-full-build
        continue-on-error: true
        if: steps.changes.outputs.code == 'true'
        run: mkdir -p ~/.platformio-p4 && PLATFORMIO_CORE_DIR=~/.platformio-p4 pio run -e firebeetle2

      - name: 📏 Build size budgets
        id: build-budgets
        continue-on-error: true
        if: steps.changes.outputs.code == 'true'
        run: python3 tools/check_build_budgets.py

      - name: 🧪 Native tests
        id: native-tests
        continue-on-error: true
        if: steps.changes.outputs.code == 'true'
        run: pio test -e native

      - name: 🔍 Static analysis
        id: static-analysis
        continue-on-error: true
        if: steps.changes.outputs.code == 'true'
        run: pio check -e artoo_esp32

      - name: 📋 Action registry drift
        id: action-drift
        continue-on-error: true
        run: make check-action-drift

      - name: 🌐 Web logic tests
        id: web-tests
        continue-on-error: true
        run: node --test test/test_web/*.js

      # Host-side checks on the repo's own tooling and build description:
      # the budgets registry, the slice gate's self-tests, and the guard
      # that every env in platformio.ini resolves a PA_BOARD flag. The
      # v1.1.0 release run found three envs without one; nothing here built
      # them, and this suite is where that is caught in seconds.
      - name: 🧰 Tooling tests
        id: tooling-tests
        continue-on-error: true
        run: python3 -m unittest discover -s test/test_tools -q

      # ── Summary ──────────────────────────────────────────────────────────────

      - name: 📊 Write run summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.firmware-build.outcome }}
          PROFILER_OUTCOME: ${{ steps.profiler-build.outcome }}
          FIREBEETLE2_OUTCOME: ${{ steps.firebeetle2-full-build.outcome }}
          BUDGETS_OUTCOME: ${{ steps.build-budgets.outcome }}
          TESTS_OUTCOME: ${{ steps.native-tests.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.static-analysis.outcome }}
          DRIFT_OUTCOME: ${{ steps.action-drift.outcome }}
          WEB_OUTCOME: ${{ steps.web-tests.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling-tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE_CHANGED: ${{ steps.changes.outputs.code }}
        run: |
          row() {
            local outcome="$1" label="$2" cmd="$3"
            if [ "$outcome" = "success" ]; then
              echo "| ✅ | $label | \`$cmd\` | Passed |"
            elif [ "$outcome" = "skipped" ]; then
              echo "| ⏭️ | $label | \`$cmd\` | Skipped — documentation-only change |"
            else
              echo "| ❌ | $label | \`$cmd\` | **Failed** |"
            fi
          }

          {
            echo "## 🤖 Verification"
            echo ""
            if [ "$CODE_CHANGED" != "true" ]; then
              echo "This change touches documentation only, so the builds, budgets,"
              echo "native tests and static analysis were skipped. They run again on"
              echo "the first commit that touches anything else."
              echo ""
            fi
            echo "| | Check | Command | Status |"
            echo "|---|---|---|---|"
            row "$BUILD_OUTCOME"     "Firmware build"       "pio run -e artoo_esp32"
            row "$PROFILER_OUTCOME"  "Profiler build"       "pio run -e artoo_esp32_profiler"
            row "$FIREBEETLE2_OUTCOME" "FireBeetle 2 build"  "pio run -e firebeetle2"
            row "$BUDGETS_OUTCOME"   "Build size budgets"   "python3 tools/check_build_budgets.py"
            row "$TESTS_OUTCOME"    "Native tests"          "pio test -e native"
            row "$ANALYSIS_OUTCOME" "Static analysis"      "pio check -e artoo_esp32"
            row "$DRIFT_OUTCOME"    "Action registry drift" "make check-action-drift"
            row "$WEB_OUTCOME"      "Web logic tests"       "node --test test/test_web/*.js"
            row "$TOOLING_OUTCOME"  "Tooling tests"         "python3 -m unittest discover -s test/test_tools -q"
            echo ""
            echo "Run: [$(date -u '+%Y-%m-%d %H:%M UTC')]($RUN_URL)"
          } | tee .ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 💬 Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: verification
          path: .ci-summary.md

      # ── Gate ─────────────────────────────────────────────────────────────────
      # Fail the job (and therefore the required status check) if any check
      # did not succeed. Runs after summary so the findings are always visible.

      - name: 🚦 Gate — fail if any check failed
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.firmware-build.outcome }}
          PROFILER_OUTCOME: ${{ steps.profiler-build.outcome }}
          FIREBEETLE2_OUTCOME: ${{ steps.firebeetle2-full-build.outcome }}
          BUDGETS_OUTCOME: ${{ steps.build-budgets.outcome }}
          TESTS_OUTCOME: ${{ steps.native-tests.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.static-analysis.outcome }}
          DRIFT_OUTCOME: ${{ steps.action-drift.outcome }}
          WEB_OUTCOME: ${{ steps.web-tests.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling-tests.outcome }}
          CODE_CHANGED: ${{ steps.changes.outputs.code }}
        run: |
          failed=()

          # A skipped check passes ONLY when this change touched nothing but
          # documentation -- the one condition under which it was deliberately
          # not run. Skipped for any other reason is a failure, so a step that
          # never executes can never quietly satisfy the gate.
          check() {
            local outcome="$1" name="$2"
            [ "$outcome" = "success" ] && return 0
            [ "$outcome" = "skipped" ] && [ "$CODE_CHANGED" != "true" ] && return 0
            failed+=("$name")
          }

          check "$BUILD_OUTCOME"        "firmware-build"
          check "$PROFILER_OUTCOME"     "profiler-build"
          check "$FIREBEETLE2_OUTCOME"  "firebeetle2-full-build"
          check "$BUDGETS_OUTCOME"      "build-budgets"
          check "$TESTS_OUTCOME"        "native-tests"
          check "$ANALYSIS_OUTCOME"     "static-analysis"
          check "$DRIFT_OUTCOME"        "action-drift"
          check "$WEB_OUTCOME"          "web-tests"
          check "$TOOLING_OUTCOME"      "tooling-tests"

          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed checks: ${failed[*]}"
            exit 1
          fi
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Documentation-only change: drift, web and tooling checks passed;"
            echo "builds, budgets, native tests and static analysis were skipped."
          else
            echo "All checks passed."
          fi
