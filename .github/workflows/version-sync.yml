name: Version Sync

# CI is the sole authority for data/fw-version.json and data/fs-version.json
# on main: every push regenerates both from the actual merge commit and
# bot-commits them back. This is separate from verification.yml (left
# untouched) and from release.yml (tag-triggered, purely additive).
#
# The push authenticates via a write deploy key (VERSION_SYNC_DEPLOY_KEY
# secret), not GITHUB_TOKEN: the main ruleset requires PRs and status checks,
# GITHUB_TOKEN cannot be a ruleset bypass actor, and "Deploy keys" can.
# Unlike GITHUB_TOKEN pushes, deploy-key pushes DO trigger workflows, so the
# bot-author guard below is load-bearing, not just belt-and-braces.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync-version:
    name: sync version JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip runs triggered by this job's own bot commit, to avoid an infinite loop.
    if: github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Fetch and push over SSH as the deploy key, so the push is a
          # ruleset-bypass actor (see header comment).
          ssh-key: ${{ secrets.VERSION_SYNC_DEPLOY_KEY }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: 🔢 Regenerate version JSON
        run: python3 tools/extract_version.py

      - name: 💾 Commit if changed
        run: |
          if git diff --quiet -- data/fw-version.json data/fs-version.json; then
            echo "Version JSON already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fw-version.json data/fs-version.json
          git commit -m "chore(ci): sync version JSON to $(git rev-parse --short HEAD)"
          git push
