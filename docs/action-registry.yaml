- name: sound.config.mood-category-map
  display_name: Mood Category Map
  description: >
    Per-mood bitmask selecting which of the 12 sound categories contribute to idle random chatter. One uint16 per mood (bits 0–11, one per category in T07 registration order). Stored as four NVS uint16 values. Configurable via GET/POST /api/audio/mood-map. Default bitmasks reflect suggested character-appropriate presets (see T11 spec). A bitmask of 0x0000 disables category-based selection for that mood and falls back to the flat [randMin, randMax] pool.
  domain: sound
  type: config
  marcduino_cmd: null
  api_path: /api/audio/mood-map
  sse_event: null
  cpp_enum: null
  cpp_file: null
  sources: [ internal ]
  safety_critical: false
  requires_web_control: false
  params:
  - name: quiet
    type: uint16
    range: [ 0, 4095 ]
    required: true
  - name: mid
    type: uint16
    range: [ 0, 4095 ]
    required: true
  - name: full
    type: uint16
    range: [ 0, 4095 ]
    required: true
  - name: awakeplus
    type: uint16
    range: [ 0, 4095 ]
    required: true
  nvs_keys:
  - snd_moodcat_q # Quiet (mood 10) — default 0x0048
  - snd_moodcat_m # Mid-Awake (mood 13) — default 0x004F
  - snd_moodcat_f # Full-Awake (mood 11) — default 0x090F
  - snd_moodcat_a # Awake+ (mood 14) — default 0x0F8F

