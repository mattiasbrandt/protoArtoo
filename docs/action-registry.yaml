# protoArtoo Action Registry
# ===========================
# Source of truth for all robot actions, API endpoints, SSE events, and RC-bindable targets.
#
# Naming convention:
#   name:          {domain}.{type}.{verb-noun}  — dots between structural segments, kebab within
#   display_name:  Short operator-facing label; domain and type are NOT repeated here
#   domain:        drive | dome | sound | servo | system | rc | aux | wifi
#   type:          action (command/intent) | status (observable state) |
#                  event (SSE emission) | config (NVS-backed setting)
#
# audio <-> sound boundary:
#   Registry names, display labels, and web UI use "sound".
#   C++ symbols (enums, class names, file names) use "audio" — matching the library layer.
#
# How to add a new entry:
#   1. Add the YAML entry here first (docs/action-registry.yaml).
#   2. If bindable (cpp_file: include/rc_mapping.h): add the RobotActionId enum value
#      in include/rc_mapping.h and add rc_token here.
#   3. Add/update C++ runtime registry, token parse/format, dispatch, and JS fallback
#      rows as needed.
#   4. Run `make check-action-drift` to verify YAML, C++, and RC fallback metadata align.
#   5. Add a native test if the new action involves parsing or transformation logic.
#   6. If safety_critical: true — verify all 5 failsafe layers still hold.
#
# Drift checker:
#   `make check-action-drift` runs tools/check_action_registry_drift.py.
#   It is an ad hoc verification tool; it reports drift and never rewrites files.
#
# C++ enum naming:
#   RobotActionId values follow DOMAIN_ACTION_VERB_NOUN (e.g. DRIVE_ACTION_SPEED).
#   Other enums (AudioCommandType, ServoCommandType) are scoped to their subsystem
#   and do not need to match the registry name format — they are implementation detail.
#
# NVS keys are not the registry's to record. Every Setting's key - the droid's
# and each audio Setting's - lives in its one declaration, src/config_settings.cpp
# (ADR 0068, amended 2026-09-26). The stored records that are not Settings (the
# RC Map, the Output rows, Device WiFi Settings, the Droid Build, guided Setup's
# record, the CHIRP bindings) keep their keys beside their own serializers.
# `board_capability` and `build_flag` each name at most one declaration from
# include/board_capabilities.inc and include/build_flags.inc. An absent field
# means the entry is universal for that compile-time tier (ADR 0029).
#
# Outputs are named by the running board, never here (CONTEXT.md "Output Address",
# ADR 0033 Amendment 2026-09-19). The registry is one file for every board, so:
#   board_output: true   on a param means its value is one of the running board's
#                        Output labels (ARM1..ARM5 on artoo_esp32, GPIO 49 .. GPIO 51
#                        on firebeetle2; include/component_labels.inc), matched
#                        without regard to case or spaces. `values:` beside it lists
#                        the extra words it also takes (`both`).
#   output: <id>         on an entry means it is about one Output, by its stored id
#                        (arm1..aux3). `{output}` in its display_name and description
#                        is replaced at runtime by that Output's label on the running
#                        board: GET /api/actions and Console help say "ARM3 Toggle"
#                        on the Artoo and "GPIO 4 Toggle" on the FireBeetle 2.
#
## Runtime action registry API notes:
## - GET /api/actions returns bindable actions with token + testability metadata.
## - `token` maps to robotActionIdToString() and is accepted by POST /api/actions/test.
## - `rc_token` is required for entries with cpp_file: include/rc_mapping.h.
## - `testable` is false for analog actions, payload-required actions, and system.action.estop.
## - POST /api/rc/map accepts the same token set except `none`. `dome_seq` requires a valid DM:<NAME> payload.
