- name: system.api.get-profiler
  display_name: Get Heap Profiler Snapshot
  description: Memory and stack snapshot. Only in a profiling build.
  domain: system
  # Reclassified from type: action by #224. It reads and returns a snapshot and
  # changes nothing, which is what type: status means here - the same
  # reclassification #221 made for dome.api.list-sequences and
  # dome.api.list-builtin-sequences (9ddc93a) when they were wired as Console
  # queries. Consequence in the Console: type decides dispatch, and only the
  # status path emits the begin/field/item/end group a snapshot needs; the
  # action path answers one result record and has no shape for it.
  type: status
  build_flag: PA_HEAP_PROFILE
  marcduino_cmd: null
  api_path: /api/profiler
  sse_event: null
  cpp_enum: null
  cpp_file: src/web/api_profiler.cpp
  sources:
  - web_api
  safety_critical: false
  requires_web_control: false
  # The core beneath both adapters after #224's extraction: GET /api/profiler
  # renders profilerRead()'s ProfilerReading as JSON, the Console renders the
  # same reading as records. buildProfilerJson() is the HTTP adapter over it,
  # not the core, so naming it here would name an adapter.
  executor: profilerRead
  # Item-based query, the no-fields:/is_query:-true shape #239 established for
  # system.status.logs: the answer is scalar fields plus repeated item records
  # (per-task stack marks, mode windows, request-lifecycle rows), not a flat
  # list of JSON keys. A fields: list would also be unverifiable - the JSON
  # builder it would be checked against is inside #if PA_HEAP_PROFILE and is
  # absent from the native test binary by construction.
  is_query: true
- name: system.action.profiler-trace-start
  display_name: Start Heap Trace
  description: Start a memory leak trace. Only in a tracing build, and a busy console shows up in it.
  domain: system
  type: action
  build_flag: PA_HEAP_TRACING
  marcduino_cmd: null
  api_path: /api/profiler/trace/start
  sse_event: null
  cpp_enum: null
  cpp_file: src/web/api_profiler.cpp
  sources:
  - web_api
  safety_critical: false
  requires_web_control: false
  # profilerTraceStart()/profilerTraceStop() (include/api_profiler.h) are the
  # cores POST /api/profiler/trace/start|stop and the Console both call after
  # #224's extraction: they own s_traceRunning, the state that decides between
