- name: servo.api.get-outputs
  display_name: Get Servo Outputs
  description: Every servo output, the parts on it, and where it was told to be. Nothing reads a servo back.
  domain: servo
  type: status
  marcduino_cmd: null
  api_path: /api/servo/outputs
  sse_event: null
  cpp_enum: null
  cpp_file: src/web/api_config.cpp
  sources:
  - web_api
  safety_critical: false
  requires_web_control: false
  # #362: item-indexed over the live Servo Output rows - one item per row, keyed
  # by the REST answer's own JSON names, `-` for an absent value - the same
  # no-fields:/is_query:-true shape system.api.get-components uses for an answer
  # that is a sequence of item records. SERVO_OUTPUT_ROW_MAX bounds it by
  # construction, so no paging protocol is needed. It answered
  # executor-not-ready until #362 (#347 left the record shape open): the bench
  # side needs it, because on a FireBeetle 2 with no WiFi the Console is the
  # only route to what each output drives and where it stands. The Console
  # executor, consoleExecuteServoApiGetOutputs(), reads the rows and the
  # commanded position through the same two functions handleServoOutputsGet()
  # does, so the adapters cannot disagree.
  executor: configCacheReadServoOutput
  is_query: true
