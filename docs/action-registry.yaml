# protoArtoo Action Registry
# ===========================
# Source of truth for all robot actions, API endpoints, SSE events, and RC-bindable targets.
#
# Naming convention:
#   name:          {domain}.{type}.{verb-noun}  — dots between structural segments, kebab within
#   display_name:  Short operator-facing label; domain and type are NOT repeated here
#   domain:        drive | dome | sound | servo | system | rc
#   type:          action (command/intent) | status (observable state) |
#                  event (SSE emission) | config (NVS-backed setting)
#
# audio <-> sound boundary:
#   Registry names, display labels, and web UI use "sound".
#   C++ symbols (enums, class names, file names) use "audio" — matching the library layer.
#
# How to add a new entry:
#   1. Add the YAML entry here first (docs/action-registry.yaml).
#   2. If bindable (type: action, sources includes sbus): add to RobotActionId enum
#      in include/rc_mapping.h and to ACTION_REGISTRY[] in include/action_registry.h.
#   3. Add the API handler or queue case as needed.
#   4. Add a native test if the new action involves parsing or transformation logic.
#   5. If safety_critical: true — verify all 5 failsafe layers still hold.
#
# C++ enum naming:
#   RobotActionId values follow DOMAIN_ACTION_VERB_NOUN (e.g. DRIVE_ACTION_SPEED).
#   Other enums (AudioCommandType, ServoCommandType) are scoped to their subsystem
#   and do not need to match the registry name format — they are implementation detail.
#
# NVS keys are NOT renamed to match registry names. The registry documents the mapping
# between a config entry's canonical name and its NVS key in the `nvs_key` field.

