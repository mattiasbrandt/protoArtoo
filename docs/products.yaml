        - "The droid does not read ELRS yet. With it picked, the sticks do nothing."
      source: "4.1"
    notes: |
      ELRS is Roadmap in public wording (operator, 2026-10-06); the registry row
      still says supported and follows in #477. The controller reads no ELRS input
      yet. Picking it stores the `elrs` RC input mode, and the RC path then behaves
      exactly as with no receiver fitted: no decoder and no RC task start, and the
      feet are held by the stale web drive command and the estop. That is the
      Wiring card's hazard ("the sticks do nothing"), and the only proof of it is
      the code, not the spec sheet.

      The safety model inverts. The two radio Failsafe Layers are the receiver
      hardware failsafe flag and the SBUS timeout (`SBUS_TIMEOUT_MS`, 200 ms). CRSF
      has no flag: on link loss the receiver stops sending. The first layer has
      nothing to read and the timeout becomes the only radio protection. The TBS
      specification advises waiting a second before failsafe; that is aircraft
      advice. The recommendation is to keep 200 ms for CRSF and record that the
      second was declined on purpose, not by oversight.

      What protoArtoo would have to do:

      The UART. SBUS costs no UART because it is decoded on RMT; CRSF at 420 kbaud
      is UART work. artoo-esp32's three UARTs are all committed (console, drive, and
      one shared by the dome link and the audio RX, with audio TX already
      bit-banged). firebeetle2's UART4 is unclaimed. So the Board Capability Gate is
      probably {firebeetle2}, but say it honestly: "no spare UART for CRSF on
      artoo-esp32, and freeing one would cost the dome link or the console", not
      "impossible". ShadyRC runs CRSF on a classic ESP32's three UARTs by moving the
      slow devices to software serial, which is what artoo-esp32 already does for
      audio TX. It still does not fit: UART0 is a real console, the dome link is
      bidirectional and timing-sensitive, and a 420 kbaud stream is the least
      suitable thing on the board to bit-bang. Open question: can artoo-esp32 free
      a UART, which decides whether the Gate is a fact or an assumption.

      The decoder is small, because CRSF's channel values are SBUS's
      (172 / 992 / 1811):
      - New: frame sync, length and CRC-8 (`0xD5`); the 11-bit unpack into 16
        channels.
      - Unchanged: the value domain, RC bindings, calibration, deadband and
        reverse, and the per-channel raw / normalized / mapped diagnostics (raw is
        already this domain).
      - Failsafe: the receiver-flag layer goes; the timeout becomes the only radio
        layer.
      - The `elrs` input mode already exists as a stored answer; the decoder is what
        is missing.
      Extended limits on the handset widen the range to 0-1984, outside the SBUS
      defaults; per-channel min/max calibration already allows for that.

      The failsafe design, which is the real work:
      1. Keep the 200 ms timeout and record the declined one-second advice.
      2. Zero the cached channel values on link loss, not merely stop acting on
         them (ShadyRC does this). It covers the unknown window where a receiver
         may repeat stale data before going silent.
      3. Require an arm channel: a switch position read every tick, not a toggle.
         With no failsafe flag the arming gate does safety work.
      4. Come back disarmed and slow; a reconnect never resumes at speed.
      5. Feed the existing `FailsafeGate` rather than a parallel path; an ELRS link
         loss is the same class of event as an SBUS timeout.

      Library: `AlfredoCRSF` is sound for a real-time path. Read
      `getChannelsPacked()` for the raw domain (`getChannel()` converts to
      microseconds), and keep our own 200 ms timeout rather than the library's
      300 ms `checkLinkDown()`.

      Link quality: channel 15 carries uplink link quality for free in every mode
      except full-resolution 16-channel, readable through the binding model with no
      telemetry parsing; parsing frame `0x14` adds RSSI, SNR, antenna and RF mode.
      Either way this is the first RC member that can say the link is getting worse,
      not only that it failed, and the Status Plate's RC-link chip is where that
      belongs.

      Telemetry, out of scope for a first driver: CRSF is full duplex, so the droid
      could report to the operator's handset. The frames fit state the droid
      already holds: battery (`0x08`) from the drive feedback battery reading,
      temperature (`0x0D`) from the board temperature, RPM (`0x0C`) from the
      left and right speeds, and a short status string (`0x21`) for estop, armed and
      speed preset. Whether a first implementation sends any of it is scope, not
      research.

      Costs to state plainly: a UART (firebeetle2 only); a small new decoder; a
      failsafe redesign, because the receiver-flag layer stops existing; an arm
      channel, which changes how a builder drives the droid; and a builder-side
      provisioning story (binding phrase, packet rate, switch mode, telemetry ratio,
      receiver baud), all set outside protoArtoo.

      Interference with our own AP: ELRS at 2.4 GHz and the droid's WiFi AP share
      the band on one droid; nobody has measured what the receiver does to the AP.
      Bench test: run both and watch link quality and AP throughput together.

      The hobby's own ELRS droid control has been announced three times and built
      once (ShadyRC Crossfire). protoArtoo would not be following a finished peer;
      it would arrive at about the same time as CHIRP Droid Control.

      No ELRS receiver has run on this project's hardware.

