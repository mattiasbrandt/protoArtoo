      AstroPixelsPlus have no body link and no `DV:` / `DL:` / `DT:` / `DH:` layer: on any
      of them the structured commands match nothing and are dropped in silence, so an
      AstroPixels set with other firmware gets the raw Marcduino families at best.

      The registry row names the firmware, not the product. Part 13 is called
      "AstroPixels Plus" on the Component Picker card, but a builder buys an AstroPixels
      set and then flashes AstroPixelsPlus onto it. Recorded as drift, not corrected: the
      `astropixels_plus` id is persisted in NVS and never renamed, and the visible name is
      an operator decision. GLOSSARY.md, docs/topology.md, docs/goal.md and
      docs/terminology.md make the same substitution ("AstroPixelsPlus-class board").

      Baud: the body is fixed at 9600 and cannot tell "no dome" from "dome at 2400". A dome
      flashed from scratch, or after `#APZERO`, is at 2400 until `mserial2` is set. Idea,
      not built: after N failed 9600 probes, probe at 2400 and report "dome found at 2400,
      set mserial2 to 9600" instead of "no dome".

      Health: the fork publishes `body_link` and `visual_authoring` telemetry on its own
      `/api/health`, over HTTP. The body never reads it; its view of dome health is one
      bit, a heartbeat inside 5 s.

      Gaps and findings against the fork, outside this repo:
      - `*RD00` has no handler. The fork has `*RD01`-`*RD03` but not the all-holos form
        from the standard ShadowMD button table; `*ON00`, `*OF00` and `*ST00` exist, so it
        is a one-registration gap.
      - `DH:` color tokens ORANGE and YELLOW look swapped. The fork's
        `parseVisualHoloColor` sends ORANGE as HP color 2 and YELLOW as 7, and Reeltwo
        23.5.3 numbers HP 2 Yellow and 7 Orange; PURPLE goes out as 6, Magenta. Read from
        source, not seen on a dome.
      - `DL:...:WHITE` is not white. ReelTwo logics have no white, so the fork maps WHITE
        to the palette default, while the authoring contract lists WHITE as valid and
        telemetry reports the requested color: `/api/health` says WHITE for a display
        that is not white. `DH:` WHITE is real white (HP 9).
      - `DH:` names holos by letter (F/R/T/A), which keeps it clear of the fork's
        `@7` = top / `@8` = rear swap; raw `@7`/`@8` from a JawaLite table move the wrong
        holo.

      The structured layer ran on a dome on 2026-06-22, one case per family:
      `DL:LOGIC:MARCH:RED:5`, `DT:FLD:DEFAULT:5:0:TEST%0ATEXT`, `DH:A:FLASH:RED:5` and
      `DV:RESET_VISUALS`, all applied with `reject_count` 0.

      Logic settings do not survive a dome reboot (the sheet, "Brightness is the current
      knob"), which is why `DV:` / `DL:` re-assert visual state at the start of a sequence
      rather than assuming it.

      Panels: the sheet's panel map is read from the fork's source. docs/droid-parts.yaml
      keeps `dome_link_panel` TBD until a hardware check that each `:OPnn` moves the named
      panel on the droid; #386 carries the proposed values.

      The fork's `DM:` vocabulary is 40 names, ported from Jessica Janiuk's
      `thePunderWoman/AstroPixelsPlus` fork and adapted. docs/sequence-parity.md lists all
      of them except `DM:RANDOM`.

      Command length: DomeTxCmd holds 64 bytes and `domeQueueTx()` truncates silently, and
      the SEQ_FALLBACK path forwards unvalidated `DM:*` names. Whether the body ever emits
      a line over 63 characters is unchecked: a length assertion in `domeQueueTx()`, or a
      native test over every emitted string, would settle it. Raw `*` commands are
      forwarded uninterpreted, so an operator can reach `*HPS303` (the sheet's crash Open
      Item).

      Costs of the fork:
      - A second firmware with its own release cycle, web UI, NVS and update path: two OTA
        stories, not one.
      - It rewrites the control layer rather than patching it, is far ahead of upstream,
        and is not headed upstream. The divergence is a maintenance obligation.
      - A sequence that uses fork-only commands (`@nT12`/`15`/`22`/`24`, `DV:` / `DL:` / `DT:` / `DH:`)
        is not portable to another droid's dome.

      The fork finds the body by mDNS at `protoartoo.local`, with a manual `bodypeerip`
      override. The WiFi fallback needs dome and body on the same network, which an
      AP-mode dome is not.

      Current draw has not been measured on this droid: an inline meter on the dome 5 V
      feed, idle and during `DV:SCREAM`, would settle it.

  - value: 14
    id: teeces
    name: Teeces
    family: dome_controller
    protocol: tbd
    status: roadmap
    confirmed_on_droid: false
    capabilities: []
    gate: null
    included: 0
    sheet: teeces-dome-lighting.md
    notes: |
      Teeces is roadmap: no driver ships, and the registry's protocol stays `tbd`
      until #313 decides. AstroPixels Plus is the Dome Controller this project
      reaches today because it is the kit the operator installed (#303,
      2026-09-07); that is project history, not a verdict on either product. A
      Teeces does not speak protoR2link: it is a light kit with a small
      serial-commanded microcontroller, and that difference is the whole
      integration problem.

      Component Protocol: the research of 2026-09-10 resolves `tbd` to JawaLite. It
      changes the driver, so by #303's test it is a protocol, not configuration.
      JEDI Display and the R-Series Logic Engine speak it too; if either joins the
      lineup, JawaLite earns its own protocol sheet beside the product sheet, the
      split the SBUS protocol sheet and the HotRC sheet already model.

      The dome link already matches JawaLite on the wire: 9600 8N1, one ASCII
      command per line ending in `\r`, a 64-byte queue message that equals the
      Teeces command buffer, and the raw `@` family already reaches the dome.

      What would have to change. The gap is narrow; the first item is the whole of
      the framing work:
      1. Strip the `@`. The body forwards `@...` verbatim, which is right for
         AstroPixels Plus (it emulates a MarcDuino) and wrong for a Teeces, which
         expects what a MarcDuino slave emits. Supporting Teeces means the body
         performs the slave's hop.
      2. Widen the accepted letter set. The protocol check accepts only `T`, `P`
         and `M` after the address digit; Teeces needs `S` (PSI state) and
         optionally `R` (random style). `@0S1` is rejected today.
      3. Re-target the reset pair. The sequence engine, the dispatcher and the
         catalog's terminal steps emit `@0T1` / `@0P1`. `@0T1` is right on both
         products; `@0P1` is a silent no-op on a Teeces, whose PSI reset is `0S1`.
      4. Decide what `DL:` means on a monochrome dome. Its color argument and the
         `RAINBOW` and `FLASHCOLOR` modes have no Teeces meaning. ADR 0045's
         intent-not-truth rule gives the answer shape: the model records what was
         commanded, never what the device shows, so a color can be accepted and
         reported while the device ignores it. That is a decision for #313. Our
         AstroPixelsPlus fork already has a one-value version of the problem: it
         maps `WHITE` to `kDefault` because Reeltwo logics have no white.
      5. Map `DL:` targets onto the real address map. `DL:`'s `FLD` is singular;
         JawaLite has two front displays at addresses 1 and 2. The droid parts
         catalog already says "Front Logic Displays", plural.
      6. Rate-limit: 100 ms between commands, 250 ms after a text set. The dome
         link has no such spacing today.
      7. Do not parse the return path. A Teeces echoes and acknowledges about 40
         bytes per command and sends a bare `0x07` on rejection; the dome RX parser
         must not take any of it as a dome line.

      Board Capability Gate: almost certainly none. A Teeces reaches the body over
      the same single UART lane at the same baud as AstroPixels Plus, so any board
      wired for one can be wired for the other. It is a Component Member question:
      under ADR 0042 a member setting appears because the family would then hold two
      selectable products.

      The other product shape, open on #313: our AstroPixelsPlus dome fork already
      compiles Reeltwo's MAX7219 chain driver. It includes `TeecesPSI.h` and
      `TeecesLogics.h` and instantiates a `LedControlMAX7221<5>` chain, bound to the
      Charge Bay Indicator and Data Panel rather than to any Teeces object. So an
      AstroPixels-class ESP32 could run Teeces boards directly, as Reeltwo's
      `teecesLogics` example does, and JawaLite would then live on the dome side of
      protoR2link. Reeltwo's Teeces logic classes use their own command grammar,
      not JawaLite; only `TeecesPSI` is JawaLite-addressable. Whether the body
      speaks JawaLite or a dome-side board does is the design decision #313 makes
      before the framing work is scoped.

      ShadowMD binds logic-display types 5, 7 and 8 to `@0T10`, `@0T92` and
      `@0T100` + `@0M<text>`: inert on AstroPixels Plus, live on a Teeces. ADR
      0045's reason for keeping the raw families forwarding - a builder's bindings
      are worth more than our internal tidiness - points straight at this.

      Baud per unit: a Teeces bought from Printed Droid today is 9600 and matches
      the dome lane; a second-hand board on the CuriousMarc default is 2400 and
      needs reflashing or a lane change. Confirm per unit.

      Licence: the boards, the classic sketch and Teeces-ESP32 carry no licence
      identifier. It matters only if this project vendors their code or board files.

      No Teeces has run on this project's hardware, and no bench measurement of one
      exists.

