      contract. It is also false on FireBeetle 2, where audio has a hardware UART of
      its own and nothing is bit-banged. The token travels in the identity manifest
      to the browser, so a rename (`dy_uart` or `dy_serial` would match the siblings)
      is a decision with a compatibility question attached, not a typo fix. Not
      changed.

      Reply checksum: `sendQuery()` callers check the start byte, the command byte and
      (in `queryModuleState()`) the length byte, then use the payload; the trailing
      `SM` is read and thrown away, so a corrupted payload byte in a reply is
      believed. `Lenoirio/dy-sv5w` makes the same call; `SnijderC/dyplayer` checks
      it. Cheap to add and testable natively with the recording IO, but it is a
      behaviour change to a shipping driver. The queries inside `begin()` check only
