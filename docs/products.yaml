# protoArtoo Products
# ===================
# Source of truth for every Component Family and every product in it: what the
# Component Registry declares (ADR 0042 as amended 2026-09-09), each product's
# spec sheet, its wiring card, and the project's own notes about it.
#
# AFTER EDITING THIS FILE, REGENERATE:
#
#     python3 tools/generate_component_registry.py
#     python3 tools/generate_wiring_cards.py
#
# The first rewrites include/component_registry.inc, the X-macro manifest the
# firmware tables, the identity payload and the operator lineup all expand.
# The second rewrites Wiring's product cards,
# data/asset-sets/default/_wiring_cards.html, and its empty counterpart
# data/_wiring_cards.html. Editing this file without regenerating them leaves
# the firmware and the Wiring page stale against it; `make check-action-drift`
# fails while they disagree, and never rewrites either.
#
# Nothing reads this file at runtime. It is generated into the firmware and the
# image at build time.
#
# FAMILIES, in the order the registry declares them:
#   id          the stable token the JSON payload reports the family under
#   enumerator  its C++ enumerator
#   name        the operator-visible family name
#   member_key  the NVS key of its Component Member Setting, or null where it
#               has none (one exists only where more than one member is
#               selectable)
#   comment     prose above the family's row in the registry, or absent
#   section     the banner above the family's products in the registry
#
# PRODUCTS, grouped by family, in the order the registry lists them:
#   value       stable numeric id, unique across the registry. A Component
#               Member setting persists it, so it is never reused and never
#               renumbered; a new product takes the next free value
#   id, name    the payload token and the operator-visible product name
#   family      a family id above
#   protocol    the Component Protocol token firmware speaks to it
#   status      supported (a driver ships) or roadmap (planned, not built)
#   confirmed_on_droid
#               true where it has run on a real droid; a roadmap product never
#               is. `confirmed_source` says where that claim comes from
#   capabilities
#               the family's capability bits it can be asked, as C++ tokens;
#               [] is "nothing to ask"
#   gate        the Board Capability Gate it needs, or null for none
#   included    whether this image carries its driver, as the C expression the
#               registry compiles (0 for every roadmap product)
#   sheet       its spec sheet under docs/spec-sheets/, or null
#   wiring_card how to wire and power it, on Wiring (#458). Generated for a
#               supported product only. Every line is proven by a section of
#               `sheet` that `source` names, by number or by whole title; a
#               value the sheet does not know is written UNKNOWN. Quoted
#               strings only, ASCII only, and never "lead", "driven" or "drives"
#   notes       the project's own specifics about the product
#
# The column-by-column contract, and the reasons behind each rule, are in the
# header of include/component_registry.inc.

categories_banner: The seven categories (#303, resolved by the operator 2026-09-07).

families:
  - id: body_controller
    enumerator: COMPONENT_CATEGORY_BODY_CONTROLLER
    name: Body Controller
    member_key: null
    section: |
      Body Controller -- the board hosting protoArtoo. "more to come"; the category
      is open (#303). Neither row is driven by protoArtoo, so neither declares a
      protocol: the running image IS the answer to which one is fitted, which is
      why `included` tests PA_BOARD rather than a capability.

  - id: radio_controller
    enumerator: COMPONENT_CATEGORY_RADIO_CONTROLLER
    name: Radio Controller
    member_key: rc_member
    comment: |
      The Radio Controller's member is the radio a builder holds (operator,
      2026-09-18 on #369). "rc_member" is its NVS key (the rcMember Setting, src/config_settings.cpp).
    section: |
      Radio Controller -- the RC Radio a builder holds and the RC Receiver it
      talks to, both members of this one category (GLOSSARY.md "RC Radio";
      operator, 2026-09-18 on #369).

      The radios are the family's cards and its Component Member (rc_member). A
      radio row declares the `rc_receiver` protocol: the controller never hears the
      radio itself, only the receiver it talks to. "RC Radio" is the glossary's
      generic term and the answer for every radio not listed by name; its card is
      pictured with a RadioMaster TX16S.

      The receivers are the chosen radio's sub-selection, and the protocol each
      declares is the wire the controller reads - which is what picking one
      writes, as rc_input_mode. ELRS is selectable and the controller reads no
      input from it yet: with it chosen the RC path behaves exactly as with no
      receiver fitted (src/tasks/rc_input_step.cpp starts no decoder for a mode it
      does not read). Its ids still say `transmitter`, which the glossary avoids;
      renaming them moves the photographs, their handler and the drawings, and is
      recorded on #369 rather than done here.

  - id: body_servo_controller
    enumerator: COMPONENT_CATEGORY_BODY_SERVO_CONTROLLER
    name: Body servo controller
    member_key: srv_member
    comment: |
      The Body servo controller has two selectable members once the PCA9685 is
      built (#444), so it has a member setting: "srv_member", the bodyServoMember
      Setting (src/config_settings.cpp).
    section: |
      Body servo controller -- what drives the body's servos. The first row is the
      MCU's own LEDC PWM on the body controller board's GPIO, and is named for what
      a builder sees rather than for the peripheral: "LEDC does not make sense for
      an operator" (operator, 2026-09-18 on #369). Its card borrows the running
      board's picture. The spec sheets keep the technical name.

      Choosing the PCA9685 ADDS its sixteen Outputs, `pca:0`-`pca:15`, and the
      board's GPIO Outputs keep working beside them (operator, 2026-09-30, #444;
      the ADR 0042 note): two backends, never one Output shared between them. It
      needs no Board Capability Gate - the I2C header is declared on both boards,
      and whether the expander answers is a runtime fact the droid reports. The
      board's GPIO is the family's default member because it is the first
      selectable row here (componentCategoryDefaultMember()): a controller that
      has never been told keeps driving what it always drove.

  - id: dome_rotation
    enumerator: COMPONENT_CATEGORY_DOME_ROTATION
    name: Dome Rotation
    member_key: null
    section: |
      Dome Rotation -- what turns the dome.

  - id: dome_controller
    enumerator: COMPONENT_CATEGORY_DOME_CONTROLLER
    name: Dome Controller
    member_key: null
    section: |
      Dome Controller -- the dome's own board, panels and lighting, over protoR2link.
      Teeces' protocol is genuinely undecided and says so rather than guessing;
      #313 resolves it.

  - id: foot_drive
    enumerator: COMPONENT_CATEGORY_FOOT_DRIVE
    name: Foot Drive
    member_key: null
    section: |
      Foot Drive -- what drives the feet.

      The capability word is the ONE declaration of whether a Foot Drive reports
      readings back (include/drive_capabilities.h). The drive backend profile reads
      the hoverboard's bit from this row rather than restating it
      (include/drive_backend.h), and the Foot Drive page reads it off the lineup,
      so neither can disagree with the row. The two roadmap rows declare 0: whether
      a Sabertooth or a VESC reports back over the seam is #304's open follow-up,
      and a bit on either row would answer it here.

  - id: sound
    enumerator: COMPONENT_CATEGORY_SOUND
    name: Sound
    member_key: snd_member
    comment: |
      Sound carries more than one selectable member, so it has a Component Member
      setting. "snd_member" is its NVS key
      (the soundMember Setting, src/config_settings.cpp); 10 characters, clear of
      the 15-character Preferences ceiling.
    section: |
      Sound -- the sound module, and the only Component Family with more than one
      selectable member. All three supported modules bolt to PIN_AUDIO_TX
      (include/config.h, include/audio_chirp.h, include/audio_mp3trigger.h), so no
      board narrows the set and every image carries all three drivers.

      These capability words are the ONE declaration of what each module can be
      asked: the concrete drivers return them from capabilities() rather than
      restating them (include/audio_chirp.h, include/audio_dy_sv5w.h,
      include/audio_mp3trigger.h), so a row and its driver cannot drift apart.

      AUDIO_CAP_MIXES (a Background Track under vocals, ADR 0054) is CHIRP's alone:
      it is the only member with more than one stream. DY-SV5W and MP3 Trigger play
      one sound at a time.

      DFPlayer Mini declares 0 because nobody has read its protocol against this
      bitmask yet, not because it can be asked nothing. #305 declares its bits when
      it builds the driver; until then 0 is the honest word for "none declared".

