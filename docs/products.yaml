  - value: 2
    id: firebeetle2
    name: FireBeetle 2 (ESP32-P4)
    family: body_controller
    protocol: none
    status: supported
    confirmed_on_droid: false
    capabilities: []
    gate: null
    included: (PA_BOARD == PA_BOARD_FIREBEETLE2)
    sheet: firebeetle2-esp32-p4-spec-sheet.md
    wiring_card:
      supply: "5 V DC, on USB-C or VIN"
      draw: "80 mA idle. WiFi peaks at 1330 mA as an access point, 1050 mA joined to a network"
      logic: "3.3 V only"
      wires:
        - { from: "VIN", to: "a 5 V supply", note: "sized for the WiFi peak" }
      hazards:
        - "No GPIO header pin takes 5 V. The 5 V rail is power only."
      source: "Electrical Summary"
    notes: |
      Supported, and not yet a board to buy for a droid. The reasons are the board
      facts in the sheet's "Before you buy one": a DFRobot-acknowledged bad batch
      whose C6 cannot join WiFi, a recovery that needs a wired reflash on 2 mm bare
      pads, and a factory C6 that refuses the wire-free update. A wire reflash is a
      developer bring-up expedient, not a builder path: it breaks the promise that a
      droid is built without soldering and flashed from the web. None of this applies
      to the artoo-esp32.

      What changes that verdict: DFRobot shipping corrected boards or a corrected
      factory C6 image. A successful repair on our bench does not change it, and nor
      do more good boards arriving, because neither tells a builder what is in the
      box they would be opening.

      The two bench boards (both chip revision v1.3):
      - Board 1 is the misprovisioned unit. Its link never came up. #198 tried the
        wired C6 reflash and closed not planned on 2026-09-07: the C6 latches
        IO8 = 0 at every reset, so it never enters UART download mode, and IO8 is not
        on any pad. A full 4 MB read worked on 2026-08-22 with IO8 high, so the fault
        most likely came from the pad work, not from DFRobot; it is not part of the
        vendor escalation. The C6 was never erased or written. Board 1 now runs main
        as the bench's WiFi-module-absent fixture and may be flashed freely.
      - Board 2 provisions correctly and runs the shipping firebeetle2 image: link
        up, HTTP, SSE and the web UI served over it. Its C6 flash contents are
        UNKNOWN and stay that way: reading them needs the same 2 mm pad contact, and
        board 2 gets no pad work and its C6 is not reflashed, because it is the
        project's only working C6.

      Programming the C6: the pad order, the 5 V-to-NC hazard and the reflash
      sequence in the sheet came out of #198 (Phase A, the 118-cycle passive boot
      log; Phase B, the jig attempts, one of which lost pad 3 inside 15 s). #198
      holds the full working notes, the strap diagnosis and the do-not-repeat list. The reflash
      sequence has never been carried to completion here.

      C6 updates over SDIO: refused by the factory C6 (ADR 0034 records the
      measurement on board 2 and why update support is discovered, not declared).
      Proving the update path needs a C6 already running an OTA-capable slave image,
      and neither board can provide one without reflashing board 2's working C6. It
      is recorded as a risk, not carried as a ticket nobody can action.

  # ---------------------------------------------------------------------------
  # Radio Controller
  # ---------------------------------------------------------------------------
  - value: 3
    id: hotrc_ds650
    name: HotRC DS-650
    family: radio_controller
    protocol: rc_receiver
    status: supported
    confirmed_on_droid: true
    confirmed_source: "operator, 2026-09-30, #455."
    capabilities: []
    gate: null
    included: 1
    sheet: hotrc-ds650-radio.md
    wiring_card:
      supply: "built-in 1S lithium, 1500 mAh, charged over USB-C"
      draw: "UNKNOWN. The 1200 mAh handset before it ran out inside a field day"
      logic: "none: it reaches the droid by radio, through its receiver"
      wires: []
      hazards:
        - "CCS holds the throttle with your thumb off the stick. The droid keeps going and cannot tell."
        - "The handset will not switch off while its receiver has power. Power the droid down first."
      source: "4.1, 4.3"
    notes: |
      The DS-650 is the handset every RC bench result in this project was taken
      against, paired with separately bought HotRC SBUS-A receivers (the bundled
      F-06A is PWM and runs through standard_pwm). The firmware has no HotRC
      calibration table and should not get one: the handset is set up to fit the
      generic 172 / 992 / 1811 binding.

      T19 bench record (2026-04-15 to 2026-04-18). Its sources -
      tasks/phase5-tasks.md T19, tasks/lessons.md, tasks/phase5-verification-closeout.md
      and tasks/rc_diagnostics_contract.md - are local and untracked, so this digest
      is the only tracked home of the record:
      - The SBUS-A clocks about 115 kbaud (8.68 us per bit). With the RMT decoder's
        fixed period of 10 ticks, 98.4 % of frames failed to extract (commit
        a26aaae2). The adaptive period estimate gives 9 ticks.
      - Gap-tick lesson: the last RMT symbol carries the ~300-tick inter-frame gap.
        Including it in the period sum rounds 9 up to 10 and fails ~98 % of frames,
        so the estimate excludes the last symbol. Native decode tests pin it.
      - Before per-byte start-bit re-sync (+/-1 bit), no frame with CH1 above 1472
        decoded across a full stick sweep.
      - The footer is 0x04. The original 0x00-only check rejected 100 % of frames;
        the decoder now accepts 0x00 or low nibble 0x04, as bolderflight/sbus does.
      - invertBits=true and the 200 kbaud attempt produced 75 % of the
        header-mismatch noise and no decodes; d9f4a50e removed both. The five-step
        decode fix is commits 6f5a9d42, d9f4a50e, c4ccfdbd, b86a1bf5 and a26aaae2.
      - Parity gating was tried and rejected: at 115 kbaud the bit-run expansion
        shifts parity positions and every frame fails. It is on the no-backtracking
        list; do not re-attempt it without new telemetry. parityFailCount and its
        log plumbing exist, but nothing increments the counter.
      - Factory-stroke sweep: CH1 ~255 / rest ~1472 / ~1919, CH2 ~97 to ~2028 with
        rest ~1889-2028. Against the 172 / 992 / 1811 binding CH1 read +59 % (a dome
        spinning at 59 % with the stick untouched) and CH2's rest clamped to 1811 and
        read full throttle on every frame. We met the throttle trap this way on
        2026-04-15.
      - After reducing EPA/stroke on the handset: neutral 992, sweep 192 -> 992 ->
        1792 on both axes, mapped +/-0.977. Final binding profile: min 172, center
        992, max 1811 on all channels. The HOTRC-specific values (neutral 1472 /
        1889) are outdated.
      - CH1 display-to-raw, measured on the dome receiver before recalibration:
        SBUS_raw = -2.176 x (display_us - 1500) + 1472. There is no SBUS-raw to
        microsecond conversion in firmware; rawUs is a reporting field only, so any
        microsecond figure for this handset came from its screen.
      - Held value: on a brief RF interruption the receiver sends ch1=389
        (normalized -89 %) with lost_frame=true, failsafe=false (d9f4a50e). Without
        the lost_frame guard that value reached the dome task directly.
      - Dual SBUS: one DS-650 ran both sbus1 and sbus2 linked at once with identical
        channel values, against the community's "one receiver at a time" (sheet Open
        Item 1).
      - Failsafe gate passed 2026-04-18: the watchdog fires on unplug, drive stops,
        control restores cleanly on re-plug.
      - full-hardware-verified: the DS-650 + SBUS-A dome-control path with a real
        dome motor under stick control, and RC mapping persistence across reboot.
      - Still deferred: RC to drive on real motors. The T19 closeout says "Drive motor
        output remains deferred (drive not connected in this session)"; everything
        above the drive arbiter is proven with the dome, not the feet.
      - The SBUS frame period was never measured. ageMs stayed under 20-30 ms with
        the link healthy.

      sbusTimeoutMs: during T19 the timeout was raised to 5000 ms as a diagnostic
      while the decoder was unreliable, and the saved controller backup
      tasks/artoo-backup-20260903-203848-config.json still carries
      sbusTimeoutMs: 5000. That is a diagnostic value, not a setting to ship; a
      controller found with it goes back to 200 ms. Whether the 200 ms default should
      scale with the frame period is a safety decision still open.

      Findings against the code the code does not say on its face:
      - rcTriggerDefaultReverse() keys on SBUS channels 3-6, not on the product, so a
        non-HotRC SBUS handset whose CH3-CH6 idle low reads inverted out of the box.
        The named product wins the default, deliberately; an operator re-binding a
        channel can override reverse.
      - rcMapChannels() hardcodes useCh2 = false. The live task path routes per
        source and does not use it, but the pure mapper's dual-receiver story is
        unfinished.
      - A three-position (3 gears) button buys nothing beyond a different threshold:
        rcAnalogToSwitchState() splits LOW / MID / HIGH, but trigger dispatch is
        boolean. Whether a three-state binding target is worth adding is a design
        question.
      - The handset's own failsafe positions are secondary here: they arrive with
        failsafe=true and the firmware discards the channel values, so SBUS_HW cuts
        the drive path, not the receiver's numbers. Set the handset to neutral anyway.
      - CCS is not detectable; the estop and the drive speed cap are the only bounds
        on a cruising handset.
      - tasks/rc_diagnostics_contract.md is stale: it gives the ARM1/ARM2 boot
        defaults as deadband 50 and reverse 0 where the code uses deadband 0 and
        reverse 1, and it still names src/tasks/sbus_input.cpp (now rc_input.cpp).
        It does not change behaviour.

      Control grammar: one DS-650 addresses six channels, two of them taken by
      driving, against far more RC-bindable actions than that; this is why dual SBUS
      exists. The RC page shows six channels per SBUS source, not sixteen. Our
      grammar is configuration (a binding table edited from a web page) rather than
      a hardcoded button map, because with six inputs, which six must be answerable
      without a rebuild. Neither ShadowMD nor Padawan360 reads a receiver, so their
      chorded grammars do not port.

      Against those projects: both ramp and default to a non-zero deadzone; we do
      neither (deadband defaults to 0), which with this handset's sudden throttle is
      a real difference in feel.

      Open decisions (operator, not research):
      - Should the mapper refuse a binding whose center is at an endpoint? That is
        the throttle trap expressed as configuration; the simulator guards against
        it, we do not.
      - Is the throttle's lack of a curve worth compensating in firmware? Scope for
        the drive work, not this product.
      - Should sbusTimeoutMs scale with the frame period (above)?

