      while DomeLinkTask on Core 1 can re-open the same controller on the dome's pins
      in that window. If it wins, all four queries get zero bytes: no device, no
      `switchDrive` (the safe branch), zero tracks, and the cached state the Sound
      page seeds from says no link. Reasoned from the code, not measured. Against it:
      the 2026-03 bench record shows the pre-init queries answering on that board.
      For it: that record predates the current transport arrangement. The outcome is
      safe either way: a cached "no response" that Poll clears, never a droid that
      will not play. FireBeetle 2 is unaffected (nothing is shared). The settling
      check is one boot with the dome link on serial: does the log say
      `pre-init: device online = ...` or `no response`? If the latter, claim the UART
      around `begin()` or move detection to the first poll.

      `begin()` always returns true, so a module that answers nothing is reported
      through the link state, never through the init retry; for this driver the
      Audio Step Core's begin retries never fire.

      Drive select: a hardcoded `switchDrive(SD)` on a FLASH module silenced its
      replies (2026-03-22, 3e45db4b; the sheet keeps the module fact). A later change
      that forced FLASH when detection failed (364cd9ff) was reverted (50e72c76):
      send nothing when detection fails.

