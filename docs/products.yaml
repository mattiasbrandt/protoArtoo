    status: supported
    confirmed_on_droid: false
    capabilities: []
    gate: null
    included: 1
    sheet: pca9685-servo-expander.md
    notes: |
      The dome already runs two of these: `0x40` for the panels and `0x41` for the
      holos, 19 slots, on the operator's AstroPixelsPlus fork
      (`mattiasbrandt/AstroPixelsPlus`), which pins Reeltwo at `23.5.3` in its
      platformio.ini rather than vendoring it. The sheet's three field problems (the
      grinding servo, the off-by-one, the pin-0 underflow) were found there; the
      fork's FORK_IMPROVEMENTS.md and its ADR 0004 (holo servoSettings starts at
      pin 17) are the record.

      Things about the dome fork that a body-side change must not inherit by
      accident:
      - It is 1-based Reeltwo. The body expander's Outputs are the silkscreen,
        0-based (`pca:0`-`pca:15`). Porting a channel table between the two shifts
        every servo by one.
      - Its live holo table is pins 17-22, with the old 16-21 values left commented
        out. Upstream still has the pin-16 comment, so bumping Reeltwo or re-syncing
        the table from upstream regresses it.
      - It calls a bare `Wire.begin()` and runs its bus at 100 kHz; the body
        expander runs 400 kHz (#306).
      - It ships 800-2200 us per slot. The body's LEDC defaults are 500-2500 us. Not
        a conflict, but a body Output should not silently take either range from the
        other.

      The bus-init and seam plan the sheet carried is built (#444): the servo
      backend seam, the I2C bring-up at an explicit clock, silkscreen numbering,
      the driver's own clamped microseconds-to-ticks conversion, and the no-trim
      decision on the oscillator (#306, 2026-09-30) are in the driver and its header.

  - value: 10
    id: pololu_maestro
    name: Pololu Maestro
    family: body_servo_controller
    protocol: maestro_serial
    status: roadmap
    confirmed_on_droid: false
    capabilities: []
    gate: null
    included: 0
    sheet: pololu-maestro-servo-controller.md
    notes: |
      Not built. No Maestro has been attached to this project's hardware; everything
      below is design from the sheet's vendor facts (#307, minted from #303, which
      assigned the Maestro serial Component Protocol).

      Architecture, decided in #307's research: dumb output, not sequencer. Firmware
      keeps the Motion Profile ramp and streams positions; the Maestro's speed and
      acceleration stay at 0 so its engine cannot fight the ramp firmware computed;
      the script engine goes unused. The sequencer model collides with five
      decisions, and the last one decides it:
      - ADR 0052 easing (`none`, `soft`, `overshoot`): the device has only the
        trapezoid, which is `none`; the other two exist only if firmware streams.
      - ADR 0052 speed and acceleration are times: a script stores rates, authored
        on a PC, on a device whose servo period firmware cannot read.
      - The Cadence Floor would move into a Maestro script, where the Sequence
        Coordinator cannot hold it.
      - ADR 0043 schedules an Output Release from arrival: firmware stops knowing
        when arrival is; Get Moving State is global and Mini-only.
      - #301 / #318: the builder edits Outputs in protoArtoo's UI. A sequencer
        Maestro moves authorship into an XML on a PC: two editors, one droid, no
        sync.
      The hobby's reason for a co-processor (a single-threaded AVR loop stalls the
      animation) does not apply: ServoTask is its own 50 Hz task and the drive lane
      is fenced onto Core 1. One exception left open: the device engine is the right
      tool for a move that must complete while the host is not talking, such as a
      slow return during a fault. Nothing asks for that today; if something does,
      the sheet's travel-time-to-rate conversion applies, per Output rather than
      per droid.

      Motion Profile on a Maestro, if the engine is ever used: ADR 0052 rejects
      storing Maestro units, so firmware converts the stored times with the sheet's
      "Converting a travel time into speed and acceleration". Recalibrating an
      Endpoint Pair changes D, so S and A are recomputed and re-sent whenever an
      endpoint moves (free on LEDC). S and A are lost on any Maestro reset: re-send
      the whole per-channel profile after one. An acceleration clamped at 255 gives
      a slower move than stored, and the surface says so, as a degraded overshoot
      does.

      Driver rules the sheet's facts imply:
      - Use the Pololu protocol (pay two bytes a command, 0xAA on every packet), or
        open with one complete Pololu-protocol command and then go compact. Never
        depend on a fixed baud set over USB: a driver that works only against a
        pre-configured device fails in the field with no diagnosis.
      - Any reply decoder abandons a packet on a high-bit byte (the protocol's
        self-resync).
      - Do not use pololu/maestro-arduino's read path: its reads are unbounded
        spins, and no task in this firmware may spin on a read. The write side is
        small enough to own.
      - If this project ever presents a Maestro-compatible interface (a reader),
        refuse an oversized Set Multiple Targets count, never clamp it.
      - If this project ever ships Maestro builder documentation, its first line is
        the sequencer-export fix: replace the trailing `return` with `quit`.

      Factory defaults against this project:
      - A factory Maestro limits pulses to 992-2000 us; LEDC's range is 500-2500 us
        (include/ledc_pwm.h). Most of what Endpoint Pair calibration can record is
        unreachable until the settings file widens Min / Max (on the 16 us grid).
      - The factory startup/error mode, Off, is already ADR 0052's limp by default
        and ADR 0043's Output Release. Keep it Off, except per channel for a part
        held against gravity (Ignore). Go to turns every Maestro error into a mass
        servo move, the overlapping inrush the Cadence Floor exists to prevent.

      Release and the first move: Output Release is Set Target 0 per channel, and
      ADR 0043's "a bus drop is reported, not escalated" applies with the UART in
      place of the I2C bus. For estop use explicit Set Target 0 (or one Set Multiple
      Targets with every target 0 on a Mini), never Go Home, whose effect depends on
      a setting firmware cannot read. A released channel has no position, so its
      next Set Target is a jump at full speed. After a release firmware
      re-establishes the position before ramping: command the last commanded
      target, let it snap, then ramp. SERVO_PULSE_NEUTRAL_US is not a safe
      re-establish value.

      Keep-alive: with the serial timeout armed, a quiet link is a fault. The driver
      keeps the link alive inside the timeout window (Get Errors qualifies) rather
      than lengthening the timeout. Same shape as the drive lane's zero-frame rule.

      Frame budget, streaming every Output at the 50 Hz ServoTask tick with Set
      Multiple Targets (Mini only; 3 header bytes plus 2 per channel): for 23
      channels that is 49 bytes, 51 ms at
      9600 baud (does not fit a 20 ms tick), 12.8 ms at 38400, 4.3 ms at 115200,
      2.5 ms at 200000. Run 115200 or faster. A dedupe against the last sent value
      drops a resting droid's traffic to the keep-alive. The hobby's 9600 cannot
      carry a streamed body.

      UART:
      - artoo-esp32 has no spare UART (console, drive, dome; audio shares the
        dome's controller), and freeing one costs the dome link or the console. The
        drive lane's "replace, never append" escape does not apply: LEDC, the Body
        servo controller's supported member, costs no UART, so there is nothing for
        a Maestro to replace.
      - FireBeetle 2: UART4 is unclaimed by the firmware (include/config.h). The
        ELRS sheet claims UART4 for CRSF, which must be a real UART at 420 kbaud; a
        Maestro link is one-way, slow and tolerant. If a builder wants both, CRSF
        takes UART4 and the Maestro goes elsewhere. Open: which of #311 and #307
        gets UART4 is a decision for the two tickets, not a measurement.

      Three ways to reach it:
      - A hardware UART: FireBeetle 2's UART4, if CRSF has not taken it.
      - The existing soft-UART TX (src/drivers/audio_soft_uart_tx.h, 9600 baud,
        about 1.04 ms per byte in a Core 0 critical section). Fine for
        gesture-triggered traffic (a compact restartScript, 2 bytes, 2.1 ms; one
        Set Target, 4 bytes, 4.2 ms); impossible for streaming (a 49-byte frame
        blocks Core 0 for 51 ms, 2.55 s per second at 50 Hz). So it supports only
        the sequencer model the decision above closed.
      - Freeing a second hardware UART by a trade: on artoo-esp32 it costs the
        console or the dome link. Not acceptable.

      Pins, if a link is wired:
      - artoo-esp32: GPIO 2, 4, 12 and 27 are unused in SBUS modes (the CH3-CH6
        headers, docs/pin_map.md); one can carry TX. Open: which of them are
        boot-strapping pins? The research expects two are; the pin map does not
        flag them, and a pin held low at boot by an attached device changes how the
        chip starts. Check GPIO 4 and 27 first; read all four against the ESP32
        datasheet and record the answer in docs/pin_map.md.
      - FireBeetle 2: one spare GPIO, itself an avoid-list pin (docs/pin_map.md). A
        write-only link fits it. A return path needs a GPIO that does not exist, so
        reading the Maestro back on this board is a design change, not a wiring
        choice.

      Level shifter: at the research date, the first part this project lists that
      needs one. A
      write-only link needs one shifter channel, or none if the builder accepts
      Pololu's "not guaranteed" on 3.3 V RX, as the only ESP32 precedent does (out
      of specification). A bidirectional link needs a real shifter both ways; a
      divider cannot raise a voltage. The Maestro's 5 V out can power the shifter.
      Builder documentation that says "wire the signal and a ground" is wrong for
      this part. The FireBeetle 2's servo field advice in docs/pin_map.md (servos
      and ESCs from a separate BEC) still holds; joining VSRV=VIN only moves where
      the servo rail terminates.

      Provisioning, made checkable: author the settings in the Control Center,
      export the XML, commit it to this repository (one file per variant),
      `UscCmd --configure` it, then `--getconf` and diff to prove it took. The
      serial timeout makes that file a safety artefact; treat it like
      docs/droid-parts.yaml, not a wiki page.
      - Serial mode: UART, fixed baud (or detect, with a Pololu-protocol driver).
      - Baud: 115200 or higher (frame budget above).
      - Serial timeout: non-zero. It is the servo failsafe, and firmware cannot arm
        or read it.
      - Min / Max per channel: widened to the LEDC range, on the 16 us grid.
      - Startup / error: Off, except parts held against gravity.
      - Startup speed / acceleration: 0 (firmware owns the ramp).
      - Period: 20 ms (changing it rescales the motion units invisibly).
      - CRC: off.

      Registry, Gate, Member:
      - Component Protocol: Maestro serial stands. A different wire format, a
        different transport class from both peers, and a device holding state
        firmware cannot read.
      - Board Capability Gate: needed, and a real board fact (does this board have
        a UART, or a spare GPIO, to reach a Maestro), entangled with #311. #311 and
        #307 should agree on one gate rather than mint two.
      - Component Member: the servo backend seam exists (include/servo_backend.h,
        #444 from #306). A Maestro is a third backend row beside LEDC and the
        PCA9685. Like the PCA9685, its writes leave Core 1: ServoTask hands a
        frame's changes over in servoBackendCommit() and a Core 0 task does the
        UART writes. It sits on a link that can drop, so its Outputs are reported
        unreachable when the link fails.

      Costs to state plainly to a builder:
      - A level shifter enters the bill of materials.
      - A PC provisioning step becomes mandatory, on Windows or x86 Linux. macOS
        cannot do it; a Raspberry Pi probably cannot run the GUI.
      - The scarcest bus on the board is spent, and on FireBeetle 2 it is contested
        with ELRS.
      - Reading the device back is unaffordable on FireBeetle 2, so Get Errors, Get
        Position and Get Moving State, and every diagnostic the device offers, are
        out in the realistic wiring. A Mini's ERR pin is the one cheap substitute.
      - The serial timeout and the channel limits are invisible to firmware, so the
        operator UI cannot honestly report whether the servo failsafe is armed, only
        that the settings file says it should be.
      - The motion engine is bought and not used. What a builder paying USD 2.29 to
        4.66 per channel gets: channel count off a single wire, a hardware failsafe,
        and per-channel startup behaviour.

  # ---------------------------------------------------------------------------
  # Dome Rotation
  # ---------------------------------------------------------------------------
  - value: 11
    id: isdt_esc70
    name: ISDT ESC70 (RC ESC)
    family: dome_rotation
    protocol: ledc
    status: supported
    confirmed_on_droid: true
    confirmed_source: "operator, 2026-09-30, #455."
    capabilities: []
    gate: null
    included: 1
    sheet: isdt-esc70-dome-esc.md
    wiring_card:
      supply: "2-3S LiPo, 6.0-12.6 V, on a rail of its own"
      draw: "rated 70 A continuous. A dome motor pulls single-digit amps"
      logic: "takes a 3.3 V signal: measured on one Artoo PCB, not yet on a FireBeetle 2"
      wires:
        - { from: "Throttle wire, signal", to: "the board's dome ESC pin" }
        - { from: "Throttle wire, ground", to: "the board's ground" }
        - { from: "Throttle wire, centre", to: "nothing", note: "it is the BEC's 5.0-7.5 V out: cut it or tape it back" }
        - { from: "Motor wires", to: "the dome motor", note: "either way round" }
        - { from: "Battery wires", to: "a 2-3S pack or a 12 V step-down", note: "polarity matters" }
      hazards:
        - "The throttle wire's centre conductor is 5.0-7.5 V out. Plugged onto a FireBeetle 2 row it lands on the 3.3 V plane and kills the board."
        - "Over 12.6 V destroys it at once. A 36 V hoverboard pack does, and so does a 4S pack."
        - "Battery wires the wrong way round damage the ESC."
        - "A jammed dome is not protected. Its 120 A limit is out of a dome motor's reach."
      source: "4.1, 4.2, 4.3, 4.4, 4.5, 5.2"
    notes: |
      The ISD Go baseline below is the operator's own tuning, locked on the bench on
      2026-03-21 against a real dome ring on the Artoo PCB. For tuning it outranks a
      vendor preset; for what a setting means, the manual outranks it. Final tuning is
      always mechanical-build dependent: ring friction, gear mesh, mass and inertia,
      wiring, supply sag and motor characteristics.

      Baseline settings (ISD Go), operator-locked:
      - Running mode: Forward and reverse. Required for bidirectional dome movement,
        and the only mode in which the droid's signed speed command means what the
        firmware thinks it means.
      - Battery type: match the actual pack chemistry, for correct cutoff and
        protection.
      - Cell count: match the actual pack. 2-3S LiPo / 6-8 cell NiMH only.
      - Cutoff voltage: Auto, or an equivalent safe manual value.
      - BEC voltage: 5.0 V. Conservative for accessory power, and the value that makes
        an accidental back-feed least destructive.
      - Motor rotation: Forward, swapped if mechanically reversed. Pick this inversion
        point, not the other two (below).
      - PWM frequency: 1 kHz. Low-end torque for heavier loads.
      - Start force: high or max. Breakaway torque, the main lever on an
        over-specified controller.
      - Brake force: minimum practical value. Reduces abrupt reversal loading.
      - Active drag brake: disabled. Avoids neutral drag torque; also disables ramp
        anti-skid, which is the same mechanism.
      - Active brake: disabled. Avoids aggressive braking on direction flips, and
        sidesteps the manual-versus-app contradiction.

      Curve guidance. Curve shaping changes response feel, not absolute maximum
      output. Throttle curve: stronger midrange while keeping endpoints linear, around
      +50 input -> +80 to +85 output and -50 -> -80 to -85, endpoints +/-100 ->
      +/-100. Brake curve: soft low-mid values, around 50 input -> 10 to 20 brake and
      100 input -> 25 to 35 brake. The +/-100 endpoints are what take the factory
      Novice curve's 70 % cap off; a dome tuned on a Novice curve is tuned around the
      wrong number. The bench record reads "1 kHz PWM, Start force MAX, Brake 1,
      drag/active brake off".

      Calibration and verification checklist:
      1. Complete throttle calibration (max, min, neutral) in ISD Go. Nothing else can
         be set until this is done.
      2. Verify command polarity and neutral hold behaviour.
      3. Test unloaded movement at multiple command levels.
      4. Test loaded dome movement with sustained one-direction runs.
      5. Test direction reversals with neutral dwell, to check mechanical stress.
      6. Re-tune start force and curve if breakaway or oscillation issues appear.

      Operational cautions:
      - Avoid immediate full-power direction reversals under heavy load.
      - If cogging or stall appears at low command, increase start force first.
      - If harsh reversals occur, reduce brake aggressiveness and add neutral dwell in
        controller logic (no firmware does this today, below).
      - If the dome refuses to move at all at low slider values, check
        `dome_speed_limit_pct` before suspecting the ESC.
      - If the dome turns one way and not the other, check the running mode before
        suspecting the mechanics.

      Calibrating against the droid instead of a transmitter. The droid is a legitimate
      throttle source: it emits exactly the 1000 / 1500 / 2000 us the procedure wants.
      Two steps are awkward from a web page:
      - Step 1 needs full throttle held while the ESC powers up. The Dome page slider
        can command +100 %, but `domeTaskInit()` writes neutral at boot and the 500 ms
        command timeout returns to neutral when the slider stops sending. Set the
        slider to +100 %, then switch the ESC on within the timeout window, or hold the
        slider.
      - Every step is "hold until you hear N beeps", and the beeps come from the motor,
        so somebody has to listen next to the droid.
      The clean way is to calibrate with whatever will drive the ESC. Calibrated
      against the droid, the learned endpoints are exactly 1000 / 2000 us and
      `dome_min_pulse_us` / `dome_max_pulse_us` stay at their defaults. Calibrated
      against a transmitter with non-default EPA, the learned endpoints are not
      1000 / 2000, and those two fields are the trim that fixes it without
      recalibrating. That is what they are for, not direction.

      Direction has three inversion points: the motor wires, the app's Motor rotation
      setting, and swapping `dome_min_pulse_us` / `dome_max_pulse_us` on the Dome page.
      Pick the app setting, record it, and leave the other two alone.

      The neutral deadband and `dome_speed_limit_pct`. The droid's neutral is a fixed
      1500 us from a hardware timer, so the drift the ESC's deadband exists to absorb
      does not exist here, and the manual's "keep default" advice is doubly safe. But
      the speed limit scales the whole usable range toward neutral
      (`domeSpeedToPulseUs`): at 100 % full command is 2000 us, at 20 % it is 1600 us,
      at 10 % it is 1550 us, plausibly inside the deadband. The symptom is a dome that
      does nothing at any slider position, with the firmware happy and the log showing
      a sensible pulse width. Check the speed limit before concluding the ESC is dead.
      Open: ramp the limit down until the dome stops responding and record the pulse
      width, which would give the Dome page a real minimum instead of 0.

      Arming. `domeTaskInit()` holds neutral for `ESC_ARMING_DURATION_MS` (2000 ms),
      the vendor's two-second rule, once at controller boot, not when the ESC powers
      up. ESC
      switched on after the controller: it comes up into a steady 1500 us stream,
      fine. ESC powered first: it reports Receiver Lost through the boot window, then
      gets its two seconds. ESC power-cycled mid-session: the boot hold does not
      repeat, so it gets no fresh hold. Reboot the controller after power-cycling the ESC, or
      clear the error from the app.

      Board wiring:
      - FireBeetle 2: the DFR1237 field is a row per GPIO with IO / 3V3 / GND columns,
        and its plug-and-go ergonomics make the mistake easy. Push the ESC's 3-pin wire
        onto row 48 (`PIN_DOME_ESC`) and the BEC's 5-7.5 V lands on the 3.3 V plane.
        Wire signal and ground only.
      - artoo-esp32: what the Artoo PCB's dome header power pin carries is UNKNOWN
        (unpowered, 5 V, or the logic rail). A meter on the header with the board
        powered settles it; until then, wire signal and ground only there too. This is
        the highest-value open item for this part.
      - Proven on artoo-esp32 only (GPIO 25, 2026-03-21/22): the 3.3 V LEDC path
        reaches the ESC, the app reports back the commanded throttle, the motor turns
        at 50 / 70 / 90 % unloaded, and the ring moves under load ("friction sectors
        and direction flip resistance noted"). Not proven: anything on FireBeetle 2 /
        ESP32-P4, where GPIO 48 also sits on the `VDD_IO_5` LDO rail that
        docs/pin_map.md flags as an unquantified risk to edge quality (the symptom
        would be erratic dome throttle and would never appear in a log); the arming
        hold against a real ESC power-cycle; sustained thermal behaviour; the deadband
        floor; any protection firing. confirmed_on_droid rests on #455.

      Command sources. Every source of dome motion posts one normalised speed to
      `domeCmdQueue`, and DomeTask (Core 1) is the only writer of the dome channel:
      the web slider / REST handler, the RC dispatcher (PWM or SBUS binding), the
      sequence dispatcher's `SEQ_ACT_DOME_ROTATE`, the dome link's rotation cue, the
      console direct action, the RC signal-loss stop, and the random idle machine
      inside DomeTask.

      Why the droid uses an RC ESC on LEDC: configuration moves out of the firmware
      onto a phone, and the runtime driver is a PWM write on a pin the board already
      has. A SyRen in packet serial would move configuration into the firmware and
      cost a UART artoo-esp32 does not have spare; a SyRen in R/C mode plugs into the
      same pin with no new code. The hobby practices the sheet records have droid
      equivalents: the SBUS neutral band and confirm-frames filter in
      `dome_input_filter.h` (a stricter host-side deadzone), `dome_speed_limit_pct`
      (a configurable cap), and the 500 ms `DOME_COMMAND_TIMEOUT_MS` standing in for
      the hardware timeout the SyRen has and the ESC70 does not.

      DomeTask logged its speed with `%.2f` once (2026-03-21); on ESP32 newlib that
      routes through `_dtoa_r` and `malloc` on a Core 1 real-time task and produced a
      "Stack canary watchpoint triggered (DomeTask)" panic loop. That is why the dome
      log lines use integer percent.

      Findings against the code (2026-09-12 research, re-checked 2026-10-06):
      - The brushless comment: `include/ledc_pwm.h` was fixed and now says a BRUSHED
        ESC, but `include/config.h` (the DOME channel comment, "drives brushless
        motor") and `include/servo_backend.h` ("LEDC_CH_DOME (a brushless ESC") still
        say brushless. The ESC70 is brushed only and cannot run a brushless motor.
      - Stack sizes (resolved): docs/failsafe.md once carried a Chip-Specific column
        reading No for DomeTask at 3072 B, while config.h had 3072 B on artoo-esp32
        and 4608 B on P4, with an 80 B lower-bound floor recorded on artoo-esp32 as a
        known exposure; the same mismatch sat on DriveTask, ServoTask and
        DomeLinkTask. The column is gone: stack sizes now live in
        `tools/task_stack_recipes.json`, generated into `include/task_stack_figures.h`
        (ADR 0040), and DomeTask has headroom on both chips. Re-check the dome chain
        before adding anything to the DomeTask loop on either chip.
      - Nothing ramps. A `-1.0` DomeCommand right after a `+1.0` is one PWM frame at
        1000 us with the motor still spinning forward, and in mode (c) the ESC obeys
        at once. The ESC has no ramp setting, and the SyRen's EEPROM ramping persists
        and leaks into other modes. A host-side slew limit in DomeTask is the natural
        home, and it is a behaviour change to a Core 1 task that would also change how
        the random idle machine and sequence steps feel: a decision, not a correction.
        Open.
      - The dome is write-only. `robotState.domeTargetSpeed` is what was commanded,
        not what the dome is doing. The Dome ESC health row (`data/health_signals.js`)
        now reads Idle or Spinning in grey as a commanded word, never green. The Dome page's own
        rotation-state word still reads Idle / Spinning from the commanded target, so a
        dome whose ESC is in protection, unpowered, uncalibrated or in the wrong
        running mode shows the same page as a turning dome: the same shape as the old
        optimistic audio "Playing" badge, with no wire to read. Open: word that state
        as commanded on the Dome page (operator's call on wording), and whether a
        sensed dome input (a rotation sensor or a current shunt) is worth a GPIO.

