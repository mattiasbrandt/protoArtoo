    sheet: sabertooth-syren-packet-serial.md
    notes: |
      Two ways onto the Dome Rotation lane (#309):
      - R/C mode (SW1 down, SW2 up) takes a 1000-2000 us servo pulse, the shape
        PIN_DOME_ESC already puts out for the ISDT ESC70 on both boards. #309
        observes that a SyRen in R/C mode needs no new code there; not tried on
        this project's hardware.
      - Packet serial needs a UART. artoo-esp32 has none spare; the other route is
        a share of the drive lane, which works only if the Foot Drive is a
        Sabertooth on the same line (SyRen at 129, Sabertooth at 128).

      No documented serial failsafe. The SyRen 10 manual documents commands 0-3
      only, so whether it honours command 14 is UNKNOWN (the sheet's Open Item 1).
      The Foot Drive seam's line that a packet-serial controller "is opt-in and
      starving it makes the wheels STOP" (include/drive_backend.h) must not be read
      across to the SyRen: an unarmed one holds its last command, and the dome
      keeps turning.

      It is a V1 autobaud device. A packet-serial driver waits 2 s after the SyRen
      powers up and sends 0xAA before any command; boot noise on the TX line can
      mis-baud it until a power cycle, so the 10k pull-down from S1 to 0V is
      required wiring. On a line shared with a V2 Sabertooth, move the Sabertooth's
      baud first (command 15), then the host, and let the SyRen autobaud.

      S2 e-stop proposal: S2 is an active-low emergency stop on the SyRen and the
      Sabertooth alike. Routing the Latching Estop to one shared S2 line would stop
      dome and feet in hardware, independent of serial state or a hung MCU. A
      design proposal for #308 and #309; not decided.

      Baud: on a shared line run 38400 rather than 9600 (see sabertooth_2x25): drive
      plus dome takes 3.13 ms of the 20 ms drive tick instead of 12.5 ms.

      The product has not run on this project's hardware.

