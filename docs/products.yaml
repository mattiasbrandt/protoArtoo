        track, and log or surface a mismatch. The driver already reads the count and
        nothing compares it; it is the cheapest detection of a card rebuilt in the
        wrong order.
      - Play-by-path (`0x08`) as an escape from enumeration-order addressing. The
        driver plays by index. Prototype against a card with 8.3 names and decide
        whether name-stable addressing is worth the variable-length frame, the 8.3
        naming and the break with the community's numbered cards. Only if
        enumeration order becomes a real operator complaint.
      - Interlude (`0x16`) is not a Background Track. GLOSSARY.md records the DY-SV5W
