  - value: 7
    id: xbox_controller
    name: Xbox Controller
    family: radio_controller
    protocol: bluetooth_hid
    status: roadmap
    confirmed_on_droid: false
    capabilities: []
    gate: null
    included: 0
    sheet: xbox-controller-input.md
    notes: |
      Roadmap (#312). #303 recorded the Component Protocol as Bluetooth HID; #312
      names the wireless dongle and the wired controller, and both of those are USB.
      The sheet shows four protocols in this family, so which one #312 is about is an
      operator decision, not a research result.

      The board decides the protocol. artoo-esp32 is a classic ESP32: Bluetooth
      Classic and BLE, no USB host. firebeetle2 is an ESP32-P4: a USB host, no radio
      of its own, and a BLE-only C6 companion. So the dongle and wired paths are
      firebeetle2-only, the Bluetooth Classic path is artoo-esp32-only, and the
      Component Protocol and the Board Capability Gate are one decision here, not
      two. The three coherent positions:
      - Bluetooth, Series X|S pad, artoo-esp32: a current-production controller, no
        dongle, Bluepad32 does the work. Costs: reverses the Bluetooth Framework
        Envelope decision, the BLE-versus-BR/EDR firmware trap, nothing on
        firebeetle2.
      - USB, 360 dongle, firebeetle2: the hobby's proven arrangement, explicit
        disconnect events, four controllers. Costs: discontinued hardware, a custom
        USB class driver, nothing on artoo-esp32.
      - USB, wired GIP, firebeetle2: a published Microsoft specification and a
        current controller; a cable is a dead man's handle. Costs: tethered.
      No position serves both boards. Whether firebeetle2 could ever take a
      Bluetooth controller is the sheet's Open Item 1 (HID host over ESP-Hosted).

      Which controller the lineup names is open too: the hobby's part (360 + receiver)
      is discontinued, and the current-production Series X|S pad is used by no droid
      project. Both cannot be the lineup entry.

      Bluetooth means reversing a Framework Envelope decision. artoo-esp32's
      `artoo_envelope` block compiles Bluetooth out (`CONFIG_BT_ENABLED=n`) and
      records its saving and how to undo it. That saving is the floor, not the bill:
      a Bluetooth HID host (BTstack or Bluedroid, HID parsing, bonding storage) has
      never been measured here. Settle it by building once with `CONFIG_BT_ENABLED=y`
      plus a host stack and reading `check-envelope`; the static-DRAM segment, not
      flash, is the number to watch. The block's "an operator would notice: nothing"
      line becomes false and is rewritten in the same commit.

      Bluepad32 would be the first dependency whose licence depends on how the
      project is distributed (BTstack is free for open source, commercial for closed
      source). protoArtoo is a public repository, which is the case the open-source
      terms cover, but adopting it is an explicit operator decision, answered once.

      Either path, the driver is written: a custom class driver over the ESP-IDF USB
      Host Library matching `FF/47/D0` (GIP) or the 360 vendor interface, or
      Bluepad32. The seam is the same: a Radio Controller member that produces what
      `rc_input.cpp` already produces.

      A gamepad does not fit the binding model. `RcBindingConfig` is channel and
      range shaped (source, channel, min/center/max, deadband, reverse). A pad has no
      channels, no pulse widths and nothing to calibrate; what it has is button
      identity, click-versus-hold and modifiers, the grammar the sheet's Padawan360
      section shows. So it needs a new `RcBindingSource` and a second binding shape,
      not one more enum value, and that design is shared with any future gamepad:
      decide it before the first one. Diagnostics likewise: the RC diagnostics
      contract defines `raw` and `rawUs` in SBUS counts and pulse microseconds, and a
      gamepad has neither. Either the contract grows a third source-native form, or a
      gamepad reports `normalized` and `mapped` only and the UI says so.

      The failsafe, not negotiable:
      - a last-report watchdog owned by protoArtoo, on the order of
        `SBUS_TIMEOUT_MS`, feeding the existing failsafe; the disconnect event only
        makes the common case fast;
      - disarmed on connect, and on every reconnect, as Padawan360 does;
      - an idle disconnect (the controller's ~15 minute power-off) is normal, not an
        error;
      - consider pinning the controller's address, as ShadowMD pins a MAC. Pairing
        is not authorisation.
      Unlike Padawan360's cooperative `loop()` check, the 50 Hz DriveTask's zeroing
      does not depend on the USB stack being serviced.

      Padawan360's Home-button LED ring shows drive armed state and the speed preset
      on the controller itself; protoArtoo has no equivalent. No astromech project
      drives an Xbox controller from an ESP32, so protoArtoo would be first, with no
      build to copy.

