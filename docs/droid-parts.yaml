# protoArtoo Droid Parts Catalog
# ==============================
# Source of truth for the physical parts of the droid designs protoArtoo
# carries: every panel, door, arm, and fixture, with its community-standard
# shorthand and position.
#
# AFTER EDITING THIS FILE, REGENERATE:
#
#     python3 tools/generate_droid_parts_catalog.py
#
# It rewrites two committed outputs: include/droid_parts.h, the id vocabulary
# firmware resolves a Part against, and data/droid_parts.js, the names,
# shorthand, aliases and position every operator surface labels a Part with.
# Editing this file without regenerating them leaves the firmware's vocabulary
# gate and every Part name on screen stale against the catalog they came from
# — a Part a builder can see and not wire, or wire and not see (#301, #356).
#
# Nothing reads this file at runtime. It is generated into the firmware and the
# browser at build time, so neither depends on a filesystem that can go missing
# (#301). Code that needs a part vocabulary (dome map, body views, sequence
# lanes, wiring sheet) reads a generated output, never this YAML.
#
# Naming policy (operator decision 2026-08-22):
#   The BASE name for a part follows MrBaddeley's design part names (cad_name)
#   wherever the MK4 design provides one. The community vocabulary — Printed
#   Droid PP/P/HP shorthand and plain-English labels — is carried in `aliases`,
#   first-class for import matching, search, and anything a visiting builder
#   types. UI shows the base name with the shorthand alongside.
#   Dome cad_name values are TBD: they must be read out of the actual MK4
#   design files (the dome CAD names are known to be unordered/duplicated,
#   which is why ids here are position-ordered instead) — do not guess them.
#
# Designs and what they seed (ADR 0047, operator decision 2026-09-08):
#   A part is declared ONCE below, with everything true about it wherever it
#   appears. The `designs:` block names the designs and does one thing: it
#   lists the part ids each design and variant SEEDS, so choosing MrBaddeley
#   MK4 fits that complement in a single press.
#   A design SEEDS, it never FENCES. The Fitted Parts on the builder's own
#   droid are the truth; a design is a running start at them. A part outside
#   the seeded set is still authorable, still saveable and still wirable, and
#   nothing in this block narrows what Protocol Check accepts — that
#   vocabulary is the union of every design's complement plus the parts no
#   design lists.
#   One seed list serves both halves of the answer. A builder states a Dome
#   Design and a Body Design separately — an MK4 complex dome on an MK4 simple
#   body is an ordinary droid, not an edge case — so a reader takes the dome
#   half of a design's seeds for the Dome Design and the body half for the
#   Body Design. Which half a part belongs to is the section it is declared in
#   below, which is why no seed list repeats it.
#   MrBaddeley MK4 is the design protoArtoo pre-selects, recorded as an answer
#   rather than an absence (#333). Which variant it pre-selects is its
#   `default_variant`, one field per design rather than one per half: a Dome
#   Design and a Body Design are answered separately and each carries its own
#   design row, so one field already lets a builder run a complex dome on a
#   simple body (operator decision 2026-09-10, #356).
#   A part no design lists is a Common Addition: the four arms with
#   `cad_name: null`, offered to every droid whatever it was built from. The
#   `other_slots` escape hatch at the foot of this file sits outside every
#   design too.
#   Adding a design is one block here and no edit to any part row — the
#   operation ADR 0047 exists to make cheap. Bearings are community geometry
#   rather than design geometry (one Printed Droid drawing for the character),
#   so no design carries coordinates of its own.
#
# Design entry fields:
#   id:         stable design id — what a stored Droid Build refers to.
#   label:      the operator-facing name on the card.
#   short:      short form for chips and the wiring sheet's build summary.
#   blurb:      the one sentence the card shows.
#   variants:   this design's OWN variant set. A design with no variants omits
#               the key rather than carrying an empty list, so the second
#               control disappears instead of offering an empty axis.
#   default_variant:
#               which of this design's own variants a builder is pre-selected
#               onto. Required exactly when `variants:` is present, and its
#               value must be one of them; a design with no variants carries no
#               default either, by the same rule that keeps it from carrying an
#               empty `variants:` list. Pick the variant that actually seeds
#               something, so nobody is ever pre-selected onto a complement
#               that is empty or unknown.
#   seeds:      the part ids a design — or one of its variants — puts on the
#               droid. A variant carries its own seeds because a variant is
#               not cosmetic: a simple dome cannot grow the complex pies, so
#               drawing the maximal complement at a simple-dome builder would
#               promise parts they can never fit.
#               `seeds: TBD` means the complement is not known here and must
#               not be guessed. It is a scalar rather than a short list on
#               purpose: a reader expecting a list fails loudly instead of
#               quietly seeding an empty droid. It generates as `null` — never
#               as the string "TBD" and never as `[]` — so a consumer reaching
#               for the complement throws instead of seeding an empty droid.
#
# Field notes:
#   id:         protoArtoo part id — stable, position-ordered per class
#   shorthand:  the community channel-naming standard from the Printed Droid
#               R2-D2 terminology reference (printed-droid.com/kb/r2-d2-terminology):
#               PP1..PP6 pie panels, P1..P14 lower dome panels, HPn-1/HPn-2
#               holoprojector pan/tilt. This is what builders type and expect.
#   cad_name:   the part's name in MrBaddeley's MK4 design files (names only;
#               no geometry from those files lives in this repository).
#   aliases:    community/plain-English names that must match on import/search.
#   bearing_deg: degrees clockwise viewed from above, 0 = dead astern,
#               180 = dead ahead (Printed Droid drawing convention). Dome
#               entries carry real bearings; body entries carry position
#               words only until measured on our droid.
#   position:   compass-ish word — easier to find on a real droid than a number.
#   control:    how protoArtoo can reach the part TODAY:
#               dome-link  = AstroPixelsPlus serial (:OPnn/:CLnn panel numbers)
#               body-ledc  = local LEDC PWM channel on the Artoo PCB
#               none       = present on the droid design, nothing drives it yet
#               It says what is DRIVABLE, never what is NAMEABLE. EVERY part
#               declared here reaches both generated outputs, so a builder who
#               wires a spare output to the front-left breadpan door records
#               `doorFL` on that row rather than an `otherN` slot, and a part
#               nothing drives reports part-not-assigned instead of reading as
#               an id the build never heard of (operator decision 2026-09-11,
#               #358). Which part an output actually moves is the builder's own
#               droid's answer, held on the Servo Output rows; the dome still
#               owns execution of panel intent under Catalog Authority, which
#               is a statement about who drives, not about who may be named.
#               The tokens are not this file's to invent: they are declared in
#               include/droid_part_control.inc, and the generator refuses a
#               control path the firmware does not define.
#               A row that omits `control:` entirely is not a driven thing at
#               all — the dome fixtures are orientation references, not servos
#               — and is generated as `control: null` to keep it distinct from
#               a `none` that is waiting to be wired.
#   dome_link_panel: the :OPnn/:CLnn number our AstroPixelsPlus fork serves
#               for this part. TBD until verified against the fork's panel
#               table on hardware — do not guess.
#   kind:       the Part Kind — what this part usually IS, as opposed to what
#               drives it. `light` is the one kind declared today, and it is
#               what makes a PSI, a logic display or the Magic Panel a part a
#               builder names and choreographs for rather than a footnote on a
#               panel row (#320, ADR 0045). A surface branches on this field,
#               never on an id prefix or a name match, and it is ADVISORY: it
#               earns a part its own treatment and lets a surface query a
#               surprising mapping. It never refuses one. A row with no `kind:`
#               is one this catalog does not classify — the escape-hatch slots
#               are whatever the builder wired to them.
#               The tokens are the generator's PART_KINDS, not this file's to
#               invent: firmware has no use for a Kind, so unlike `control:`
#               there is no manifest to read it from.
#   sits_on:    the part this one is carried by — a light and the dome panel it
#               lights. It must name a declared part, and that part must stand
#               on its own. A part that sits on another takes its `position`
#               and `bearing_deg` from it unless it declares its own, so the
#               two can never disagree about where they both are.
#
# `TBD` is a declared unknown and never reaches a generated output as a value:
# the generator omits the key instead, so a consumer sees "not known here"
# rather than a part whose CAD name is literally the word TBD. A `cad_name:`
# that is explicitly null is a different statement — the part HAS no CAD name,
# which is what marks a Common Addition (ADR 0047) — and does generate.
#
# Lit dome panels: the panels Printed Droid lists as carrying lights or
# displays rather than a servo are the ones a `dome_lights` row sits on. What
# each carries used to be a `lit:` note on the panel itself; it is a part of its
# own now, so the light has a name of its own, a Part Kind, and a place in every
# sequence and picker a door or an arm appears in. A servo mapping onto one of
# those panels is unusual but legal — query it, never refuse it.

designs:
  - id: mk4
    label: MrBaddeley MK4
    short: MK4
    blurb: The MK4 astromech most builders here printed — six pie panels, fourteen side panels, three holoprojectors, and the body doors and utility arms that go with them.
    note: >-
      The MK4 dome also carries 6 small inner pies, which have no PP shorthand.
      This catalog declares no part ids for them, so no variant can seed them
      yet; the count lived in the header block this section replaced and is
      kept here until they are declared as parts.
    # Complex, because it is the only MK4 variant with a complement today: a
    # builder pre-selected onto `simple` would be pre-selected onto a seed list
    # nobody has read out of MrBaddeley's exports yet (operator decision
    # 2026-09-10, #356).
    default_variant: complex
    variants:
      - id: simple
        label: Simple
        # TBD: which of the parts below a simple MK4 build carries. The split
        # between MrBaddeley's simple and complex MK4 exports is recorded
        # nowhere in this repository, so it must be read out of those design
        # files before it is written here — do not guess it (#337).
        seeds: TBD
      - id: complex
        label: Complex
        # The maximal MK4 complement: every part declared below except the
        # four Common Additions, which belong to no design.
        seeds: [pie1, pie2, pie3, pie4, pie5, pie6,                       # PP1..PP6
                panel1, panel2, panel3, panel4, panel5, panel6, panel7,   # P1..P14
                panel8, panel9, panel10, panel11, panel12, panel13, panel14,
                magicPanel, upperPanel, psiRear,                          # dome lights
                logicRear, logicFront, psiFront,
                hp1Pan, hp1Tilt, hp2Pan, hp2Tilt, hp3Pan, hp3Tilt,        # HP1..HP3
                domeBtn1, domeBtn2,                                       # dome fixtures
                doorFL, doorFR, doorRL, doorRR,                           # body doors
                dataport, chargebay, smallDoor, drawer,
                utilUp, utilLo]                                           # body arms

  - id: own
    label: My own build
    short: Own build
    blurb: For a droid that is nobody's published design — nothing is fitted for you, and each part joins the list as you build it.
    # No `variants:` key: this design has no variant set, and an empty list
    # would put a second control on the card with nothing in it. No
    # `default_variant:` either, for the same reason — there is nothing to
    # default to.
    seeds: []

dome_pies:
  - { id: pie1, cad_name: TBD, shorthand: PP1, aliases: ["PP1", "Dome pie 1"], bearing_deg: 150, position: rear-right,  control: dome-link, dome_link_panel: TBD }
  - { id: pie2, cad_name: TBD, shorthand: PP2, aliases: ["PP2", "Dome pie 2"], bearing_deg: 90,  position: right,       control: dome-link, dome_link_panel: TBD }
  - { id: pie3, cad_name: TBD, shorthand: PP3, aliases: ["PP3", "Dome pie 3"], bearing_deg: 30,  position: front-right, control: dome-link, dome_link_panel: TBD,
      note: usually carries holoprojector 3 }
  - { id: pie4, cad_name: TBD, shorthand: PP4, aliases: ["PP4", "Dome pie 4"], bearing_deg: 330, position: front-left,  control: dome-link, dome_link_panel: TBD,
      note: usually the periscope }
  - { id: pie5, cad_name: TBD, shorthand: PP5, aliases: ["PP5", "Dome pie 5"], bearing_deg: 270, position: left,        control: dome-link, dome_link_panel: TBD }
  - { id: pie6, cad_name: TBD, shorthand: PP6, aliases: ["PP6", "Dome pie 6"], bearing_deg: 210, position: rear-left,   control: dome-link, dome_link_panel: TBD }

dome_panels:
  - { id: panel1,  cad_name: TBD, shorthand: P1,  aliases: ["P1",  "Dome side panel 1"],  bearing_deg: 142.5, position: rear-right,  control: dome-link, dome_link_panel: TBD }
  - { id: panel2,  cad_name: TBD, shorthand: P2,  aliases: ["P2",  "Dome side panel 2"],  bearing_deg: 128,   position: rear-right,  control: dome-link, dome_link_panel: TBD }
  - { id: panel3,  cad_name: TBD, shorthand: P3,  aliases: ["P3",  "Dome side panel 3"],  bearing_deg: 114,   position: right,       control: dome-link, dome_link_panel: TBD }
  - { id: panel4,  cad_name: TBD, shorthand: P4,  aliases: ["P4",  "Dome side panel 4"],  bearing_deg: 94,    position: right,       control: dome-link, dome_link_panel: TBD }
  - { id: panel5,  cad_name: TBD, shorthand: P5,  aliases: ["P5",  "Dome side panel 5"],  bearing_deg: 75.5,  position: right,       control: none }
  - { id: panel6,  cad_name: TBD, shorthand: P6,  aliases: ["P6",  "Dome side panel 6"],  bearing_deg: 62.5,  position: front-right, control: none }
  - { id: panel7,  cad_name: TBD, shorthand: P7,  aliases: ["P7",  "Dome side panel 7"],  bearing_deg: 45,    position: front-right, control: dome-link, dome_link_panel: TBD }
  - { id: panel8,  cad_name: TBD, shorthand: P8,  aliases: ["P8",  "Dome side panel 8"],  bearing_deg: 24,    position: front,       control: none }
  - { id: panel9,  cad_name: TBD, shorthand: P9,  aliases: ["P9",  "Dome side panel 9"],  bearing_deg: 300,   position: rear-left,   control: none }
  - { id: panel10, cad_name: TBD, shorthand: P10, aliases: ["P10", "Dome side panel 10"], bearing_deg: 242,   position: left,        control: dome-link, dome_link_panel: TBD }
  - { id: panel11, cad_name: TBD, shorthand: P11, aliases: ["P11", "Dome side panel 11"], bearing_deg: 217,   position: rear-left,   control: dome-link, dome_link_panel: TBD }
  - { id: panel12, cad_name: TBD, shorthand: P12, aliases: ["P12", "Dome side panel 12"], bearing_deg: 204,   position: rear,        control: none }
  - { id: panel13, cad_name: TBD, shorthand: P13, aliases: ["P13", "Dome side panel 13"], bearing_deg: 194,   position: rear,        control: dome-link, dome_link_panel: TBD }
  - { id: panel14, cad_name: TBD, shorthand: P14, aliases: ["P14", "Dome side panel 14"], bearing_deg: 184,   position: rear,        control: none }

dome_lights:              # what a lit panel carries — a part, not a footnote
  # Each of these is the lit device on the panel it sits on, and each is a part
  # in its own right for the same reason a holoprojector's pan and tilt are:
  # a part is one thing an Output drives, and a light is driven separately from
  # the panel around it (ADR 0045). They carry `control: none` — present on the
  # droid, nothing protoArtoo drives yet — so they reach the browser alone and
  # the firmware id table is untouched by them. The raw MarcDuino families
  # (`*MO99`, `@0T1`) keep forwarding to the dome uninterpreted regardless; a
  # part here claims commanded intent, never device truth.
  #
  # No `shorthand:`, because these are not Printed Droid channels — the panel
  # each sits on carries the P-number. The aliases are the tokens this project
  # already answers to: FLD, RLD, FPSI and RPSI are DL:/DT: targets
  # (src/protocol_check.cpp), and MP is how the vendored dome map labels the
  # Magic Panel (data/dome_panel_model.js).
  - { id: magicPanel, label: Magic Panel,          aliases: ["MP"],                   kind: light, control: none, sits_on: panel5 }
  # The one lit panel no reference gives a device name to. "Small upper panel"
  # is this catalog's own wording for it, kept rather than replaced by a name
  # no builder would recognise.
  - { id: upperPanel, label: Small upper panel,    aliases: [],                       kind: light, control: none, sits_on: panel6 }
  - { id: psiRear,    label: Rear PSI,             aliases: ["RPSI"],                 kind: light, control: none, sits_on: panel8 }
  - { id: logicRear,  label: Rear Logic Display,   aliases: ["RLD", "Rear display"],  kind: light, control: none, sits_on: panel9 }
  - { id: logicFront, label: Front Logic Displays, aliases: ["FLD", "Front display"], kind: light, control: none, sits_on: panel12 }
  - { id: psiFront,   label: Front PSI,            aliases: ["FPSI"],                 kind: light, control: none, sits_on: panel14 }

holoprojectors:
  - { id: hp1Pan,  cad_name: TBD, shorthand: HP1-1, aliases: ["HP1-1", "Holoprojector 1 pan"],  unit: 1, axis: pan,  bearing_deg: 165, position: rear,  control: none }
  - { id: hp1Tilt, cad_name: TBD, shorthand: HP1-2, aliases: ["HP1-2", "Holoprojector 1 tilt"], unit: 1, axis: tilt, bearing_deg: 165, position: rear,  control: none }
  - { id: hp2Pan,  cad_name: TBD, shorthand: HP2-1, aliases: ["HP2-1", "Holoprojector 2 pan"],  unit: 2, axis: pan,  bearing_deg: 350, position: front, control: none }
  - { id: hp2Tilt, cad_name: TBD, shorthand: HP2-2, aliases: ["HP2-2", "Holoprojector 2 tilt"], unit: 2, axis: tilt, bearing_deg: 350, position: front, control: none }
  - { id: hp3Pan,  cad_name: TBD, shorthand: HP3-1, aliases: ["HP3-1", "Holoprojector 3 pan"],  unit: 3, axis: pan,  bearing_deg: 38,  position: front-right, control: none,
      note: sits inside pie panel PP3 }
  - { id: hp3Tilt, cad_name: TBD, shorthand: HP3-2, aliases: ["HP3-2", "Holoprojector 3 tilt"], unit: 3, axis: tilt, bearing_deg: 38,  position: front-right, control: none }

dome_fixtures:            # orientation references — not servos
  - { id: domeBtn1, label: Dome button 1, bearing_deg: 8,  position: front }
  - { id: domeBtn2, label: Dome button 2, bearing_deg: 20, position: front }

body_doors:
  - { id: doorFL,    cad_name: FLBreadpanDoor,  aliases: ["Left body door", "FL door"],       position: front-left,  control: none }
  - { id: doorFR,    cad_name: FRBreadpandoor,  aliases: ["Right body door", "FR door"],      position: front-right, control: none }
  - { id: doorRL,    cad_name: RLBreadpanDoor,  aliases: ["Rear-left body door", "RL door"],  position: rear-left,   control: none }
  - { id: doorRR,    cad_name: RRBreadpandoor,  aliases: ["Rear-right body door", "RR door"], position: rear-right,  control: none }
  - { id: dataport,  cad_name: DataPortDoor,    aliases: ["Dataport door", "Dataport"],       position: front-left,  control: none }
  - { id: chargebay, cad_name: ChargingBayDoor, aliases: ["Chargebay door", "Charge bay"],    position: front-right, control: none }
  - { id: smallDoor, cad_name: SmallLongDoor,   aliases: ["Small long door"],                 position: front,       control: none }
  - { id: drawer,    cad_name: Drawer,          aliases: ["Drawer"],                          position: front,       control: none }

body_arms:
  - { id: utilUp,    cad_name: UpperUtilityArm, aliases: ["Upper utility arm"], position: front, control: body-ledc,
      note: one of the two MG996R utility arm servos protoArtoo already drives }
  - { id: utilLo,    cad_name: LowerUtilityArm, aliases: ["Lower utility arm"], position: front, control: body-ledc,
      note: one of the two MG996R utility arm servos protoArtoo already drives }
  - { id: gripArm,   cad_name: null, aliases: ["Gripper arm"],    position: front-left,  control: none,
      note: common MK4 addition; not in the base MK4 design exports }
  - { id: gripClaw,  cad_name: null, aliases: ["Gripper claw"],   position: front-left,  control: none }
  - { id: interArm,  cad_name: null, aliases: ["Interface arm"],  position: front-right, control: none }
  - { id: interTool, cad_name: null, aliases: ["Interface tool"], position: front-right, control: none }

# Escape hatch for off-model hardware wired to spare outputs (fire
# extinguisher, custom rigs). Exists so a real output is never unnameable.
# The slots are ids, not rows: the generator mints `other1`..`other<count>`
# from the two fields below, so widening the hatch is a number here rather
# than ten more rows to keep in step.
other_slots:
  count: 10
  id_prefix: other        # other1..other10
  # What the browser calls them. A Common Addition is a part we have a word
  # for; these are the ones we do not, so the name says only which slot it is
  # — "Other part 7" — and the builder's own hardware supplies the meaning.
  label_prefix: Other part
  # Declared, not assumed: a spare output is a body output, so this is what
  # drives whatever a builder wired to one. It no longer decides whether the
  # slots reach firmware - every declared part does, #358 - but leaving it out
  # would say the slots are undriven, which is the opposite of what they are.
  control: body-ledc
