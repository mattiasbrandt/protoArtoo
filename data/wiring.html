<!doctype html>
<html lang="en" data-scripts="/web_api.js,/overlay.js,/status_stream.js,/live_reading.js,/health_signals.js,/shell.js,/droid_parts.js,/droid_part_kind.js,/droid_build.js,/dome_layout.js,/apply_timing.js,/component_picker.js,/outputs.js,/dome_command_map.js,/find_by_moving.js,/parts_mapping.js,/wiring.js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wiring - protoArtoo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/r2d2body-favicon.png">
    <!-- Thin delegate: a direct visit is handed to the shell at this route (ADR 0048). -->
    <script>window.PAShellDelegate = true; location.replace("/#wiring");</script>
  </head>
  <body data-page="wiring">

    <!-- The running board's own drawing (ADR 0065), for the board picture the
         diagram draws in place of the words "Body Controller" (#411). #board
         inlines only that one symbol of the set's sprite (tools/gzip_fsdata.py
         BOARD_FRAGMENT); the default set's sprite is empty and the picture is
         the photograph. In the body, because the Operator Shell mounts only a
         surface's body. -->
    <!-- PA:INCLUDE _product_art.html#board -->

    <!-- The title is the name in the nav, and under it one plain line saying
         what the page covers (ADR 0066; operator, 2026-09-19 on #411). The
         bounded promise and the scope statement ride on the picture instead,
         since a picture is the part of a page that gets cropped and pasted
         somewhere else (#293).

         The subtitle is EMPTY here and written by data/wiring.js, its one
         home, so this screen's header and the printable bench copy's header
         (#366) cannot come to say different things.

         The one act saves that bench copy to this computer, and it writes
         nothing to the droid: Wiring is still a reference. It is a link, not
         a button, because the file is a download the browser hands over, and
         it stays unavailable until the droid has answered, since there is no
         sheet to save before then.

         The plate headings below are EMPTY here too, for the same
         reason as the subtitle: data/wiring.js (PLATES) is their one home, and
         it writes them here and into the saved file, so the two copies cannot
         come to name a plate differently. -->
    <div class="title">
      <div>
        <h1>Wiring</h1>
        <!-- Whose sheet this is and when it was made, on paper only: a printed
             page loses the browser's header first (data/wiring.js). -->
        <p class="print-only" id="wiring-made"></p>
        <p class="wiring-promise" id="wiring-promise"></p>
      </div>
      <div class="acts wiring-acts">
        <!-- The printer icon stands for the word "Printable" (operator,
             2026-09-19 on #411), so the whole name rides in aria-label. -->
        <a class="btn" id="wiring-save" href="#wiring" aria-disabled="true" aria-label="Printable wiring sheet"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-printer-outline"/></svg>wiring sheet</a>
        <p class="feedback" id="wiring-save-feedback" role="status" aria-live="polite"></p>
      </div>
    </div>

    <!-- The wires: one picture of the board and every wire that leaves it -
         its Outputs and its serial links, each in its own color, named first
         by what the board prints (operator, 2026-09-19 on #411: "One diagram,
         every wire"). Written by data/wiring.js from what the running firmware
         reports (GET /api/config, GET /api/identity, GET /api/servo/outputs),
         so this markup carries no pin number and names no Output. Nothing
         under the drawing lists the Outputs a second time: which are wired
         and which are free is the table's below, and only there (operator,
         2026-10-01 on #463). -->
    <div class="card">
      <div class="sect">
        <h2 id="wiring-wires-heading"></h2>
        <span class="sub waiting" id="wiring-wires-summary" role="status" aria-live="polite"></span>
      </div>
      <div id="wiring-wires"></div>
    </div>

    <!-- The parts wiring table: the one table of what is on which wire, and
         what writes on this surface (operator, 2026-10-01 on #463). Each row
         is a Part, the Output it is on, and on the same row what is on that
         wire - its servo, or its Light Type (operator, 2026-09-29 on #411:
         "define and wire a body part/panel to a output (GPIO) and then for
         each you then define what servo type, same way for light on a part").
         The free Outputs, the Parts on no Output yet, the links - the serial
         links, then the dome's ESC, the radio and its receiver - and the
         dome's Parts are rows and groups of the same table, and a
         product's wiring card opens on the row of the product it belongs to
         (#458). It is data/parts_mapping.js picker(), mounted by
         data/wiring.js from data/outputs.js's answer, with its move question
         below. Each Output is named by what the board prints beside it.

         On paper the table is text: data/wiring.js writes the generator's
         own copy of it into the print-only block, and the stylesheet prints
         that in place of the controls. The saved sheet carries the same
         copy. The page itself never shows it. -->
    <div class="card">
      <div class="sect">
        <h2 id="wiring-parts-heading"></h2>
        <span class="sub waiting" id="wiring-parts-summary" role="status" aria-live="polite"></span>
      </div>
      <p class="apply-timing hidden" id="wiring-parts-timing"></p>
      <!-- A Find by Moving run's line - which free Output is nudging, That one,
           Stop - while a run started from a Part's row is going
           (data/find_by_moving.js). Empty otherwise. -->
      <div class="outputs-find" id="wiring-find"></div>
      <div class="parts-table-wrap" id="wiring-parts-table"></div>
      <div class="print-only" id="wiring-parts-sheet"></div>
      <p class="feedback" id="wiring-parts-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>

    <!-- What you said against what the droid reports (#454): one row per
         wire the drawing shows and per thing the droid reports on, each in
         one of four states - declared, observed, contradicted, not probed.
         Written by data/wiring.js lineUp() from the Live Reading and the
         answers above, and never by wiringDocument(): every value in it is
         live, so the printed sheet carries none of it. It reads, and each
         route is a link to where an answer is changed. Its last line says
         what it cannot see: the dome ESC and the RC receiver report no pins,
         which is also why the drawing above has no wire for them. -->
    <div class="card wiring-lineup-card">
      <div class="sect">
        <h2>Answers and readings</h2>
        <span class="sub waiting" id="wiring-lineup-summary" role="status" aria-live="polite"></span>
      </div>
      <div class="lineup-wrap" id="wiring-lineup"></div>
    </div>

    <!-- Power wiring: described, never drawn (CONTEXT.md "Wiring"). Its prose
         is the generator's for the same reason the promise is - the cadence is
         stated once, in one file, and the bench copy states the same one. -->
    <div class="card">
      <div class="sect">
        <h2 id="wiring-rail-heading"></h2>
        <span class="sub">described, not drawn</span>
      </div>
      <div id="wiring-rail"></div>
    </div>

    <!-- Product wiring (#458): how to wire and power each product on the
         droid, one card a product, from the wiring card its spec sheet
         carries. Reference content, which only an image built with the
         default asset set holds (ADR 0065, amended 2026-09-30): that set's
         partial is the plate and the cards, and the common root's is empty,
         so on a build without them this line inlines nothing. On the screen
         a card opens on its product's row of the table above, and this plate
         is not shown; on paper it prints every fitted product's card after
         Power wiring, with the running board's own pins beside each, and the
         saved sheet ends with the same cards (operator, 2026-10-01 on
         #463). -->
    <!-- PA:INCLUDE _wiring_cards.html -->

    <!-- The move question (#347): a Part taken off one Output for another
         is asked first, naming the Output it leaves. Opened non-modally over
         this surface alone, so STOP stays live (ADR 0048, #359). Every word
         on it, the two verbs included, is written by data/parts_mapping.js
         announcement() (#456). -->
    <dialog class="question-dialog" id="wiring-move-dialog" role="alertdialog" aria-labelledby="wiring-move-title" aria-describedby="wiring-move-body">
      <h4 class="move-title" id="wiring-move-title"></h4>
      <p class="move-body" id="wiring-move-body"></p>
      <div class="button-row">
        <button class="btn move-cancel" type="button" id="wiring-move-cancel"></button>
        <button class="btn accent move-confirm" type="button" id="wiring-move-confirm"></button>
      </div>
    </dialog>

    <!-- No bootstrap <script src> here on purpose: the inline kernel in <head>
         fetches /page_bootstrap.js itself, with retry, and hands it the script
         chain from <html data-scripts>. A bare tag has no retry, and the
         controller sheds connections in the opening burst by design. -->
  </body>
</html>
