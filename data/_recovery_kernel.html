<!-- data/_recovery_kernel.html

     Page Recovery View kernel, inlined into every controller page at build
     time by tools/gzip_fsdata.py (see the PA:INCLUDE directive in each page).

     This is the one part of the UI that must survive the failure it reports,
     so it depends on nothing that can be shed: colors are literal rather than
     custom properties (those live in /style.css), and it renders without any
     external script. It also fetches /page_bootstrap.js itself, with retry,
     because a bare markup tag has none and the controller sheds connections
     in the opening burst by design.

     THE LITERALS BELOW ARE DELIBERATE, and this is the only file in the
     product where one is (docs/ui-copy-voice.md rule 21). A var() would
     resolve to nothing in exactly the case this file exists for, so the
     anatomy's tokens are copied in by hand and each is named beside its
     value. Move a token in data/style.css, move it here: the pair has already
     disagreed once, when .indicator.info was repointed to the unlit dot
     (#399, ADR 0066) and the copy here stayed blue. Nothing here reports a
     state in blue - the Retry now button is the only interaction on the panel
     - and a page still finding out reads unlit, as the Status Plate's own
     freshness state does. No test holds the pair together (#406): the token
     copies are kept in step by hand.

     Edit here only -- pages carry the directive, never a copy. -->
    <style>
      /* The wash over whatever failed. Not a token either: --scrim is the
         sleep overlay's.

         Over the work area and nowhere else (ADR 0048): the topbar and the
         Status Plate are not the surface that failed, and the Latching Estop
         rides them. Absolute against #shell-content rather than fixed to the
         viewport, so it follows the work area at every breakpoint without
         this file knowing any of them. min-height because the work area is
         empty during a first surface load, which is when this is most often
         up. */
      #page-recovery-backdrop {
        position: absolute;
        inset: 0;
        min-height: 320px;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: flex-start;
        justify-content: center;
        z-index: 10001;
        /* System faces only: a page with no stylesheet has no webfont. */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
        font-size: 14px;                            /* --fs-body */
        line-height: 1.5;
      }
      #page-recovery-backdrop.active { display: flex; }
      /* The block stops at the same edge. A child combinator so the dim
         applies once, not once per nesting level - 0.4 four deep renders at
         0.0256, the bug #117 fixed. */
      body.recovery-active #shell-content > *:not(#page-recovery-backdrop) {
        opacity: 0.4;
        pointer-events: none;
      }
      /* Both are position: fixed, so they escape the work area and would
         cover a panel that no longer spans the viewport. */
      body.recovery-active .sleep-overlay,
      body.recovery-active .seq-modal {
        visibility: hidden;
        pointer-events: none;
      }
      /* An instrument plate: chamfer, seam, and .card's hair of light.
         Sticky because the work area is as tall as the surface that failed,
         so a panel pinned to its top can be a screen away from where the
         operator scrolled to. 76px is --topbar-h (60) + --space-lg (16). */
      #page-recovery-backdrop .recovery-panel {
        position: sticky;
        top: 76px;
        background: rgb(16, 24, 34);                /* --surface  #101822 */
        border: 1px solid rgb(34, 48, 65);          /* --border   #223041 */
        border-radius: 2px;                         /* --radius-plate */
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 12px 36px rgba(0, 0, 0, 0.45);          /* --elev-3 */
        padding: 16px;                              /* --space-lg */
        width: 90%;
        max-width: 380px;
        text-align: center;
      }
      #page-recovery-backdrop .recovery-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;                                   /* --space-sm */
        margin-bottom: 8px;
      }
      /* The controller said no. Amber, because a refusal is something the
         builder can act on and the act is the button underneath. */
      #page-recovery-backdrop .recovery-refused-banner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;                                   /* --space-sm */
        margin-bottom: 8px;
        color: rgb(232, 168, 50);                   /* --warning  #e8a832 */
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 11px;                            /* --fs-sect */
        font-weight: 600;
        letter-spacing: 0.16em;
      }
      /* A signal light, with the meanings data/style.css gives one: unlit for
         a thing nobody has answered yet, amber degraded, red stopped. Unlit is
         the default, and .info is spelled out because page_bootstrap.js
         writes it for the loading state. */
      #page-recovery-backdrop .indicator {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        background: rgb(165, 179, 196);             /* --text-dim  #a5b3c4 */
        box-shadow: none;
        opacity: 0.5;
      }
      #page-recovery-backdrop .indicator.info {
        background: rgb(165, 179, 196);             /* --text-dim, unlit */
        box-shadow: none;
        opacity: 0.5;
      }
      #page-recovery-backdrop .indicator.warn {
        background: rgb(232, 168, 50);              /* --warning */
        box-shadow: 0 0 6px rgba(232, 168, 50, 0.6);
        opacity: 1;
      }
      #page-recovery-backdrop .indicator.fail {
        background: rgb(232, 84, 84);               /* --danger  #e85454 */
        box-shadow: 0 0 6px rgba(232, 84, 84, 0.6);
        opacity: 1;
      }
      #page-recovery-backdrop .recovery-status-reason {
        color: rgb(228, 234, 242);                  /* --text  #e4eaf2 */
        font-size: 16px;                            /* --fs-h2 */
        font-weight: 600;
        line-height: 1.4;
      }
      #page-recovery-backdrop .recovery-status-detail {
        color: rgb(165, 179, 196);                  /* --text-dim */
        font-size: 13px;                            /* --fs-cell */
        margin-top: 4px;                            /* --space-2xs */
      }
      /* Which step the page is on. A readout, so the mono voice and the dim
         ink - it was the blue, which made a state read as an accent. */
      #page-recovery-backdrop .recovery-step {
        color: rgb(165, 179, 196);                  /* --text-dim */
        font-size: 11px;                            /* --fs-sect */
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        margin: 12px 0 0;                           /* --space-md */
      }
      /* A recessed well, as every readout plate on this product is. */
      #page-recovery-backdrop .recovery-countdown-panel {
        background: rgb(6, 10, 16);                 /* --well  #060a10 */
        border: 1px solid rgb(34, 48, 65);          /* --border */
        border-radius: 2px;                         /* --radius-plate */
        padding: 12px;                              /* --space-md */
        margin: 12px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;                                   /* --space-2xs */
      }
      /* The seconds to the next attempt: a mono readout in the ink. It was
         amber, and there is nothing to act on - the retry is already running,
         which is #324's argument for the plate's freshness line. */
      #page-recovery-backdrop .recovery-countdown-value {
        font-size: 28px;                            /* --fs-readout */
        font-weight: 600;
        color: rgb(228, 234, 242);                  /* --text */
        font-variant-numeric: tabular-nums;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        line-height: 1.1;
      }
      #page-recovery-backdrop .recovery-countdown-label {
        color: rgb(123, 139, 160);                  /* --text-faint  #7b8ba0 */
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 10px;                            /* --fs-hint */
        line-height: 1.6;
        letter-spacing: 0.06em;
        white-space: pre-line;
      }
      #page-recovery-backdrop .recovery-message {
        color: rgb(165, 179, 196);                  /* --text-dim */
        font-size: 13px;                            /* --fs-cell */
        line-height: 1.55;
        margin: 12px 0 0;                           /* --space-md */
      }
      #page-recovery-backdrop .recovery-actions {
        display: flex;
        gap: 8px;                                   /* --space-sm */
        margin-top: 16px;                           /* --space-lg */
        justify-content: center;
      }
      /* The one thing pressed here, so the one thing blue: .btn.accent's own
         face, a button's corner rather than a plate's, and the 36 px floor. */
      #page-recovery-backdrop .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;                            /* --space-lg */
        background: rgb(29, 79, 147);               /* --accent-dim  #1d4f93 */
        color: rgb(228, 234, 242);                  /* --text */
        border: 1px solid rgb(77, 143, 232);        /* --accent  #4d8fe8 */
        border-radius: 3px;                         /* --radius-xs */
        font-size: 13px;                            /* --fs-cell */
        font-weight: 500;
        font-family: inherit;
        line-height: 1.2;
        cursor: pointer;
        min-height: 36px;
      }
      #page-recovery-backdrop .btn:hover { border-color: rgb(106, 176, 255); }  /* --accent-bright */
      #page-recovery-backdrop .btn:focus-visible {
        outline: 2px solid rgb(77, 143, 232);       /* --accent */
        outline-offset: 2px;
      }
      /* Motion rather than colour: the page is working, which is not a state
         the droid is in. */
      #page-recovery-backdrop .recovery-spinner {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 2px solid rgba(165, 179, 196, 0.2); /* --text-dim, unlit */
        border-top-color: rgb(165, 179, 196);       /* --text-dim */
        border-radius: 50%;
        animation: recovery-spin 0.8s linear infinite;
        margin-right: 8px;                          /* --space-sm */
        vertical-align: -1px;
      }
      @keyframes recovery-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #page-recovery-backdrop .recovery-spinner { animation: none; opacity: 0.7; }
      }
    </style>

    <!-- Recovery kernel: inline on purpose. Everything below it can be shed
         by the controller under load, including the scripts that render the
         real recovery view, so the page must be able to say what is happening
         using nothing but what already arrived in this response. Shows the
         loading state immediately and, if the bootstrap never takes over,
         reports that itself with a working retry. -->
    <script>
      (function () {
        var backdrop = document.createElement("div");
        backdrop.id = "page-recovery-backdrop";
        backdrop.setAttribute("role", "status");
        backdrop.setAttribute("aria-live", "polite");
        backdrop.setAttribute("aria-atomic", "true");

        // The bootstrap file this kernel is responsible for fetching, and the
        // chain it drives once it runs. Loading it from here rather than from
        // a plain markup tag is deliberate: a bare tag has no retry, so one
        // shed connection would kill the page permanently, and this kernel is
        // the only code guaranteed to be present to recover from that.
        // Each page declares its own script chain on <html data-scripts>, so
        // this kernel stays identical across every page. documentElement is
        // available here even though this runs in <head> before <body> exists.
        var BOOTSTRAP_SRC = "/page_bootstrap.js";
        var PAGE_SCRIPTS = document.documentElement.getAttribute("data-scripts") || "";

        // The controller sheds connections under burst pressure by design, so
        // a failed fetch here is expected rather than exceptional.
        var MAX_BOOTSTRAP_ATTEMPTS = 4;
        var BOOTSTRAP_RETRY_BASE_MS = 400;

        // Final backstop: if the bootstrap never takes over even after those
        // attempts, say so rather than sitting on a spinner.
        var TAKEOVER_DEADLINE_MS = 10000;

        // The Operator Shell's work area, so the chrome around it -- and the
        // Latching Estop on it -- stays pressable while a surface is failing
        // to load (ADR 0048). page_bootstrap.js reads the same element, so
        // both entrances land in the same place; a build with no work area has
        // no frame to keep live, and the body is the honest fallback.
        function host() {
          return document.getElementById("shell-content") || document.body;
        }

        function panel(html) {
          backdrop.innerHTML = '<div class="recovery-panel">' + html + "</div>";
          backdrop.classList.add("active");
          document.body.classList.add("recovery-active");
        }

        function showLoading() {
          panel(
            '<div class="recovery-header"><span class="indicator info"></span>' +
              '<div><div class="recovery-status-reason">Loading page resources</div>' +
              '<div class="recovery-status-detail">Preparing the controller page</div></div></div>' +
              '<p class="recovery-step"><span class="recovery-spinner"></span>Loading: page files</p>' +
              '<p class="recovery-message">Completed resources stay loaded.</p>'
          );
        }

        function showStalled() {
          panel(
            '<div class="recovery-header"><span class="indicator fail"></span>' +
              '<div><div class="recovery-status-reason">No response from controller</div>' +
              '<div class="recovery-status-detail">The page could not finish loading its files.</div></div></div>' +
              '<p class="recovery-message">The controller may be busy. Retry when ready.</p>' +
              '<div class="recovery-actions"><button type="button" class="btn" id="recovery-kernel-retry">Retry now</button></div>'
          );
          var button = document.getElementById("recovery-kernel-retry");
          if (button) button.addEventListener("click", function () { window.location.reload(); });
        }

        function loadBootstrap(attempt) {
          var script = document.createElement("script");
          script.src = BOOTSTRAP_SRC;
          script.async = false;
          // The host reads its chain from its own script tag; document.
          // currentScript is set for dynamically inserted classic scripts too.
          script.setAttribute("data-scripts", PAGE_SCRIPTS);
          script.onerror = function () {
            script.remove();
            if (attempt < MAX_BOOTSTRAP_ATTEMPTS) {
              window.setTimeout(function () {
                loadBootstrap(attempt + 1);
              }, BOOTSTRAP_RETRY_BASE_MS * attempt);
              return;
            }
            showStalled();
          };
          document.body.appendChild(script);
        }

        function start() {
          host().appendChild(backdrop);
          showLoading();
          loadBootstrap(1);
          window.setTimeout(function () {
            // The real view replaces this content once it renders; only claim
            // a stall if the bootstrap genuinely never arrived.
            if (!window.PABootstrap || !window.PARecoveryView) showStalled();
          }, TAKEOVER_DEADLINE_MS);
        }

        // A surface document reached directly carries a thin delegate that has
        // already handed this visit to the Operator Shell (ADR 0048). The
        // navigation it queued has not happened yet, so this document keeps
        // parsing -- but its bootstrap would only load a page that is about to
        // be replaced, and the controller sheds connections in the opening
        // burst by design. Stand down instead of spending one.
        if (window.PAShellDelegate) return;

        if (document.body) start();
        else document.addEventListener("DOMContentLoaded", start, { once: true });
      })();
    </script>
