<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WiFi - protoArtoo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/r2d2body-favicon.png">
  </head>
  <body data-page="wifi">
    <div id="shell-top"></div>


    <!-- WiFi Client card — shown when firmware is built in STA mode -->
    <div class="card hidden" id="wifi-sta-card">
      <h3>🌐 WiFi Client</h3>
      <div class="desc" id="wifi-sta-desc">Running in WiFi Client (STA) mode.</div>
      <div class="status-grid mt-16">
        <div class="status-item">
          <dt>Status</dt>
          <dd id="wifi-sta-connected">--</dd>
        </div>
        <div class="status-item">
          <dt>IP Address</dt>
          <dd id="wifi-sta-ip">--</dd>
        </div>
        <div class="status-item">
          <dt>📶 Signal</dt>
          <dd id="wifi-signal">--</dd>
          <div class="desc mt-6">RSSI: <span id="wifi-rssi">--</span> dBm</div>
        </div>
      </div>
    </div>

    <!-- Access Point card — active in AP-mode builds -->
    <div class="card" id="wifi-ap-card">
      <h3>📡 Access Point</h3>
      <div class="desc" id="wifi-ap-desc">Connect to this network to reach the controller.</div>
      <div class="status-grid mt-16">
        <div class="status-item">
          <dt>Network Name</dt>
          <dd id="wifi-ap-ssid">--</dd>
        </div>
        <div class="status-item">
          <dt>IP Address</dt>
          <dd id="wifi-ap-ip">--</dd>
        </div>
      </div>
    </div>

    <div class="button-row">
      <button id="reload-wifi-button" class="btn" type="button">🔄 Refresh</button>
    </div>
    <div id="wifi-feedback" class="feedback mt-12" role="status" aria-live="polite" aria-atomic="true">Loading WiFi status...</div>

    <div id="shell-status"></div>

    <script src="/web_api.js"></script>
    <script src="/status_stream.js"></script>
    <script src="/shell.js"></script>
    <script src="/wifi.js"></script>
    <script src="/footer.js"></script>
  </body>
</html>
