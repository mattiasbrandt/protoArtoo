<script type="application/json" id="wiring-product-cards">{"firebeetle2":{"supply":"5 V DC, on USB-C or VIN","draw":"80 mA idle. WiFi peaks at 1330 mA as an access point, 1050 mA joined to a network","logic":"3.3 V only","wires":[{"from":"VIN","to":"a 5 V supply","note":"sized for the WiFi peak"}],"hazards":["No GPIO header pin takes 5 V. The 5 V rail is power only."]},"hotrc_ds650":{"supply":"built-in 1S lithium, 1500 mAh, charged over USB-C","draw":"UNKNOWN. The 1200 mAh handset before it ran out inside a field day","logic":"none: it reaches the droid by radio, through its receiver","wires":[],"hazards":["CCS holds the throttle with your thumb off the stick. The droid keeps going and cannot tell.","The handset will not switch off while its receiver has power. Power the droid down first."]},"rc_transmitter_pwm":{"supply":"4.5-6 V on the red wire of a HotRC receiver","draw":"UNKNOWN","logic":"3.3-5 V. A 5 V output needs a divider before the board","wires":[{"from":"Signal, white or orange","to":"one of the board's RC channel pins","note":"one wire for each channel"},{"from":"+, red","to":"4.5-6 V from a BEC","note":"not straight from the battery"},{"from":"-, black","to":"the board's ground","note":"shared"}],"hazards":["A receiver that puts out 5 V damages the board's pins. Put a 3.9k/6.8k divider on each signal wire."]},"rc_transmitter_sbus":{"supply":"UNKNOWN here: it is the receiver's own figure","draw":"UNKNOWN here: it is the receiver's own figure","logic":"inverted serial, 100000 baud, 8E2. Its voltage is UNKNOWN","wires":[{"from":"Signal","to":"one of the board's RC pins","note":"one wire carries every channel"}],"hazards":["The droid reads inverted SBUS. Some FrSky receivers send it non-inverted."]},"esp32_gpio_ledc":{"supply":"4.8-6.0 V on the servo's power wire, from a supply of its own","draw":"hundreds of mA to over 1 A a servo on a spike. An MG996R stalls at 1.0-1.4 A","logic":"3.3 V signal, which most servos take","wires":[{"from":"Servo signal","to":"the output's pin"},{"from":"Servo ground","to":"the board's ground and the servo supply's ground","note":"always shared"},{"from":"Servo power","to":"the servo supply","note":"never the board's own regulator"}],"hazards":["A servo surge on the board's own regulator resets the Body Controller mid-move. Power servos from a separate supply.","A servo held against a hard stop overheats. Record its ends short of the stops."]},"isdt_esc70":{"supply":"2-3S LiPo, 6.0-12.6 V, on a rail of its own","draw":"rated 70 A continuous. A dome motor pulls single-digit amps","logic":"takes a 3.3 V signal: measured on one Artoo PCB, not yet on a FireBeetle 2","wires":[{"from":"Throttle wire, signal","to":"the board's dome ESC pin"},{"from":"Throttle wire, ground","to":"the board's ground"},{"from":"Throttle wire, centre","to":"nothing","note":"it is the BEC's 5.0-7.5 V out: cut it or tape it back"},{"from":"Motor wires","to":"the dome motor","note":"either way round"},{"from":"Battery wires","to":"a 2-3S pack or a 12 V step-down","note":"polarity matters"}],"hazards":["The throttle wire's centre conductor is 5.0-7.5 V out. Plugged onto a FireBeetle 2 row it lands on the 3.3 V plane and kills the board.","Over 12.6 V destroys it at once. A 36 V hoverboard pack does, and so does a 4S pack.","Battery wires the wrong way round damage the ESC.","A jammed dome is not protected. Its 120 A limit is out of a dome motor's reach."]},"astropixels_plus":{"supply":"clean 5 V, 1 A minimum: best from a buck converter in the dome","draw":"about 700 mA in normal use, the vendor's estimate. Measured is UNKNOWN","logic":"3.3 V","wires":[{"from":"T","to":"the board's dome link RX","note":"crossed, through the slip ring"},{"from":"R","to":"the board's dome link TX","note":"crossed, through the slip ring"},{"from":"G","to":"the board's ground","note":"common ground is mandatory"},{"from":"V","to":"nothing","note":"no power crosses the slip ring"}],"hazards":["V on the dome header stays unconnected. Two supplies joined through the slip ring feed each other.","A freshly flashed dome talks 2400 and the body talks 9600. Set mserial2 to 9600 on the dome's Setup page, or the link stays silent.","The USB port on its ESP32 is fragile. Power a fitted dome from the screw terminal."]},"hoverboard":{"supply":"its own drive battery, 10S Li-ion, 42 V full. None from the board","draw":"UNKNOWN. The firmware caps each motor at 15 A by default","logic":"3.3 V is safe on either sensor cable. The left cable is not 5 V tolerant","wires":[{"from":"TX","to":"the board's Foot Drive RX","note":"crossed"},{"from":"RX","to":"the board's Foot Drive TX","note":"crossed"},{"from":"GND","to":"the board's ground","note":"the two sides share nothing else"},{"from":"Red wire","to":"nothing"}],"hazards":["Gen 2: wire to the empty header by the flash header, PB6/PB7. The 4-pin header joins its two motor boards.","The red wire on a sensor cable is 12-15 V, not 5 V. On some hoverboards the black wire is live too.","With a 6-wire hall cable, the right sensor cable carries battery voltage, 36-42 V.","Nothing isolates the two sides. A fault on the 36 V side reaches the Body Controller through ground.","The battery reading is not good to a tenth of a volt until that hoverboard is calibrated."]},"dy_sv5w":{"supply":"DC 5 V","draw":"about 0.7 A at full volume, by arithmetic: budget 1 A. Idle is UNKNOWN","logic":"3.3 V on every I/O pin, UART included: no level shifter","wires":[{"from":"TXD/IO0","to":"the board's sound RX","note":"crossed: TX to RX"},{"from":"RXD/IO1","to":"the board's sound TX","note":"crossed: RX to TX"},{"from":"5V+ and 5V-","to":"a 5 V supply and its ground"},{"from":"GND","to":"ground"},{"from":"Speaker pads","to":"a 4 ohm speaker","note":"or the 3.5 mm jack to an amplifier"}],"hazards":["Neither Speaker pad is ground. Never wire one to ground or to an amplifier input.","The 5 W on the box is about 3 W. A loud sound on a shared 5 V regulator browns the droid out."]},"mp3_trigger":{"supply":"4.5-12 V DC, or regulated 3.3 V, by its jumper","draw":"about 45 mA idle, 85 mA playing","logic":"takes 3.3 V on its RX. What its TX puts out is UNKNOWN","wires":[{"from":"Serial RX","to":"the board's sound TX","note":"crossed"},{"from":"Serial TX","to":"the board's sound RX","note":"crossed, and only once its level is measured"},{"from":"Audio jack","to":"an amplifier","note":"no amplifier on the module. AC-couple a long cable"}],"hazards":["Its TX level is UNKNOWN and the board's sound RX is not 5 V tolerant. Measure TX at idle first, or power the module from its 3.3 V jumper.","A new module talks 38400 and the droid talks 9600. Without MP3TRIGR.INI holding '#BAUD 9600' on the card, it never answers.","The card is read at power-up only. Change the card, then power the module off and on.","The audio output carries a DC offset. Static from a long cable can kill the decoder chip."]},"chirp":{"supply":"5 V on the +5V pin or the screw pads, or USB-C: the POWER SELECT jumper picks","draw":"UNKNOWN","logic":"3.3 V","wires":[{"from":"TX","to":"the board's sound RX","note":"crossed"},{"from":"RX","to":"the board's sound TX","note":"crossed"},{"from":"G","to":"the board's ground","note":"the grounds must be common"},{"from":"+5V","to":"a 5 V supply"},{"from":"3.5 mm jack","to":"an amplifier","note":"no amplifier on the module"}],"hazards":["The droid talks 9600 only, and the stock firmware talks 115200. Hold Prev and press Play/Stop until the module says 9600."]}}</script>
