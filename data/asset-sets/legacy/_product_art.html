<!--
  Product drawings for the legacy asset set (#382, ADR 0065).

  One line drawing per Component Registry product, in place of the default
  set's photograph. Drawn for this project from the product photographs as
  reference; nothing here is traced, so the set carries one hand and no
  third-party copyright.

  Why one sprite rather than a file each: littlefs charges a 4 KiB block per
  file whatever the content, so twenty drawings as twenty files cost 81,920 B
  to carry 25 KB of art. Inlined they cost about 8 KB, and the drawings pick up
  the page's colour, which an SVG reached by <img> or an external <use> cannot.
  A partial is not imaged (tools/gzip_fsdata.py), so this file costs the
  artoo-esp32 nothing at all until a page inlines it.

  The symbols carry no <title>: a Component Picker card names its product in
  text beside the drawing, so the drawing is decorative and the card marks it
  aria-hidden. A card asks the document for its art and falls back to the
  photograph when there is no symbol, which is how one page serves both sets:

      const art = document.getElementById('art-' + id);   // legacy
      // else <img src="/<id>.webp">                       // default

  Every id here is the product's Component Registry token
  (include/component_registry.inc), prefixed 'art-'. The two are kept in step
  by test/test_tools/test_product_art.py, which fails when a product has no
  drawing or a drawing names no product.
-->
<!-- Sized to nothing rather than marked hidden: `hidden` is an HTML attribute
     and the user-agent rule behind it does not reach an SVG element, which
     would otherwise take its default 300x150 of the page. display:none is
     avoided too, since it can stop referenced content rendering through <use>. -->
<svg class="product-art-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <!-- Shared marks. A drawing is stroke-only on currentColor; the few solid
         marks (pins, LEDs, sockets) are the same currentColor at low opacity,
         so a drawing reads as one hand rather than as outline plus fill. -->
    <g id="art-led-row" fill="currentColor" opacity=".5" stroke="none">
      <circle cx="0" cy="0" r="1.7"/><circle cx="10" cy="0" r="1.7"/>
      <circle cx="20" cy="0" r="1.7"/><circle cx="30" cy="0" r="1.7"/>
      <circle cx="40" cy="0" r="1.7"/><circle cx="50" cy="0" r="1.7"/>
      <circle cx="60" cy="0" r="1.7"/><circle cx="70" cy="0" r="1.7"/>
      <circle cx="80" cy="0" r="1.7"/><circle cx="90" cy="0" r="1.7"/>
      <circle cx="100" cy="0" r="1.7"/><circle cx="110" cy="0" r="1.7"/>
      <circle cx="120" cy="0" r="1.7"/>
    </g>
    <!-- One servo channel: signal, positive, ground, the way a three-pin
         header reads on a board silkscreen. -->
    <g id="art-pin3" fill="currentColor" opacity=".55" stroke="none">
      <rect x="0" y="0" width="4" height="4"/>
      <rect x="0" y="7" width="4" height="4"/>
      <rect x="0" y="14" width="4" height="4"/>
    </g>
    <!-- A screw terminal: the block and the driver slot in its screw head. -->
    <g id="art-screw" fill="none" stroke="currentColor" stroke-width="1.15">
      <rect x="0" y="0" width="16" height="16" rx="1.5"/>
      <circle cx="8" cy="8" r="4.6"/>
      <path d="M4.6 8h6.8"/>
    </g>
    <!-- An eight-pin chip, the mark that stops a board reading as an empty box. -->
    <g id="art-chip" fill="none" stroke="currentColor" stroke-width="1.15">
      <rect x="0" y="0" width="34" height="22" rx="2"/>
      <circle cx="5" cy="5" r="1.6" fill="currentColor" stroke="none" opacity=".6"/>
      <path d="M6 0v-3M14 0v-3M22 0v-3M30 0v-3M6 22v3M14 22v3M22 22v3M30 22v3" opacity=".7"/>
    </g>
    <!-- An ESP32 module: the shield can and the meander antenna, which is what
         makes one readable as an ESP32 at card size. -->
    <g id="art-esp32" fill="none" stroke="currentColor">
      <rect x="0" y="0" width="72" height="56" rx="2" stroke-width="1.6"/>
      <path d="M10 12h5v-6h5v6h5v-6h5v6h5v-6h5v6h5v-6h5v6h5" stroke-width="1.15"/>
      <rect x="8" y="20" width="56" height="28" rx="1.5" stroke-width=".9" opacity=".55"/>
    </g>
  </defs>
