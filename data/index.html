<!doctype html>
<html lang="en" data-scripts="/web_api.js,/status_stream.js,/live_reading.js,/shell.js,/footer.js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/r2d2body-favicon.png">
    <title>protoArtoo</title>
    <link rel="stylesheet" href="/style.css">
    <!-- PA:INCLUDE _recovery_kernel.html -->
  </head>
  <!-- The Operator Shell document (ADR 0048). It is the only document the
       browser ever loads: every surface is a hash route under it, its markup
       fetched from the .html file that still owns it and mounted into
       #shell-content, while the topbar, the nav, the status bar and the
       /api/events stream opened at boot survive underneath.

       The chain above is the shell's own, and it is short on purpose: a surface
       declares its scripts on its own <html data-scripts> and the shell hands
       them to the bootstrap when that surface is first opened, so a builder who
       never visits Sequences never pays for seq.js.

       The four regions are the frame (ADR 0066): the topbar across the top, the
       nav rail down the left, the work area beside it, and the Status Plate
       fixed to the foot of the viewport. They are empty here and filled by
       shell.js; they are elements rather than nodes the shell creates because
       the rail has to sit BETWEEN the topbar and the work area, and a document
       that declares its own frame is one a reader can see the shape of.

       data-page is the current surface's identifier, kept up to date by the
       shell; the value here is only what a frame with nothing mounted says. -->
  <body data-page="home">
    <div id="shell-top"></div>
    <nav id="shell-nav"></nav>
    <div id="shell-content"></div>
    <div id="shell-status"></div>

    <!-- No bootstrap <script src> here on purpose: the inline kernel in <head>
         fetches /page_bootstrap.js itself, with retry, and hands it the script
         chain from <html data-scripts>. A bare tag has no retry, and the
         controller sheds connections in the opening burst by design. -->
  </body>
</html>
