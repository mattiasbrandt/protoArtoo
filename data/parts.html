<!doctype html>
<html lang="en" data-scripts="/web_api.js,/status_stream.js,/live_reading.js,/health_signals.js,/shell.js,/droid_parts.js,/droid_part_kind.js,/droid_build.js,/dome_panel_model.js,/body_art.js,/body_view.js,/outputs.js,/parts_mapping.js,/parts.js,/footer.js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parts - protoArtoo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/r2d2body-favicon.png">
    <!-- Thin delegate: a direct visit is handed to the shell at this route (ADR 0048). -->
    <script>window.PAShellDelegate = true; location.replace("/#parts");</script>
  </head>
  <body data-page="parts">

    <!-- The title is the name in the nav (ADR 0066). Every act on this page is named beside the row it acts on, so the title carries
         none of its own. -->
    <div class="title">
      <div>
        <h1>Parts</h1>
        <!-- A moved thing leaves a forwarding address. Calibration, Find by
             moving and back to centre went to Servos with the output table
             (operator, 2026-09-19 on #412). -->
        <p class="forward">Calibrate an output and find which one moves a part on <a href="#servo">Servos</a>.</p>
      </div>
    </div>

    <!-- The picture, at the head of the surface: a builder reads what the whole
         droid is doing off it before they read a row (ADR 0063, #352, #372).
         One card, three faces - Front, Rear and Dome (Top) - with the
         selection panel, the legend and the Parts list in the rail beside it.
         All of it is written into this card by data/body_view.js; a click on
         the picture only ever selects, and the acts are the named buttons in
         the panel. -->
    <div class="card">
      <div class="bv-layout">
        <div class="bv-drawing" id="bodyview-drawing"></div>
        <div class="bv-rail" id="bodyview-panel"></div>
      </div>
    </div>

    <!-- The part-first projection of the one mapping (CONTEXT.md "Parts").
         The output-first one is on Servos and moves a Part through the same
         request (data/parts_mapping.js), so the two cannot disagree. -->
    <div class="card">
      <div class="sect">
        <h2>Parts</h2>
        <span class="sub" id="parts-summary" role="status" aria-live="polite"></span>
      </div>
      <p class="note">A part lives on one output; picking a new one <b>moves</b> it. One output can drive several parts, like two doors on one wire.</p>
      <div class="parts-table-wrap" id="parts-table"></div>
      <p class="feedback" id="parts-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>

    <dialog class="parts-move-dialog" id="parts-move-dialog" role="alertdialog" aria-labelledby="parts-move-title" aria-describedby="parts-move-body">
      <h4 class="move-title" id="parts-move-title"></h4>
      <p class="move-body" id="parts-move-body"></p>
      <div class="button-row">
        <button class="btn move-cancel" type="button" id="parts-move-cancel">Cancel</button>
        <button class="btn accent move-confirm" type="button" id="parts-move-confirm">Move it</button>
      </div>
    </dialog>

  </body>
</html>
