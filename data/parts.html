<!doctype html>
<html lang="en" data-scripts="/web_api.js,/status_stream.js,/live_reading.js,/health_signals.js,/shell.js,/dome_bearing.js,/droid_parts.js,/droid_part_kind.js,/droid_build.js,/dome_panel_model.js,/body_art.js,/body_view.js,/outputs.js,/parts_mapping.js,/droid_picture.js,/parts.js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parts - protoArtoo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/r2d2body-favicon.png">
    <!-- Thin delegate: a direct visit is handed to the shell at this route (ADR 0048). -->
    <script>window.PAShellDelegate = true; location.replace("/#parts");</script>
  </head>
  <body data-page="parts">

    <!-- The title is the name in the nav (ADR 0066). Every act on this page is named beside the row it acts on, so the title carries
         none of its own. -->
    <div class="title">
      <div>
        <h1>Parts</h1>
        <!-- A moved thing leaves a forwarding address. Calibration, Find by
             moving and back to centre went to Servos with the output table
             (operator, 2026-09-19 on #412), and the part-first picker went to
             Wiring (operator, 2026-09-28 on #411). -->
        <p class="forward">Put a part on an output on <a href="#wiring">Wiring</a>. Calibrate an output and find which one moves a part on <a href="#servo">Servos</a>.</p>
      </div>
    </div>

    <!-- The picture, at the head of the surface: a builder reads what the whole
         droid is doing off it before they read a row (ADR 0063, #352, #372).
         One card, three faces - Front, Rear and Dome (Top) - with the
         selection panel, the legend and the Parts list in the rail beside it.
         All of it is written into this card by data/body_view.js; a click on
         the picture only ever selects, and the acts are the named buttons in
         the panel. -->
    <div class="card">
      <div class="bv-layout">
        <div class="bv-drawing" id="bodyview-drawing"></div>
        <div class="bv-rail" id="bodyview-panel"></div>
      </div>
      <p class="feedback" id="parts-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>

    <!-- Unused: the Parts no Output claims, moved here from Wiring (operator,
         2026-09-28 on #411). Each row's act routes to the Part's row in the
         picker on Wiring, the same route as the picture's "Give it an
         output". Written by data/parts.js. -->
    <div class="card">
      <div class="sect">
        <h2>Unused</h2>
        <span class="sub waiting" id="parts-unused-summary" role="status" aria-live="polite"></span>
      </div>
      <div id="parts-unused"></div>
    </div>

  </body>
</html>
