<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="PCA9685 servo driver board: a long narrow board with sixteen three-pin servo headers in a row">
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- board outline, 62.5 x 25.4 mm at 5.1 px/mm -->
    <rect x="42" y="118" width="319" height="130" rx="4" stroke-width="2.4"/>
    <!-- four mounting holes, 2.5 mm -->
    <g stroke-width="1.6">
      <circle cx="56" cy="132" r="5"/><circle cx="347" cy="132" r="5"/>
      <circle cx="56" cy="234" r="5"/><circle cx="347" cy="234" r="5"/>
    </g>
    <!-- the sixteen 3-pin PWM headers: the board's whole identity -->
    <g stroke-width="1.3">
      <rect x="74" y="150" width="260" height="52" rx="2"/>
    </g>
    <g stroke-width="1.15" opacity="0.95">
      <!-- 16 columns x 3 pins -->
      
    </g>
  </g>
  <!-- pin columns drawn explicitly: 16 groups of 3 -->
  <g fill="currentColor" opacity="0.9">
    <!-- generated grid: x = 82 + n*16.6, three rows -->
    <g id="grid"><rect x="78.8" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="78.8" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="78.8" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="95.4" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="95.4" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="95.4" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="112.0" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="112.0" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="112.0" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="128.6" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="128.6" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="128.6" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="145.2" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="145.2" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="145.2" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="161.8" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="161.8" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="161.8" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="178.4" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="178.4" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="178.4" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="195.0" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="195.0" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="195.0" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="211.6" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="211.6" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="211.6" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="228.2" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="228.2" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="228.2" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="244.8" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="244.8" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="244.8" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="261.4" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="261.4" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="261.4" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="278.0" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="278.0" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="278.0" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="294.6" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="294.6" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="294.6" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="311.2" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="311.2" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="311.2" y="190.8" width="6.4" height="6.4" rx="1"/><rect x="327.8" y="154.8" width="6.4" height="6.4" rx="1"/><rect x="327.8" y="172.8" width="6.4" height="6.4" rx="1"/><rect x="327.8" y="190.8" width="6.4" height="6.4" rx="1"/></g>
  </g>
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <!-- I2C / chain header, 6 pins, left short edge -->
    <rect x="46" y="152" width="20" height="82" rx="2" stroke-width="1.3"/>
    <!-- V+ screw terminal, right short edge -->
    <rect x="337" y="152" width="20" height="82" rx="2" stroke-width="1.3"/>
    <circle cx="347" cy="172" r="5" stroke-width="1.15"/>
    <circle cx="347" cy="214" r="5" stroke-width="1.15"/>
    <!-- the PCA9685 chip itself -->
    <rect x="176" y="214" width="52" height="24" rx="2" stroke-width="1.3"/>
    <!-- address jumper pads -->
    <g stroke-width="1.15" opacity="0.85">
      <rect x="90" y="220" width="9" height="9"/><rect x="104" y="220" width="9" height="9"/>
      <rect x="118" y="220" width="9" height="9"/><rect x="132" y="220" width="9" height="9"/>
      <rect x="146" y="220" width="9" height="9"/><rect x="160" y="220" width="9" height="9"/>
    </g>
  </g>
  <!-- channel numbering, the silkscreen a builder reads -->
  <g fill="currentColor" font-family="ui-monospace,monospace" font-size="11" opacity="0.75">
    <text x="82" y="144">0</text><text x="322" y="144">15</text>
  </g>
</svg>
