<!doctype html>
<html lang="en" data-scripts="/web_api.js,/overlay.js,/status_stream.js,/live_reading.js,/health_signals.js,/shell.js,/droid_parts.js,/droid_part_kind.js,/outputs.js,/parts_mapping.js,/servo.js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servos - protoArtoo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/r2d2body-favicon.png">
    <!-- Thin delegate. This file is the one copy of this surface's markup and
         the Operator Shell fetches it; fetching never runs scripts, so this
         line is inert for the shell. A browser that lands here directly -- a
         bookmark, an old link, a support conversation -- is handed to the shell
         at this surface's route instead, so the address keeps opening what it
         names (ADR 0048). -->
    <script>window.PAShellDelegate = true; location.replace("/#servo");</script>
  </head>
  <body data-page="servo">

    <!-- The title is the name in the nav (ADR 0066). The acts are all on the
         rows they act on, so the title carries none. -->
    <div class="title">
      <div>
        <h1>Servos</h1>
      </div>
    </div>

    <!-- The Outputs with a Part on them, one row each, named by the Part(s)
         and by what the board prints beside the pin: the output-first side of
         the mapping Parts reads from the part's end (CONTEXT.md "Servos"). An
         Output with no Part is free and not listed, and with none the table
         sends the builder to Wiring (operator, 2026-09-29 on #411). Driving an
         Output, calibrating it and back to centre are all here (operator,
         2026-09-19 on #412); which servo it carries is picked on Wiring, on
         the Part's row, where Find by Moving starts too (#411). The rows and
         the dial are drawn by data/servo.js from the firmware's answer; this
         page names no Output of its own. -->
    <div class="card" id="outputs-card">
      <div class="sect"><h2>Outputs</h2><span class="sub outputs-tiers" id="outputs-tiers" role="status" aria-live="polite"></span></div>
      <!-- The one act over every row: send them all back to centre, on the
           right. Find by moving starts from Wiring, where a Part with no
           Output is listed (#411); every row here has a Part. -->
      <div class="outputs-tools">
        <div class="outputs-bulk">
          <p class="feedback" role="status" aria-live="polite"></p>
          <button class="btn btn-sm btn-quiet outputs-centre icon-act act-keeps-words" type="button" disabled aria-disabled="true"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-format-horizontal-align-center"/></svg><span class="act-label">back to centre</span></button>
        </div>
      </div>
      <!-- The one visible explanation at the controls that move something
           (ADR 0059), and rule 7 of the maker voice: both marks are what the
           controller told the servo, never where it is. -->
      <p class="hint outputs-marks">The bar is where it was told to go, the tick where the move ends. Nothing reads a servo back.</p>
      <div class="parts-table-wrap" id="outputs-table"></div>
      <!-- The calibration dial opens here, under the rows, for one Output at a time. -->
      <div id="outputs-dial"></div>
      <p class="feedback" id="outputs-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
      <!-- One Setting set on every ticked row in one press (#457). It moves
           nothing, so it sits apart from the acts that do (rule 17): back to
           centre is over the rows and the dial opens right under them, and
           this line comes after both and after the rows' own answer. Its
           answer is at its own foot (rule 18). data/servo.js fills the
           choices from the droid's own words and shows the line once there
           is a row to tick. -->
      <div class="outputs-apply" hidden>
        <div class="outputs-apply-line">
          <span class="outputs-apply-picks">
            <button class="btn btn-sm btn-quiet outputs-pick-all icon-act" type="button"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-checkbox-multiple-marked-outline"/></svg><span class="act-label">tick all</span></button>
            <button class="btn btn-sm btn-quiet outputs-pick-none icon-act" type="button" disabled aria-disabled="true"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-checkbox-multiple-blank-outline"/></svg><span class="act-label">clear ticks</span></button>
          </span>
          <div class="seg outputs-apply-field" role="radiogroup" aria-label="What to set on the ticked outputs"></div>
          <span class="outputs-apply-value"></span>
          <button class="btn btn-sm outputs-apply-set icon-act act-keeps-words" type="button" disabled aria-disabled="true"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-content-save-outline"/></svg><span class="act-label">Set on ticked outputs</span></button>
          <span class="hint outputs-boot-risk is-risk" hidden>Hold keeps the pulse on, so a blocked part grinds.</span>
        </div>
        <p class="feedback" role="status" aria-live="polite"></p>
      </div>
    </div>

    <!-- The move question, the same one Wiring asks: every word on it is
         written by data/parts_mapping.js announcement() (#456). -->
    <dialog class="question-dialog" id="outputs-move-dialog" role="alertdialog" aria-labelledby="outputs-move-title" aria-describedby="outputs-move-body">
      <h4 class="move-title" id="outputs-move-title"></h4>
      <p class="move-body" id="outputs-move-body"></p>
      <div class="button-row">
        <button class="btn move-cancel icon-act act-keeps-words" type="button"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-close"/></svg><span class="act-label"></span></button>
        <button class="btn accent move-confirm icon-act act-keeps-words" type="button"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-transfer"/></svg><span class="act-label"></span></button>
      </div>
    </dialog>

    <!-- No bootstrap <script src> here on purpose: the inline kernel in <head>
         fetches /page_bootstrap.js itself, with retry, and hands it the script
         chain from <html data-scripts>. A bare tag has no retry, and the
         controller sheds connections in the opening burst by design. -->
  </body>
</html>
