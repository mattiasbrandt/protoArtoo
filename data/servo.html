<!doctype html>
<html lang="en" data-scripts="/web_api.js,/status_stream.js,/live_reading.js,/health_signals.js,/shell.js,/droid_parts.js,/droid_part_kind.js,/outputs.js,/parts_mapping.js,/apply_timing.js,/output_settings.js,/servo.js,/footer.js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servos - protoArtoo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/r2d2body-favicon.png">
    <!-- Thin delegate. This file is the one copy of this surface's markup and
         the Operator Shell fetches it; fetching never runs scripts, so this
         line is inert for the shell. A browser that lands here directly -- a
         bookmark, an old link, a support conversation -- is handed to the shell
         at this surface's route instead, so the address keeps opening what it
         names (ADR 0048). -->
    <script>window.PAShellDelegate = true; location.replace("/#servo");</script>
  </head>
  <body data-page="servo">

    <!-- The title is the name in the nav (ADR 0066). The acts are all on the
         rows they act on, so the title carries none. -->
    <div class="title">
      <div>
        <h1>Servos</h1>
      </div>
    </div>

    <!-- Which servo each Output carries (operator, 2026-09-18 on #369): drawn
         by data/output_settings.js, the same answer Wiring's wired ticks are
         part of, so the two cannot disagree. -->
    <div class="card">
      <div class="sect"><h2>Servo assignment</h2></div>
      <div id="servo-types-body"></div>
      <div id="servo-types-feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <!-- The Outputs, one row each, named by what the board prints beside the
         pin and by the Part(s) on it: the output-first side of the mapping
         Parts reads from the part's end (CONTEXT.md "Servos"). Driving an
         Output, calibrating it, Find by Moving and back to centre are all here
         (operator, 2026-09-19 on #412). The rows, the run and the dial are
         drawn by data/servo.js from the firmware's answer; this page names no
         Output of its own. -->
    <div class="card" id="outputs-card">
      <div class="sect"><h2>Outputs</h2><span class="sub outputs-tiers" id="outputs-tiers" role="status" aria-live="polite"></span></div>
      <!-- The one visible explanation at the controls that move something
           (ADR 0059), and rule 7 of the maker voice: both marks are what the
           controller told the servo, never where it is. -->
      <p class="hint">The bar is where it was told to go, the tick where the move ends. Nothing reads a servo back.</p>
      <div class="outputs-bulk">
        <button class="btn outputs-centre" type="button" aria-label="Put every output back to the centre recorded for it" disabled aria-disabled="true">back to centre</button>
        <p class="feedback" role="status" aria-live="polite">Each output goes to its own centre, one at a time, so the servos do not brown out.</p>
      </div>
      <div class="outputs-find" id="outputs-find">
        <select class="parts-output outputs-find-part" id="outputs-find-part" aria-label="The part to find the output of" disabled>
        </select>
        <button class="btn btn-sm parts-find" type="button" aria-label="Find the output that moves this part by nudging each spare output" disabled aria-disabled="true">find by moving</button>
      </div>
      <div class="parts-table-wrap" id="outputs-table"></div>
      <!-- The calibration dial opens here, under the rows, for one Output at a time. -->
      <div id="outputs-dial"></div>
      <p class="feedback" id="outputs-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>

    <dialog class="parts-move-dialog" id="outputs-move-dialog" role="alertdialog" aria-labelledby="outputs-move-title" aria-describedby="outputs-move-body">
      <h4 class="move-title" id="outputs-move-title"></h4>
      <p class="move-body" id="outputs-move-body"></p>
      <div class="button-row">
        <button class="btn move-cancel" type="button">Cancel</button>
        <button class="btn accent move-confirm" type="button">Move it</button>
      </div>
    </dialog>

    <!-- No bootstrap <script src> here on purpose: the inline kernel in <head>
         fetches /page_bootstrap.js itself, with retry, and hands it the script
         chain from <html data-scripts>. A bare tag has no retry, and the
         controller sheds connections in the opening burst by design. -->
  </body>
</html>
