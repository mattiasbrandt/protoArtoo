<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuration - protoArtoo</title>
    <link rel="stylesheet" href="/style.css">
    <!-- A forwarder, not a surface. This address was the page a droid was
         configured from until #404 split it into Configuration and Maintenance,
         and links to it were written all over - bookmarks, support
         conversations, every "switch it on in Setup" line. It keeps the address
         alive and nothing else: a direct visit is handed to the shell at
         /#setup, and `setup` is an alias on Configuration's SURFACES row
         (data/shell.js), the rename record, so it opens Configuration. Guided
         Setup is drawn over that surface while the droid is not set up.

         No SURFACES row names this file, so the shell never fetches it, and it
         carries no body and no script chain: there is nothing here to mount. -->
    <script>window.PAShellDelegate = true; location.replace("/#setup");</script>
  </head>
  <body></body>
</html>
