<!doctype html>
<!--
  test/test_rc_learn/index.html

  Standalone browser test for the RC channel detect mode pure logic.
  Open with a local HTTP server (or file://) — NOT served to device.

  Run:  python3 -m http.server 8080 --directory /path/to/protoArtoo
        then open http://localhost:8080/test/test_rc_learn/index.html

  Pass criteria: all rows show ✅.  Any ❌ is a bug in the implementation.

  Keep computeDetectHit() and the threshold constants in sync with rc.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RC Detect Channel — Tests</title>
  <style>
    body { font-family: monospace; padding: 24px; background: #111; color: #eee; }
    h2   { color: #6ab0ff; }
    .pass { color: #4caf50; }
    .fail { color: #f44336; font-weight: bold; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    td, th { padding: 6px 12px; border: 1px solid #333; text-align: left; }
    th { background: #222; }
    tr.pass-row td:first-child::before { content: "✅  "; }
    tr.fail-row td:first-child::before { content: "❌  "; }
    tr.fail-row { background: rgba(244,67,54,0.10); }
    #summary { margin-top: 16px; font-size: 1.1em; }
  </style>
</head>
<body>
<h2>RC Channel Detect Mode — Core Logic Tests</h2>
<p>Tests <code>computeDetectHit(baseline, curr)</code> extracted from rc.js.</p>
<table id="results">
  <thead><tr><th>Test</th><th>Expected</th><th>Got</th></tr></thead>
  <tbody></tbody>
</table>
<div id="summary"></div>

<script>
// ─── Pure logic under test ────────────────────────────────────────────────────
// Keep in sync with rc.js: computeDetectHit(), LEARN_SBUS_THRESHOLD,
// LEARN_PWM_THRESHOLD.

const LEARN_SBUS_THRESHOLD = 300;
const LEARN_PWM_THRESHOLD  = 200;

function computeDetectHit(baseline, curr) {
  if (!baseline || !curr) return null;
  const raw = curr.raw;
  if (!raw || typeof raw !== 'object') return null;
  const baseRaw = baseline.raw;
  if (!baseRaw || typeof baseRaw !== 'object') return null;

  let best = null;

  // SBUS sources — raw units 172-1811, center ~992
  ['sbus1', 'sbus2'].forEach(src => {
    const currArr = Array.isArray(raw[src])     ? raw[src]     : [];
    const baseArr = Array.isArray(baseRaw[src]) ? baseRaw[src] : [];
    currArr.forEach((val, idx) => {
      const base  = baseArr[idx] !== undefined ? baseArr[idx] : val;
      const delta = Math.abs(val - base);
      if (delta >= LEARN_SBUS_THRESHOLD) {
        if (!best || delta > best.delta) {
          best = { source: src, channel: idx + 1, raw: val, baseline: base, delta };
        }
      }
    });
  });

  // PWM — microseconds 1000-2000, center ~1500
  {
    const currArr = Array.isArray(raw.pwm)     ? raw.pwm     : [];
    const baseArr = Array.isArray(baseRaw.pwm) ? baseRaw.pwm : [];
    currArr.forEach((val, idx) => {
      if (val === 0) return;
      const base = baseArr[idx] !== undefined ? baseArr[idx] : val;
      if (base === 0) return;
      const delta = Math.abs(val - base);
      if (delta >= LEARN_PWM_THRESHOLD) {
        if (!best || delta > best.delta) {
          best = { source: 'pwm', channel: idx + 1, raw: val, baseline: base, delta };
        }
      }
    });
  }

  return best;
}

// ─── Test helpers ─────────────────────────────────────────────────────────────

const results = [];

function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

function assert(name, expected, got) {
  results.push({ name, expected, got, pass: eq(expected, got) });
}

function assertNull(name, got) {
  results.push({ name, expected: null, got, pass: got === null });
}

function assertNotNull(name, got) {
  results.push({ name, expected: '(not null)', got, pass: got !== null });
}

function assertField(name, got, field, expected) {
  const actual = got !== null ? got[field] : undefined;
  results.push({ name, expected: `${field}=${JSON.stringify(expected)}`, got: `${field}=${JSON.stringify(actual)}`, pass: eq(actual, expected) });
}

// Build a minimal SSE rc snapshot with raw section.
function makeSnap({ sbus1 = null, sbus2 = null, pwm = null } = {}) {
  const raw = {};
  if (sbus1) raw.sbus1 = sbus1;
  if (sbus2) raw.sbus2 = sbus2;
  if (pwm)   raw.pwm   = pwm;
  return { raw };
}

// Build a neutral SBUS array (16 channels, all at center 992)
function neutralSbus(override = {}) {
  const arr = Array(16).fill(992);
  Object.entries(override).forEach(([ch, val]) => { arr[Number(ch) - 1] = val; });
  return arr;
}

// Build a neutral PWM array (6 channels, all at center 1500)
function neutralPwm(override = {}) {
  const arr = Array(6).fill(1500);
  Object.entries(override).forEach(([ch, val]) => { arr[Number(ch) - 1] = val; });
  return arr;
}

// ─── Tests ────────────────────────────────────────────────────────────────────

// 1. null baseline → null
assertNull('null baseline → null',
  computeDetectHit(null, makeSnap({ sbus1: neutralSbus() })));

// 2. null curr → null
assertNull('null curr → null',
  computeDetectHit(makeSnap({ sbus1: neutralSbus() }), null));

// 3. Both snapshots identical (no movement) → null
{
  const s = makeSnap({ sbus1: neutralSbus() });
  assertNull('identical snapshots → null', computeDetectHit(s, s));
}

// 4. SBUS1 CH5 moved to 1811 (button press, delta 819 >> threshold 300) → detected
{
  const base = makeSnap({ sbus1: neutralSbus() });
  const curr = makeSnap({ sbus1: neutralSbus({ 5: 1811 }) });
  const hit  = computeDetectHit(base, curr);
  assertField('SBUS1 CH5 button press → source=sbus1', hit, 'source', 'sbus1');
  assertField('SBUS1 CH5 button press → channel=5',    hit, 'channel', 5);
  assertField('SBUS1 CH5 button press → raw=1811',     hit, 'raw', 1811);
}

// 5. Movement exactly at threshold (300) → detected
{
  const base = makeSnap({ sbus1: neutralSbus() });
  const curr = makeSnap({ sbus1: neutralSbus({ 3: 992 + 300 }) });
  const hit  = computeDetectHit(base, curr);
  assertField('delta=300 exactly → detected', hit, 'channel', 3);
}

// 6. Movement 1 unit below threshold (299) → null
{
  const base = makeSnap({ sbus1: neutralSbus() });
  const curr = makeSnap({ sbus1: neutralSbus({ 3: 992 + 299 }) });
  assertNull('delta=299 < threshold → null', computeDetectHit(base, curr));
}

// 7. Negative direction (button to low end, delta also large) → detected
{
  const base = makeSnap({ sbus1: neutralSbus() });
  const curr = makeSnap({ sbus1: neutralSbus({ 2: 172 }) });  // 992-172=820
  const hit  = computeDetectHit(base, curr);
  assertField('SBUS1 CH2 low-end press → detected', hit, 'channel', 2);
}

// 8. Two channels active → highest delta wins
{
  const base = makeSnap({ sbus1: neutralSbus() });
  const curr = makeSnap({ sbus1: neutralSbus({ 1: 992 + 350, 4: 1811 }) }); // CH1 delta=350, CH4 delta=819
  const hit  = computeDetectHit(base, curr);
  assertField('two channels → highest delta wins (CH4)', hit, 'channel', 4);
}

// 9. SBUS2 detection works
{
  const base = makeSnap({ sbus2: neutralSbus() });
  const curr = makeSnap({ sbus2: neutralSbus({ 7: 1811 }) });
  const hit  = computeDetectHit(base, curr);
  assertField('SBUS2 CH7 → source=sbus2', hit, 'source', 'sbus2');
  assertField('SBUS2 CH7 → channel=7',    hit, 'channel', 7);
}

// 10. SBUS1 vs SBUS2: highest delta across both sources wins
{
  const base = makeSnap({ sbus1: neutralSbus(), sbus2: neutralSbus() });
  const curr = makeSnap({
    sbus1: neutralSbus({ 2: 992 + 400 }),   // delta 400
    sbus2: neutralSbus({ 3: 172 }),          // delta 820 ← should win
  });
  const hit = computeDetectHit(base, curr);
  assertField('SBUS1 vs SBUS2: highest wins → sbus2', hit, 'source', 'sbus2');
  assertField('SBUS1 vs SBUS2: highest wins → CH3',   hit, 'channel', 3);
}

// 11. PWM CH2 button press (1500→2000, delta=500 >> 200 threshold) → detected
{
  const base = makeSnap({ pwm: neutralPwm() });
  const curr = makeSnap({ pwm: neutralPwm({ 2: 2000 }) });
  const hit  = computeDetectHit(base, curr);
  assertField('PWM CH2 press → source=pwm', hit, 'source', 'pwm');
  assertField('PWM CH2 press → channel=2',  hit, 'channel', 2);
}

// 12. PWM threshold: delta=200 exactly → detected
{
  const base = makeSnap({ pwm: neutralPwm() });
  const curr = makeSnap({ pwm: neutralPwm({ 1: 1700 }) });  // delta=200
  const hit  = computeDetectHit(base, curr);
  assertField('PWM delta=200 → detected', hit, 'source', 'pwm');
}

// 13. PWM threshold: delta=199 → null
{
  const base = makeSnap({ pwm: neutralPwm() });
  const curr = makeSnap({ pwm: neutralPwm({ 1: 1699 }) });  // delta=199
  assertNull('PWM delta=199 < threshold → null', computeDetectHit(base, curr));
}

// 14. PWM channel with val=0 (no pulse) → skipped
{
  const base = makeSnap({ pwm: neutralPwm() });
  const curr = makeSnap({ pwm: [0, 2000, 1500, 1500, 1500, 1500] }); // CH1=0 (invalid)
  const hit  = computeDetectHit(base, curr);
  // CH1 is val=0 (skipped). CH2 delta=2000-1500=500 → detected.
  assertField('PWM val=0 skipped, CH2 detected', hit, 'channel', 2);
}

// 15. PWM baseline val=0 (no pulse at baseline) → skipped
{
  const base = makeSnap({ pwm: [0, 1500, 1500, 1500, 1500, 1500] }); // CH1 baseline=0
  const curr = makeSnap({ pwm: [2000, 1500, 1500, 1500, 1500, 1500] }); // CH1 now 2000
  // CH1: base=0, skipped per rule. No other channel moves. → null
  assertNull('PWM base=0 → channel skipped → null', computeDetectHit(base, curr));
}

// 16. SBUS + PWM active simultaneously → highest delta across all sources wins
{
  const base = makeSnap({ sbus1: neutralSbus(), pwm: neutralPwm() });
  const curr = makeSnap({
    sbus1: neutralSbus({ 1: 992 + 400 }),  // SBUS delta 400
    pwm:   neutralPwm({ 3: 2000 }),         // PWM delta 500 ← wins
  });
  const hit = computeDetectHit(base, curr);
  assertField('SBUS vs PWM: highest wins → pwm', hit, 'source', 'pwm');
}

// 17. raw section missing from curr → null
{
  const base = makeSnap({ sbus1: neutralSbus() });
  const curr = { channels: [], digital: {} };  // no raw key
  assertNull('missing raw in curr → null', computeDetectHit(base, curr));
}

// 18. raw section missing from baseline → null
{
  const base = { channels: [], digital: {} };  // no raw key
  const curr = makeSnap({ sbus1: neutralSbus({ 5: 1811 }) });
  assertNull('missing raw in baseline → null', computeDetectHit(base, curr));
}

// 19. Channel present in curr but not in baseline → deviation 0 (uses val as own baseline)
{
  // Only curr has sbus1 data; baseline has no sbus1 key.
  const base = makeSnap({});  // raw = {}
  const curr = makeSnap({ sbus1: neutralSbus({ 5: 1811 }) });
  // baseArr[4] = undefined → base = val (1811) → delta = 0 → not detected
  assertNull('channel not in baseline → deviation=0 → null', computeDetectHit(base, curr));
}

// 20. All channels at neutral, no movement → null
{
  const base = makeSnap({ sbus1: neutralSbus(), sbus2: neutralSbus(), pwm: neutralPwm() });
  const curr = makeSnap({ sbus1: neutralSbus(), sbus2: neutralSbus(), pwm: neutralPwm() });
  assertNull('all neutral → null', computeDetectHit(base, curr));
}

// 21. delta field on hit matches the actual deviation
{
  const base = makeSnap({ sbus1: neutralSbus() });
  const curr = makeSnap({ sbus1: neutralSbus({ 6: 1811 }) });
  const hit  = computeDetectHit(base, curr);
  assertField('delta on hit = 1811-992 = 819', hit, 'delta', 819);
}

// 22. baseline field on hit = baseline value used
{
  const base = makeSnap({ sbus1: neutralSbus() });
  const curr = makeSnap({ sbus1: neutralSbus({ 1: 1811 }) });
  const hit  = computeDetectHit(base, curr);
  assertField('baseline field = 992', hit, 'baseline', 992);
}

// ─── Render ───────────────────────────────────────────────────────────────────

const tbody = document.querySelector('#results tbody');
let passed = 0, failed = 0;
results.forEach(r => {
  const tr = document.createElement('tr');
  tr.className = r.pass ? 'pass-row' : 'fail-row';
  tr.innerHTML = `<td>${r.name}</td><td>${r.expected}</td><td>${JSON.stringify(r.got)}</td>`;
  tbody.appendChild(tr);
  r.pass ? passed++ : failed++;
});

document.getElementById('summary').innerHTML = failed === 0
  ? `<span class="pass">✅ All ${passed} tests passed.</span>`
  : `<span class="fail">❌ ${failed} FAILED, ${passed} passed.</span>`;

if (failed > 0) console.error('FAILED:', results.filter(r => !r.pass).map(r => r.name));
</script>
</body>
</html>
