; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =============================================================================
; [flags_base] — single source of truth for all common build flags.
;
; PA_AUDIO_DRIVER is intentionally absent. It must be set per-env so the
; CHIRP compile-check env can use AUDIO_CHIRP without triggering a macro
; redefinition error (GCC -Werror fires when the same macro is defined twice).
;
; build_flags   — applies to ALL compiled code (project, libraries, framework).
;                 Do NOT add -Wall/-Wextra/-Werror here; upstream framework code
;                 (e.g. WiFi.cpp in IDF 5.x) has struct initializer warnings
;                 that are not our responsibility to fix.
; build_src_flags — applies ONLY to src/ (project code). -Werror here catches
;                 our own mistakes without blocking on framework issues.
; =============================================================================
[flags_base]
build_flags =
	-Os
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-DPA_ENABLE_AUDIO=1
	-DPA_ENABLE_ARMS=1
	-DPA_ENABLE_DOME_MOTOR=1
	-DPA_ENABLE_DOME_SBUS=1
	-DPA_DROID_NAME="\"R2-D2\""
	-DPA_LOG_LEVEL=1
	-DARDUINO_LOOP_STACK_SIZE=6144
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
	-D SSE_MAX_QUEUED_MESSAGES=4
	-D SSE_MAX_INFLIGH=4096
	; Listen backlog for the async web server (patched overridable by
	; tools/patch_async_sse.py; library default is 5). Deliberately SMALL:
	; lwIP silently drops SYNs beyond the backlog and the client kernel
	; retries ~1 s later, so the backlog paces a simultaneous connection
	; burst into waves of at most this many concurrent accepts. Each accept
	; costs ~4 KB of transient heap, and waves deeper than ~5 dip the largest
	; free block under the accept guard threshold below, turning graceful
	; retry pacing into connection resets. Raising this made bursts WORSE
	; (verified live: backlog 16 = 89/90 resets on a 30-connection burst).
	-D ASYNC_TCP_LISTEN_BACKLOG=5
	; Accept admission control (tools/patch_async_sse.py, AsyncTCP tcp_accept)
	; is two-layered; both rejections abort the connection with a TCP RST and
	; count into g_asyncTcpAcceptReject* (surfaced in /api/status).
	;
	; Layer 1 — token-bucket pacing: at most BURST accepts at once, refilled
	; at PER_SECOND. Bounds how much per-connection allocation pressure can
	; pile up regardless of heap state. Without it, a dense burst exhausted
	; the heap mid-response: a 40-byte std::list node alloc inside
	; AsyncWebServerResponse::addHeader() aborted the firmware
	; (coredump-proven); that STL throw path cannot be patched non-throwing.
	-D ASYNC_TCP_ACCEPT_BURST=6
	-D ASYNC_TCP_ACCEPT_PER_SECOND=8
	; Layer 2 — heap floors, calibrated to MEASURED reality (heapLargest8bit
	; in /api/status; the historical heapLargestBlock field reads
	; MALLOC_CAP_INTERNAL, dominated by ~36 KB of leftover IRAM that malloc
	; can never use, and misled all earlier calibration). Two measured
	; operating points matter:
	;  - fresh boot: largest 8-bit block rests at ~20.5 KB
	;  - warmed (after any heavy connection churn): settles at ~12.3 KB and
	;    NEVER recovers higher — ~7 KB is one-time warm-up retention
	;    (bounded: a third 677-connection churn round retained zero more).
	;  - warmed AND serving a page load: per-connection transients dip the
	;    largest block to ~9.7-11.3 KB (measured via the rejection log lines
	;    themselves during live dashboard loads).
	; Floors must sit below the warm-under-load level or ordinary page loads
	; shed their own assets chronically (floors at 11500 did exactly that).
	; Crash prevention rests on the accept pacing above and the in-flight
	; request cap in web_server.cpp, both burst-proven, plus the nothrow
	; response patches; the floors are only the final backstop above the
	; level where response construction was actually observed to abort.
	-D ASYNC_TCP_ACCEPT_MIN_LARGEST_FREE_BLOCK=8500
	-D PA_ADMISSION_MIN_LARGEST_FREE_BLOCK=9000
	-D ASYNC_STATIC_MIN_LARGEST_FREE_BLOCK=9000
	-D PA_ADMISSION_MIN_LARGEST_FREE_BLOCK_DIAG=7500
	;
	; The same two layers on the esp_http_server stack, which has no AsyncTCP
	; to patch. Values are deliberately identical to the ASYNC_TCP_ACCEPT_*
	; set above and share its calibration rationale; the ASYNC_TCP_* names
	; disappear with tools/patch_async_sse.py at the cutover, and these are
	; what the project-owned guard reads (include/web_admission.h). Changing
	; one without the other would make a comparison run measure two policies.
	-D PA_ACCEPT_BURST=6
	-D PA_ACCEPT_PER_SECOND=8
	-D PA_ACCEPT_MIN_LARGEST_FREE_BLOCK=8500
	; heap_caps_get_largest_free_block() walks the heap, and on esp_http_server
	; the socket-open callback runs on the single task that also services every
	; other connection. Caching the sample for this interval turns a
	; per-connection walk into a bounded rate: at most 10 walks/s, and only
	; while connections are actually arriving. Staleness within the window is
	; bounded by the accept pacing above.
	-D PA_ACCEPT_HEAP_SAMPLE_MIN_INTERVAL_MS=100
	; How long one /api/events client may take to accept one whole event
	; before the broadcaster drops its socket (include/web_event_stream.h).
	; Sized against what it has to separate:
	;  - a healthy client on the same LAN accepts a 3 KB rc event in a single
	;    non-blocking send, so the normal cost of this guard is zero waits.
	;  - a stalled client (receive window full, tools/webload_sse_stall.py)
	;    never accepts anything again, so any value at all evicts it -- the
	;    question is only how much of the 1 Hz broadcast tick a bad client is
	;    allowed to consume before it does.
	; 250 ms leaves three simultaneously-stalled clients (the cap) costing at
	; most 750 ms of one tick, once, since eviction removes them. Much shorter
	; would start dropping merely-slow clients over a congested link; much
	; longer and a single tick could be swallowed whole.
	-D PA_SSE_SEND_DEADLINE_MS=250
build_src_flags =
	-Wall
	-Wextra
	-Werror

; =============================================================================
; Primary development target — USB flash or OTA via
; protoArtoo_ota. Add new feature flags here; they propagate to all envs
; via ${flags_base.build_flags} interpolation.
; =============================================================================
[env:protoArtoo]
; pioarduino is the maintained community platform that ships arduino-esp32 v3.x.
; Official espressif32 platform only delivers v2.x (latest 6.13.0 = v2.0.17).
; 55.03.37 = IDF 5.5.2 + arduino-esp32 3.3.7, released 2026-02-12.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 115200
board_upload.before_reset = default-reset
board_upload.after_reset = hard-reset
board_build.partitions = partitions/partitions_ota.csv
board_build.filesystem = littlefs
; custom_sdkconfig — pioarduino rebuilds the Arduino core libs (incl. lwIP)
; with these overrides. The first build after a change is slow (full framework
; lib recompile) and stamps a generated sdkconfig.defaults in the project root.
;
; Rationale: ESPAsyncWebServer adds Connection:close to every response
; unconditionally (WebResponses.cpp), so keep-alive is impossible and every
; dashboard request is a fresh TCP connection. Each closed connection keeps
; heap allocated (pcb + segment buffers) while it drains through FIN_WAIT/
; TIME_WAIT, and with the stock timers (60 s MSL, 20 s FIN_WAIT2) that churn
; residue held the largest free heap block depressed for tens of seconds —
; long enough to keep the accept-time heap guard (see the heap-guard gradient
; under [flags_base]) rejecting new connections. LAN-appropriate short timers
; recycle closed connections in seconds instead, verified live: post-burst
; recovery went from 20+ s to under 2 s. MAX_ACTIVE_TCP is inert headroom:
; with the ESP-IDF port's MEMP_MEM_MALLOC=1 the pcb pool is malloc-backed and
; the quota does not gate allocation (verified in esp-lwip source); it is
; kept raised so a future pooled configuration never undersizes it.
;
; SO_LINGER is off by default in ESP-IDF's lwIP, which leaves no way to abandon
; a connection abruptly -- close() is always graceful. That is the same failure
; mode as the paragraph above, one layer further in: an /api/events client that
; stops reading fills its 5744-byte send queue (CONFIG_LWIP_TCP_SND_BUF_DEFAULT),
; and the eviction in include/web_event_stream.h closes the socket, but lwIP
; keeps the pcb and that whole queue alive while it retransmits into a peer that
; will never answer. Measured live: the largest free block stayed depressed for
; 71 s after eviction, and with one other stream also open it sat under the
; 8500-byte accept floor for that entire time -- every new connection refused,
; including the /api/status that would have explained it.
; With SO_LINGER available, eviction sets linger{on,0} so the close is an RST:
; the queue is freed at once and the block recovers immediately.
custom_sdkconfig =
	CONFIG_LWIP_MAX_ACTIVE_TCP=40
	CONFIG_LWIP_TCP_MSL=5000
	CONFIG_LWIP_TCP_FIN_WAIT_TIMEOUT=5000
	CONFIG_LWIP_SO_LINGER=y
; Bundled Arduino-core components this firmware does not use. The
; custom_sdkconfig rebuild compiles the core from source, and the
; Rainmaker/Insights components fail that build with missing embedded
; cert files (pioarduino platform-espressif32 issues 19/261 — maintainer
; recommends removing them). Removal also shrinks the rebuild.
custom_component_remove =
	espressif/esp_hosted
	espressif/esp_wifi_remote
	espressif/esp-dsp
	espressif/esp32-camera
	espressif/libsodium
	espressif/esp-modbus
	espressif/qrcode
	espressif/esp_insights
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/esp_rainmaker
	espressif/rmaker_common
extra_scripts =
	pre:tools/patch_async_sse.py
	pre:tools/extract_version.py
	pre:tools/gzip_fsdata.py
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
build_src_flags =
	${flags_base.build_src_flags}
lib_deps =
	; 3.11.1+ carries the multipart-boundary DoS fix (GHSA-4phx-fcj6-46r4)
	; and 3.11.x reworked the SSE client handover (clientRelease ownership
	; transfer) that raced against disconnects in 3.10.3 (coredump-proven
	; NULL-client panic). Build-time hardening in tools/patch_async_sse.py
	; is anchored to these exact versions and fails the build on drift.
	ESP32Async/ESPAsyncWebServer @ 3.11.2
	ESP32Async/AsyncTCP @ 3.4.10
	bblanchon/ArduinoJson @ 7.4.3
	adafruit/Adafruit NeoPixel @ 1.15.1
; lib_ldf_mode = chain (default) — do NOT use chain+ or deep+ with arduino-esp32 v3.x.
; The + modes enable preprocessor evaluation during dependency scanning. WiFiGeneric.h
; guards #include "Network.h" behind #if SOC_WIFI_SUPPORTED, which is not defined at
; scan time, so the scanner skips it and Network/src never enters the include path.
; Default 'chain' ignores conditional guards and finds all #include statements.
; See: https://github.com/espressif/arduino-esp32/issues/9782
lib_ldf_mode = chain
test_build_src = true
test_ignore = test_native*
check_tool = cppcheck
; Suppression rationale: cppcheck mis-parses ArduinoJson token-paste macros in
; third-party headers and reports false high preprocessorErrorDirective findings.
; Keep scope narrow to dependency headers only; project code remains fully checked.
check_skip_packages = yes
check_flags =
	cppcheck: --enable=all --suppress=missingIncludeSystem
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/Polyfills/preprocessor.hpp
check_severity = high, medium

[env:protoArtoo_ota]
extends = env:protoArtoo
upload_protocol = espota
upload_port = artoo.local

; Heap profiling build — USB flash.
; PA_HEAP_PROFILE=1 enables /api/profiler endpoint and profiler UI in setup.html.
; All profiling instrumentation has zero overhead in normal builds.
;
; Escalation (Tier 2 per-task attribution, ~20-30% heap overhead):
;   add CONFIG_HEAP_TASK_TRACKING=y to a custom_sdkconfig option in THIS env
;   (extends the base list; pioarduino rebuilds the core libs with it, first
;   build is slow). Use only for focused sessions — not routine testing.
;
; Escalation (Tier 3 standalone leak trace):
;   1. Add CONFIG_HEAP_TRACING=y and CONFIG_HEAP_TRACING_STANDALONE=y the same way.
;   2. POST /api/profiler/trace/start to arm, POST /api/profiler/trace/stop to dump to serial.
;   Buffer: 200 records (s_traceRecords in api_profiler.cpp). Increase if truncating.
[env:protoArtoo_profiler]
extends = env:protoArtoo
build_unflags =
	-DPA_LOG_LEVEL=1
build_flags =
	${flags_base.build_flags}
	-DPA_LOG_LEVEL=2
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
	-DPA_HEAP_PROFILE=1
build_src_flags =
	${flags_base.build_src_flags}

[env:protoArtoo_profiler_ota]
extends = env:protoArtoo_profiler
upload_protocol = espota
upload_port = artoo.local

; Production/field deployment — AP-only WiFi; no STA client.
; Saves ~10-15 KB heap vs AP+STA.
; Default OTA via AP: pio run -e protoArtoo_prod -t upload --upload-port 192.168.4.1
; While STA is still active: pio run -e protoArtoo_prod -t upload --upload-port artoo.local
[env:protoArtoo_prod]
extends = env:protoArtoo
upload_protocol = espota
upload_port = 192.168.4.1
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
	-DPA_ENABLE_STA_WIFI=0
build_src_flags =
	${flags_base.build_src_flags}


; Compile-check for AUDIO_CHIRP backend — not flashed, compile-only CI verification.
; Switch PA_AUDIO_DRIVER in protoArtoo env to AUDIO_CHIRP to use on hardware.
[env:protoArtoo_chirp_check]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
build_src_flags =
	${flags_base.build_src_flags}

; Compile-check for AUDIO_MP3TRIGGER backend — not flashed, compile-only CI verification.
; Switch PA_AUDIO_DRIVER in protoArtoo env to AUDIO_MP3TRIGGER to use on hardware.
[env:protoArtoo_mp3trigger_check]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_MP3TRIGGER
build_src_flags =
	${flags_base.build_src_flags}

; Compile-check for PsychicHttp compatibility on pinned stack.
; Issue #70: Verify PsychicHttp 3.1.2 compiles cleanly on pioarduino 55.03.37.
; Not flashed; ESPAsyncWebServer/AsyncTCP remain; this is an ADDITIVE probe.
; Uses AUDIO_CHIRP to match board's actual configuration, preventing NVS mismatch
; if accidentally uploaded (though this env is never meant to be flashed).
[env:protoArtoo_psychichttp_check]
extends = env:protoArtoo_chirp
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
	-DPA_PROBE_PSYCHICHTTP
build_src_flags =
	${flags_base.build_src_flags}
lib_deps =
	${env:protoArtoo.lib_deps}
	hoeken/PsychicHttp @ 3.1.2

; PsychicHttp prototype target for issue #72.
; Extends protoArtoo_chirp (same CHIRP audio driver) but replaces HTTP server
; with PsychicHttp. Not production-ready; used to measure page-load behavior
; and answer SSE queue-bound questions before #73's full workload run.
[env:protoArtoo_psychichttp_prototype]
extends = env:protoArtoo_chirp
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
	-DPA_USE_PSYCHICHTTP_PROTOTYPE=1
build_src_flags =
	${flags_base.build_src_flags}
lib_deps =
	${env:protoArtoo.lib_deps}
	hoeken/PsychicHttp @ 3.1.2

; OTA sibling for the prototype env above, matching the *_ota convention
; every other flashable env uses. Needed by tools/webload_baseline_run.py's
; --build-env (issue #73), which appends "_ota" to whatever env it's given.
[env:protoArtoo_psychichttp_prototype_ota]
extends = env:protoArtoo_psychichttp_prototype
upload_protocol = espota
upload_port = artoo.local

; PsychicHttp backend of the ADR 0021 WebRequest seam (issue #78 onward).
; Temporary dual-backend scaffold: serves only the route groups already ported
; to the seam (plus static files); the async backend remains the default in
; every other env until the #91 cutover deletes it. Extends protoArtoo_chirp
; to match the board's actual flashed audio driver.
[env:protoArtoo_psychic]
extends = env:protoArtoo_chirp
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
	-DPA_WEB_BACKEND_PSYCHIC=1
build_src_flags =
	${flags_base.build_src_flags}
lib_deps =
	${env:protoArtoo.lib_deps}
	hoeken/PsychicHttp @ 3.1.2

[env:protoArtoo_psychic_ota]
extends = env:protoArtoo_psychic
upload_protocol = espota
upload_port = artoo.local

; Flashable CHIRP build target. For hardware use with a CHIRP audio module.
; The _chirp_check env above is retained for compile-only CI verification.
[env:protoArtoo_chirp]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
build_src_flags =
	${flags_base.build_src_flags}

[env:protoArtoo_chirp_ota]
extends = env:protoArtoo_chirp
upload_protocol = espota
upload_port = artoo.local

; Flashable MP3 Trigger build target. For hardware use with a SparkFun MP3 Trigger.
; The _mp3trigger_check env above is retained for compile-only CI verification.
[env:protoArtoo_mp3trigger]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_MP3TRIGGER
build_src_flags =
	${flags_base.build_src_flags}

[env:protoArtoo_mp3trigger_ota]
extends = env:protoArtoo_mp3trigger
upload_protocol = espota
upload_port = artoo.local

; Flashable DY-SV5W build target. For hardware use with a DY-SV5W audio module.
; AUDIO_SOFT_UART is also env:protoArtoo's own default driver, but this env
; gives DY-SV5W the same explicit, named, releasable target as CHIRP and
; MP3 Trigger instead of relying on that implicit base-env default.
[env:protoArtoo_dysv5w]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
build_src_flags =
	${flags_base.build_src_flags}

[env:protoArtoo_dysv5w_ota]
extends = env:protoArtoo_dysv5w
upload_protocol = espota
upload_port = artoo.local


[env:native]
platform = native
test_filter = test_native/*
; Native cppcheck scans src/tasks/audio_task.cpp even though native unit tests
; don't build that task. Define PA_AUDIO_DRIVER here so the compile-time driver
; selection block does not intentionally hit its #error branch during analysis.
build_flags = -std=c++17 -Wall -Wextra -I test/stubs/include -DPA_NATIVE_TEST_STUBS=1 -DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
test_build_src = true
build_src_filter = -<*> +<dome_link_arbiter.cpp> +<drive_arbiter.cpp> +<drivers/hoverboard_uart.cpp> +<failsafe_gate.cpp> +<web/web_admission.cpp> +<web/web_event_stream.cpp> +<web/api_events.cpp> +<web/api_helpers.cpp> +<web/api_identity.cpp> +<web/api_actions_json.cpp> +<web/api_logs.cpp> +<web/action_registry.cpp> +<log_buffer.cpp> +<tasks/audio_dollar_parser.cpp> +<tasks/audio_playback_policy.cpp> +<tasks/audio_task_step.cpp> +<tasks/audio_config_map.cpp> +<web/api_estop.cpp> +<web/api_servo.cpp> +<web/api_dome.cpp> +<web/api_aux_led.cpp> +<web/api_drive.cpp> +<web/api_config.cpp> +<web/web_param_source.cpp> +<web/api_config_apply.cpp> +<web/api_rc_map_apply.cpp> +<web/api_wifi_apply.cpp> +<web/api_audio_mood_map_apply.cpp> +<web/api_audio_category_range_apply.cpp> +<web/api_audio_tracks_apply.cpp> +<web/rc_diagnostics_snapshot.cpp> +<web/validation_snapshot.cpp> +<rc_channel_mapper.cpp> +<native_test_stubs.cpp> +<config_store.cpp> +<config_serializer.cpp> +<config_nvsio.cpp> +<rc_action_dispatcher.cpp> +<rc_input_processor.cpp> +<drivers/audio_dy_sv5w.cpp> +<drivers/audio_chirp.cpp> +<drivers/audio_mp3trigger.cpp> +<tasks/sequence_dispatcher.cpp> +<tasks/sequence_engine.cpp> +<tasks/sequence_catalog.cpp> +<sequence_run_evidence.cpp> +<seq_last_run_json.cpp> +<protocol_check.cpp> +<seq_json.cpp> +<seq_store_index.cpp> +<seq_store_util.cpp> +<seq_dangling_bindings.cpp> +<wifi_boot_decision.cpp> +<wifi_recovery_gesture.cpp>
lib_deps = bblanchon/ArduinoJson @ 7.4.3
; Same ArduinoJson parser false-positive suppression for native dependency path.
; Scope is limited to the vendor header to avoid masking real project defects.
check_skip_packages = yes
check_flags =
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/src/ArduinoJson/Polyfills/preprocessor.hpp
