[env:protoArtoo]
platform = espressif32@5.2.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv

build_flags =
    -Os
    -Wall
    -Wextra
    -Werror
    -DESP32_ARDUINO_NO_RGB_BUILTIN
    -DPA_ENABLE_AUDIO=1
    -DPA_ENABLE_ARMS=1
    -DPA_ENABLE_DOME_MOTOR=1
    -DPA_ENABLE_DOME_SBUS=1
    -DPA_AUDIO_DRIVER=AUDIO_DY_SV5W
    -DPA_DROID_NAME="\"R2-D2\""

lib_deps =
    me-no-dev/ESPAsyncWebServer @ 3.6.0
    me-no-dev/AsyncTCP @ 3.3.2
    bblanchon/ArduinoJson
    madhephaestus/ESP32Servo

; deep+ LDF mode: ensures built-in framework library include paths (e.g.
; WiFi/src) are visible when ESPAsyncWebServer examples transitively pull in
; the built-in WebServer library (which includes WiFiServer.h).
lib_ldf_mode = deep+

test_build_src = true
test_ignore = test_native*

check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --suppress=missingIncludeSystem
check_severity = high, medium

[env:native]
platform = native
test_filter = test_native/*
build_flags = -std=c++17 -Wall -Wextra
test_build_src = true
build_src_filter = -<*> +<drivers/hoverboard_uart.cpp>
