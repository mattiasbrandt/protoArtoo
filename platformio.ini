; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =============================================================================
; [flags_base] — single source of truth for all common build flags.
;
; PA_AUDIO_DRIVER is intentionally absent. It must be set per-env so the
; CHIRP compile-check env can use AUDIO_CHIRP without triggering a macro
; redefinition error (GCC -Werror fires when the same macro is defined twice).
;
; build_flags   — applies to ALL compiled code (project, libraries, framework).
;                 Do NOT add -Wall/-Wextra/-Werror here; upstream framework code
;                 (e.g. WiFi.cpp in IDF 5.x) has struct initializer warnings
;                 that are not our responsibility to fix.
; build_src_flags — applies ONLY to src/ (project code). -Werror here catches
;                 our own mistakes without blocking on framework issues.
; =============================================================================
[flags_base]
build_flags =
	-Os
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-DPA_ENABLE_AUDIO=1
	-DPA_ENABLE_ARMS=1
	-DPA_ENABLE_DOME_MOTOR=1
	-DPA_ENABLE_DOME_SBUS=1
	-DPA_DROID_NAME="\"R2-D2\""
	-DPA_LOG_LEVEL=1
	-DARDUINO_LOOP_STACK_SIZE=6144
	; Static-file send size. PsychicFileResponse::send() branches on this: a
	; body smaller than FILE_CHUNK_SIZE is malloc'd whole and handed to a single
	; send, anything larger goes through the chunked loop. The library default
	; is 8 KB, so every asset this project ships took the single-send path --
	; and that path does not survive a body larger than the socket's send buffer
	; (CONFIG_LWIP_TCP_SND_BUF_DEFAULT, 5744). The response was silently
	; truncated: correct status line, correct Content-Length, short body, which
	; the browser reports as ERR_CONTENT_LENGTH_MISMATCH or
	; ERR_CONTENT_DECODING_FAILED on the gzipped copy.
	;
	; Measured on the controller before this flag: everything at or under
	; 5249 bytes served, everything at or above 6964 failed -- the wall sits
	; exactly where the send buffer is. That took out style.css, app.js, rc.js,
	; seq.js, setup.js, wifi.js and page_bootstrap.js, i.e. most of the UI.
	;
	; 2048 puts every asset above 2 KB on the chunked path, where each
	; individual write stays far below the send buffer. Verified after: all 9
	; probed assets serve intact and gunzip cleanly on two consecutive fetches,
	; including seq.js at 25947 bytes, which previously timed out outright.
	-D FILE_CHUNK_SIZE=2048
	; Request admission floors, read by the project-owned guard
	; (include/web_admission.h). Calibrated to MEASURED reality (heapLargest8bit
	; in /api/status; the historical heapLargestBlock field reads
	; MALLOC_CAP_INTERNAL, dominated by ~36 KB of leftover IRAM that malloc
	; can never use, and misled all earlier calibration). Three measured
	; operating points matter:
	;  - fresh boot: largest 8-bit block rests at ~20.5 KB
	;  - warmed (after any heavy connection churn): settles at ~12.3 KB and
	;    NEVER recovers higher — ~7 KB is one-time warm-up retention
	;    (bounded: a third 677-connection churn round retained zero more).
	;  - warmed AND serving a page load: per-connection transients dip the
	;    largest block to ~9.7-11.3 KB (measured via the rejection log lines
	;    themselves during live dashboard loads).
	; Floors must sit below the warm-under-load level or ordinary page loads
	; shed their own assets chronically (floors at 11500 did exactly that).
	; Crash prevention rests on the accept pacing below and the in-flight
	; request cap, both burst-proven; the floors are only the final backstop
	; above the level where response construction was actually observed to
	; abort.
	-D PA_ADMISSION_MIN_LARGEST_FREE_BLOCK=9000
	-D PA_ADMISSION_MIN_LARGEST_FREE_BLOCK_DIAG=7500
	;
	; Connection admission on esp_http_server (ADR 0022). Token-bucket pacing
	; plus a heap floor at socket-open, before any HTTP byte is parsed: at most
	; BURST accepts at once, refilled at PER_SECOND. Bounds how much
	; per-connection allocation pressure can pile up regardless of heap state.
	; Rejections abort the connection and count into g_webAcceptReject*
	; (surfaced in /api/status).
	-D PA_ACCEPT_BURST=6
	-D PA_ACCEPT_PER_SECOND=8
	-D PA_ACCEPT_MIN_LARGEST_FREE_BLOCK=8500
	; heap_caps_get_largest_free_block() walks the heap, and on esp_http_server
	; the socket-open callback runs on the single task that also services every
	; other connection. Caching the sample for this interval turns a
	; per-connection walk into a bounded rate: at most 10 walks/s, and only
	; while connections are actually arriving. Staleness within the window is
	; bounded by the accept pacing above.
	-D PA_ACCEPT_HEAP_SAMPLE_MIN_INTERVAL_MS=100
	; How long one /api/events client may take to accept one whole event
	; before the broadcaster drops its socket (include/web_event_stream.h).
	; Sized against what it has to separate:
	;  - a healthy client on the same LAN accepts a 3 KB rc event in a single
	;    non-blocking send, so the normal cost of this guard is zero waits.
	;  - a stalled client (receive window full, tools/webload_sse_stall.py)
	;    never accepts anything again, so any value at all evicts it -- the
	;    question is only how much of the 1 Hz broadcast tick a bad client is
	;    allowed to consume before it does.
	; 250 ms leaves three simultaneously-stalled clients (the cap) costing at
	; most 750 ms of one tick, once, since eviction removes them. Much shorter
	; would start dropping merely-slow clients over a congested link; much
	; longer and a single tick could be swallowed whole.
	-D PA_SSE_SEND_DEADLINE_MS=250
	; Admission decision trace (include/web_admission_trace.h), for re-deriving
	; the floors above. Records every Connection Admission and request admission
	; decision AFTER it has been taken -- the reading used, a fresh reading
	; taken straight after, and how old the used one was -- and serves the ring
	; at GET /api/admission/trace.
	;
	; On while the decision is open, because the floors currently in force were
	; calibrated against the async stack's page-load transient (see the heap
	; floors above) and nothing has re-derived them for this one.
	; Costs 544 bytes of static DRAM (measured: 123976 -> 124520 with this at 1)
	; and one heap walk per decision for the fresh reading;
	; PA_ADMISSION_TRACE_FRESH=0 keeps the profile and drops that second walk.
	;
	; That 544 bytes comes out of the same memory the heap is carved from, so
	; the trace makes the controller it measures very slightly worse -- roughly
	; 1% of resting free heap, and in the conservative direction. That is why
	; the ring is packed to eight bytes a row rather than sized for comfort:
	; dram0_0_seg has 596 bytes of headroom on this build, so a trace big enough
	; to be convenient would have described a controller nobody ships.
	;
	; Whatever replaces those floors has to be verified once with this at 0, or
	; the run verifies a build nobody ships.
	;
	; It lived in env:protoArtoo_psychic until the #91 cutover deleted that env;
	; it belongs here now that the base env is the one serving PsychicHttp.
	-D PA_ADMISSION_TRACE=0
	; How long one ordinary response may spend on the wire before its socket is
	; dropped (include/web_response_deadline.h, ADR 0020/0024). The request-side
	; counterpart to the stream deadline above, and sized the same way: against
	; what it has to separate, not against a round number.
	;
	; The clock starts at the first byte sent, so neither a slow body build nor
	; an upload's receive phase counts against it. What does count is transfer
	; time, and the largest thing this controller transfers is the firmware
	; image it never sends -- on the response side the biggest are the gzipped
	; index bundle and the ~9 KB action registry.
	;
	; PENDING CALIBRATION (#92): set from responseMaxMs measured across every
	; route on the device, with the margin stated. The value below is the
	; provisional one the calibration run itself is made under -- high enough
	; that it cannot plausibly fire on a legitimate response, which is the
	; property a measuring run needs. 0 disables the guard.
	-D PA_RESPONSE_DEADLINE_MS=8000
build_src_flags =
	-Wall
	-Wextra
	-Werror

; =============================================================================
; Primary development target — USB flash or OTA via
; protoArtoo_ota. Add new feature flags here; they propagate to all envs
; via ${flags_base.build_flags} interpolation.
; =============================================================================
[env:protoArtoo]
; pioarduino is the maintained community platform that ships arduino-esp32 v3.x.
; Official espressif32 platform only delivers v2.x (latest 6.13.0 = v2.0.17).
; 55.03.37 = IDF 5.5.2 + arduino-esp32 3.3.7, released 2026-02-12.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 115200
board_upload.before_reset = default-reset
board_upload.after_reset = hard-reset
board_build.partitions = partitions/partitions_ota.csv
board_build.filesystem = littlefs
; custom_sdkconfig — pioarduino rebuilds the Arduino core libs (incl. lwIP)
; with these overrides. The first build after a change is slow (full framework
; lib recompile) and stamps a generated sdkconfig.defaults in the project root.
;
; Rationale, MSL / FIN_WAIT_TIMEOUT: these were introduced for a stack that
; closed every response. ESPAsyncWebServer added Connection:close to all of
; them unconditionally (WebResponses.cpp), so every dashboard request was a
; fresh TCP connection; each closed one held heap (pcb + segment buffers) while
; it drained through FIN_WAIT/TIME_WAIT, and with the stock timers (60 s MSL,
; 20 s FIN_WAIT2) that residue kept the largest free block depressed long
; enough for the accept-time heap guard (see the heap-guard gradient under
; [flags_base]) to keep refusing connections. Short LAN-appropriate timers cut
; post-burst recovery from 20+ s to under 2 s.
;
; That churn no longer exists. esp_http_server keeps connections open: it emits
; no Connection header, PsychicHttp adds none, and its accept loop's select()
; has no timeout, so a session lives until the client closes it. Measured on the
; controller (issue #84): an ordinary page load takes 4 connections for 24
; requests and a refresh takes 1 connection for 25, where closing per response
; costs 25 connections for 25 requests. The close-per-response arm drove the
; largest free block down to 3188 bytes against 7412 for keep-alive -- churn is
; the pressure, so the setting that removes it is the one to keep. See
; docs/adr/0023-http-keep-alive-on-esp-http-server.md for the full comparison
; and for why max_open_sockets stays at 10.
;
; The timers are kept on a narrower justification than the one that introduced
; them: connections still close -- tabs, evicted streams, shed connections --
; and on a LAN there is no reason for a closed one to hold its buffers for a
; 60 s MSL. This is now hygiene, not a load-bearing mitigation.
;
; MAX_ACTIVE_TCP is inert headroom: with the ESP-IDF port's MEMP_MEM_MALLOC=1
; the pcb pool is malloc-backed and the quota does not gate allocation
; (verified in esp-lwip source); it is kept raised so a future pooled
; configuration never undersizes it.
;
; SO_LINGER is off by default in ESP-IDF's lwIP, which leaves no way to abandon
; a connection abruptly -- close() is always graceful. That is the same failure
; mode as the paragraph above, one layer further in: an /api/events client that
; stops reading fills its 5744-byte send queue (CONFIG_LWIP_TCP_SND_BUF_DEFAULT),
; and the eviction in include/web_event_stream.h closes the socket, but lwIP
; keeps the pcb and that whole queue alive while it retransmits into a peer that
; will never answer. Measured live: the largest free block stayed depressed for
; 71 s after eviction, and with one other stream also open it sat under the
; 8500-byte accept floor for that entire time -- every new connection refused,
; including the /api/status that would have explained it.
; With SO_LINGER available, eviction sets linger{on,0} so the close is an RST:
; the queue is freed at once and the block recovers immediately.
custom_sdkconfig =
	CONFIG_LWIP_MAX_ACTIVE_TCP=40
	CONFIG_LWIP_TCP_MSL=5000
	CONFIG_LWIP_TCP_FIN_WAIT_TIMEOUT=5000
	CONFIG_LWIP_SO_LINGER=y
; Bundled Arduino-core components this firmware does not use. The
; custom_sdkconfig rebuild compiles the core from source, and the
; Rainmaker/Insights components fail that build with missing embedded
; cert files (pioarduino platform-espressif32 issues 19/261 — maintainer
; recommends removing them). Removal also shrinks the rebuild.
custom_component_remove =
	espressif/esp_hosted
	espressif/esp_wifi_remote
	espressif/esp-dsp
	espressif/esp32-camera
	espressif/libsodium
	espressif/esp-modbus
	espressif/qrcode
	espressif/esp_insights
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/esp_rainmaker
	espressif/rmaker_common
extra_scripts =
	pre:tools/extract_version.py
	pre:tools/gzip_fsdata.py
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
build_src_flags =
	${flags_base.build_src_flags}
lib_deps =
	; PsychicHttp wraps ESP-IDF's own esp_http_server, which is what epic #75
	; migrated to: sess_ctx/free_ctx and httpd_sess_trigger_close() give the
	; SSE eviction path and the ADR 0020 response-phase deadline a safe
	; cross-task close, and keep-alive removes the per-response connection
	; churn the old stack forced (ADR 0023). No vendor source is patched.
	hoeken/PsychicHttp @ 3.1.2
	bblanchon/ArduinoJson @ 7.4.3
	adafruit/Adafruit NeoPixel @ 1.15.1
; lib_ldf_mode = chain (default) — do NOT use chain+ or deep+ with arduino-esp32 v3.x.
; The + modes enable preprocessor evaluation during dependency scanning. WiFiGeneric.h
; guards #include "Network.h" behind #if SOC_WIFI_SUPPORTED, which is not defined at
; scan time, so the scanner skips it and Network/src never enters the include path.
; Default 'chain' ignores conditional guards and finds all #include statements.
; See: https://github.com/espressif/arduino-esp32/issues/9782
lib_ldf_mode = chain
test_build_src = true
test_ignore = test_native*
check_tool = cppcheck
; Suppression rationale: cppcheck mis-parses ArduinoJson token-paste macros in
; third-party headers and reports false high preprocessorErrorDirective findings.
; Keep scope narrow to dependency headers only; project code remains fully checked.
check_skip_packages = yes
check_flags =
	cppcheck: --enable=all --suppress=missingIncludeSystem
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/Polyfills/preprocessor.hpp
check_severity = high, medium

[env:protoArtoo_ota]
extends = env:protoArtoo
upload_protocol = espota
upload_port = artoo.local

; Heap profiling build — USB flash.
; PA_HEAP_PROFILE=1 enables /api/profiler endpoint and profiler UI in setup.html.
; All profiling instrumentation has zero overhead in normal builds.
;
; Escalation (Tier 2 per-task attribution, ~20-30% heap overhead):
;   add CONFIG_HEAP_TASK_TRACKING=y to a custom_sdkconfig option in THIS env
;   (extends the base list; pioarduino rebuilds the core libs with it, first
;   build is slow). Use only for focused sessions — not routine testing.
;
; Escalation (Tier 3 standalone leak trace):
;   1. Add CONFIG_HEAP_TRACING=y and CONFIG_HEAP_TRACING_STANDALONE=y the same way.
;   2. POST /api/profiler/trace/start to arm, POST /api/profiler/trace/stop to dump to serial.
;   Buffer: 200 records (s_traceRecords in api_profiler.cpp). Increase if truncating.
[env:protoArtoo_profiler]
extends = env:protoArtoo
build_unflags =
	-DPA_LOG_LEVEL=1
build_flags =
	${flags_base.build_flags}
	-DPA_LOG_LEVEL=2
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
	-DPA_HEAP_PROFILE=1
build_src_flags =
	${flags_base.build_src_flags}

[env:protoArtoo_profiler_ota]
extends = env:protoArtoo_profiler
upload_protocol = espota
upload_port = artoo.local

; Production/field deployment — AP-only WiFi; no STA client.
; Saves ~10-15 KB heap vs AP+STA.
; Default OTA via AP: pio run -e protoArtoo_prod -t upload --upload-port 192.168.4.1
; While STA is still active: pio run -e protoArtoo_prod -t upload --upload-port artoo.local
[env:protoArtoo_prod]
extends = env:protoArtoo
upload_protocol = espota
upload_port = 192.168.4.1
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
	-DPA_ENABLE_STA_WIFI=0
build_src_flags =
	${flags_base.build_src_flags}


; Compile-check for AUDIO_CHIRP backend — not flashed, compile-only CI verification.
; Switch PA_AUDIO_DRIVER in protoArtoo env to AUDIO_CHIRP to use on hardware.
[env:protoArtoo_chirp_check]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
build_src_flags =
	${flags_base.build_src_flags}

; Compile-check for AUDIO_MP3TRIGGER backend — not flashed, compile-only CI verification.
; Switch PA_AUDIO_DRIVER in protoArtoo env to AUDIO_MP3TRIGGER to use on hardware.
[env:protoArtoo_mp3trigger_check]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_MP3TRIGGER
build_src_flags =
	${flags_base.build_src_flags}

; Flashable CHIRP build target. For hardware use with a CHIRP audio module.
; The _chirp_check env above is retained for compile-only CI verification.
[env:protoArtoo_chirp]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
build_src_flags =
	${flags_base.build_src_flags}

[env:protoArtoo_chirp_ota]
extends = env:protoArtoo_chirp
upload_protocol = espota
upload_port = artoo.local

; Control arm for the keep-alive decision (ADR 0023).
;
; esp_http_server keeps every connection open after a response. This env is the
; other configuration -- the request middleware stages Connection: close and
; queues httpd_sess_trigger_close() once the response has flushed, exempting
; the event stream -- reproducing what the old async stack did unconditionally.
;
; It lost, and is not a shipping target: ADR 0023 records that closing per
; response cost 25 connections per page load against 4, and drove the largest
; free block to 3188 bytes against 7412. It is retained, like the _check envs,
; so the comparison can be re-run against a future stack rather than
; reconstructed from history.
[env:protoArtoo_psychic_closeconn]
extends = env:protoArtoo_chirp
build_flags =
	${env:protoArtoo_chirp.build_flags}
	-DPA_WEB_CLOSE_PER_RESPONSE=1

[env:protoArtoo_psychic_closeconn_ota]
extends = env:protoArtoo_psychic_closeconn
upload_protocol = espota
upload_port = artoo.local

; Flashable MP3 Trigger build target. For hardware use with a SparkFun MP3 Trigger.
; The _mp3trigger_check env above is retained for compile-only CI verification.
[env:protoArtoo_mp3trigger]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_MP3TRIGGER
build_src_flags =
	${flags_base.build_src_flags}

[env:protoArtoo_mp3trigger_ota]
extends = env:protoArtoo_mp3trigger
upload_protocol = espota
upload_port = artoo.local

; Flashable DY-SV5W build target. For hardware use with a DY-SV5W audio module.
; AUDIO_SOFT_UART is also env:protoArtoo's own default driver, but this env
; gives DY-SV5W the same explicit, named, releasable target as CHIRP and
; MP3 Trigger instead of relying on that implicit base-env default.
[env:protoArtoo_dysv5w]
extends = env:protoArtoo
build_flags =
	${flags_base.build_flags}
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
build_src_flags =
	${flags_base.build_src_flags}

[env:protoArtoo_dysv5w_ota]
extends = env:protoArtoo_dysv5w
upload_protocol = espota
upload_port = artoo.local


[env:native]
platform = native
test_filter = test_native/*
; Native cppcheck scans src/tasks/audio_task.cpp even though native unit tests
; don't build that task. Define PA_AUDIO_DRIVER here so the compile-time driver
; selection block does not intentionally hit its #error branch during analysis.
build_flags = -std=c++17 -Wall -Wextra -I test/stubs/include -DPA_NATIVE_TEST_STUBS=1 -DPA_AUDIO_DRIVER=AUDIO_SOFT_UART -DPA_ADMISSION_TRACE=1
test_build_src = true
build_src_filter = -<*> +<dome_link_arbiter.cpp> +<drive_arbiter.cpp> +<drivers/hoverboard_uart.cpp> +<failsafe_gate.cpp> +<web/web_admission.cpp> +<web/web_admission_trace.cpp> +<web/web_event_stream.cpp> +<web/web_response_deadline.cpp> +<web/api_events.cpp> +<web/api_helpers.cpp> +<web/api_identity.cpp> +<web/api_actions_json.cpp> +<web/api_logs.cpp> +<web/action_registry.cpp> +<log_buffer.cpp> +<tasks/audio_dollar_parser.cpp> +<tasks/audio_playback_policy.cpp> +<tasks/audio_task_step.cpp> +<tasks/audio_config_map.cpp> +<web/api_estop.cpp> +<web/api_servo.cpp> +<web/api_dome.cpp> +<web/api_aux_led.cpp> +<web/api_drive.cpp> +<web/api_config.cpp> +<web/web_param_source.cpp> +<web/api_config_apply.cpp> +<web/api_rc_map_apply.cpp> +<web/api_wifi_apply.cpp> +<web/api_audio_mood_map_apply.cpp> +<web/api_audio_category_range_apply.cpp> +<web/api_audio_tracks_apply.cpp> +<web/api_audio.cpp> +<web/rc_diagnostics_snapshot.cpp> +<web/validation_snapshot.cpp> +<web/api_rc.cpp> +<web/api_validation.cpp> +<web/api_json_response.cpp> +<web/api_seq.cpp> +<rc_channel_mapper.cpp> +<native_test_stubs.cpp> +<config_store.cpp> +<config_serializer.cpp> +<config_nvsio.cpp> +<rc_action_dispatcher.cpp> +<rc_input_processor.cpp> +<drivers/audio_dy_sv5w.cpp> +<drivers/audio_chirp.cpp> +<drivers/audio_mp3trigger.cpp> +<tasks/sequence_dispatcher.cpp> +<tasks/sequence_engine.cpp> +<tasks/sequence_catalog.cpp> +<sequence_run_evidence.cpp> +<seq_last_run_json.cpp> +<protocol_check.cpp> +<seq_json.cpp> +<seq_store_index.cpp> +<seq_store_util.cpp> +<seq_dangling_bindings.cpp> +<wifi_boot_decision.cpp> +<wifi_recovery_gesture.cpp>
lib_deps = bblanchon/ArduinoJson @ 7.4.3
; Same ArduinoJson parser false-positive suppression for native dependency path.
; Scope is limited to the vendor header to avoid masking real project defects.
check_skip_packages = yes
check_flags =
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/src/ArduinoJson/Polyfills/preprocessor.hpp
