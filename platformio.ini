; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:protoArtoo]
; pioarduino is the maintained community platform that ships arduino-esp32 v3.x
; (official espressif32 platform never shipped v3.x — it still delivers v2.x as of 6.13.0).
; 55.03.37 = IDF 5.5.2 + arduino-esp32 3.3.7, released 2026-02-12.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 115200
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset
board_build.partitions = partitions/partitions_ota.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/extract_version.py
; build_flags applies to ALL compiled code — project, libraries, and framework.
; Do NOT put -Wall/-Wextra/-Werror here; framework code (e.g. WiFi.cpp) has its
; own bugs that are not our responsibility. Use build_src_flags for strict flags.
build_flags =
	-Os
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-DPA_ENABLE_AUDIO=1
	-DPA_ENABLE_ARMS=1
	-DPA_ENABLE_DOME_MOTOR=1
	-DPA_ENABLE_DOME_SBUS=1
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
	-DPA_DROID_NAME="\"R2-D2\""
	-DPA_LOG_LEVEL=2
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
	-D SSE_MAX_QUEUED_MESSAGES=8
; build_src_flags applies ONLY to src/ (project code). Framework and library code
; is NOT compiled with -Werror, so their upstream bugs don't block our build.
build_src_flags =
	-Wall
	-Wextra
	-Werror
lib_deps =
	ESP32Async/ESPAsyncWebServer @ 3.10.3
	ESP32Async/AsyncTCP @ 3.4.10
	bblanchon/ArduinoJson @ 7.4.3
; lib_ldf_mode = chain (default) — do NOT use chain+ or deep+ with arduino-esp32 v3.x.
; The + modes enable preprocessor evaluation during dependency scanning. WiFiGeneric.h
; guards #include "Network.h" behind #if SOC_WIFI_SUPPORTED, which is not defined at
; scan time. The scanner then skips it, Network/src never enters the include path,
; and the actual compilation fails. Default 'chain' mode ignores conditional guards
; and finds all #include statements, correctly pulling in the Network library.
; See: https://github.com/espressif/arduino-esp32/issues/9782
lib_ldf_mode = chain
test_build_src = true
test_ignore = test_native*
check_tool = cppcheck
; Suppression rationale: cppcheck mis-parses ArduinoJson token-paste macros in
; third-party headers and reports false high preprocessorErrorDirective findings.
; Keep scope narrow to dependency headers only; project code remains fully checked.
check_skip_packages = yes
check_flags =
	cppcheck: --enable=all --suppress=missingIncludeSystem
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/Polyfills/preprocessor.hpp
check_severity = high, medium

[env:protoArtoo_ota]
extends = env:protoArtoo
upload_protocol = espota
upload_port = 10.0.0.22
upload_flags =
extra_scripts = pre:tools/extract_version.py

; Production/field deployment — AP-only WiFi; no STA client.
; Saves ~10-15 KB heap vs AP+STA.
; Default OTA via AP: pio run -e protoArtoo_prod -t upload --upload-port 192.168.4.1
; While STA is still active: pio run -e protoArtoo_prod -t upload --upload-port 10.0.0.22
[env:protoArtoo_prod]
extends = env:protoArtoo
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
extra_scripts = pre:tools/extract_version.py
build_flags =
	-Os
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-DPA_ENABLE_AUDIO=1
	-DPA_ENABLE_ARMS=1
	-DPA_ENABLE_DOME_MOTOR=1
	-DPA_ENABLE_DOME_SBUS=1
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
	-DPA_DROID_NAME="\"R2-D2\""
	-DPA_LOG_LEVEL=2
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
	-D SSE_MAX_QUEUED_MESSAGES=8
	-DPA_ENABLE_STA_WIFI=0
build_src_flags =
	-Wall
	-Wextra
	-Werror

; Compile-check for AUDIO_CHIRP backend — not flashed, compile-only CI verification.
; Switch PA_AUDIO_DRIVER in protoArtoo env to AUDIO_CHIRP to use on hardware.
[env:protoArtoo_chirp_check]
extends = env:protoArtoo
build_flags =
	-Os
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-DPA_ENABLE_AUDIO=1
	-DPA_ENABLE_ARMS=1
	-DPA_ENABLE_DOME_MOTOR=1
	-DPA_ENABLE_DOME_SBUS=1
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
	-DPA_DROID_NAME="\"R2-D2\""
build_src_flags =
	-Wall
	-Wextra
	-Werror

[env:native]
platform = native
test_filter = test_native/*
; Native cppcheck scans src/tasks/audio_task.cpp even though native unit tests
; don't build that task. Define PA_AUDIO_DRIVER here so the compile-time driver
; selection block does not intentionally hit its #error branch during analysis.
build_flags = -std=c++17 -Wall -Wextra -I test/stubs/include -DPA_NATIVE_TEST_STUBS=1 -DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
test_build_src = true
build_src_filter = -<*> +<drivers/hoverboard_uart.cpp> +<web/api_helpers.cpp> +<log_buffer.cpp> +<tasks/audio_dollar_parser.cpp> +<web/api_config.cpp> +<web/rc_diagnostics_snapshot.cpp> +<web/validation_snapshot.cpp> +<native_test_stubs.cpp>
lib_deps = bblanchon/ArduinoJson @ 7.4.3
; Same ArduinoJson parser false-positive suppression for native dependency path.
; Scope is limited to the vendor header to avoid masking real project defects.
check_skip_packages = yes
check_flags =
	cppcheck: --suppress=preprocessorErrorDirective:*/ArduinoJson/src/ArduinoJson/Polyfills/preprocessor.hpp
