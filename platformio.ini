; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:protoArtoo]
platform = espressif32@5.2.0
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 115200
upload_flags = 
	--before
	no_reset_no_sync
	--after
	hard_reset
board_build.partitions = partitions/partitions_ota.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/extract_version.py
build_flags = 
	-Os
	-Wall
	-Wextra
	-Werror
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-DPA_ENABLE_AUDIO=1
	-DPA_ENABLE_ARMS=1
	-DPA_ENABLE_DOME_MOTOR=1
	-DPA_ENABLE_DOME_SBUS=1
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
	-DPA_DROID_NAME="\"R2-D2\""
lib_deps = 
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	https://github.com/me-no-dev/AsyncTCP.git
	bblanchon/ArduinoJson @ 7.4.3
lib_ldf_mode = deep+
test_build_src = true
test_ignore = test_native*
check_tool = cppcheck
check_flags = 
	cppcheck: --enable=all --suppress=missingIncludeSystem
check_severity = high, medium

[env:protoArtoo_ota]
extends = env:protoArtoo
upload_protocol = espota
upload_port = 10.0.0.22
upload_flags = 
extra_scripts = pre:tools/extract_version.py

[env:native]
platform = native
test_filter = test_native/*
build_flags = -std=c++17 -Wall -Wextra
test_build_src = true
build_src_filter = -<*> +<drivers/hoverboard_uart.cpp> +<web/api_helpers.cpp> +<log_buffer.cpp>
lib_deps = me-no-dev/ESPAsyncWebServer@1.2.3
