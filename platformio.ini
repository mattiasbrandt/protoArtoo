; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:protoArtoo]
platform = espressif32@6.13.0
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 115200
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset
board_build.partitions = partitions/partitions_ota.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/extract_version.py
build_flags =
	-Os
	-Wall
	-Wextra
	-Werror
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-DPA_ENABLE_AUDIO=1
	-DPA_ENABLE_ARMS=1
	-DPA_ENABLE_DOME_MOTOR=1
	-DPA_ENABLE_DOME_SBUS=1
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
	-DPA_DROID_NAME="\"R2-D2\""
	-DPA_LOG_LEVEL=2
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
	-D SSE_MAX_QUEUED_MESSAGES=8
lib_deps =
	ESP32Async/ESPAsyncWebServer @ 3.10.3
	ESP32Async/AsyncTCP @ 3.4.10
	bblanchon/ArduinoJson @ 7.4.3
lib_ldf_mode = deep+
test_build_src = true
test_ignore = test_native*
check_tool = cppcheck
check_flags =
	cppcheck: --enable=all --suppress=missingIncludeSystem
check_severity = high, medium

[env:protoArtoo_ota]
extends = env:protoArtoo
upload_protocol = espota
upload_port = 10.0.0.22
upload_flags =
extra_scripts = pre:tools/extract_version.py

; Production/field deployment — AP-only WiFi; no STA client.
; Saves ~10-15 KB heap vs AP+STA.
; Default OTA via AP: pio run -e protoArtoo_prod -t upload --upload-port 192.168.4.1
; While STA is still active: pio run -e protoArtoo_prod -t upload --upload-port 10.0.0.22
[env:protoArtoo_prod]
extends = env:protoArtoo
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
extra_scripts = pre:tools/extract_version.py
build_flags =
	-Os
	-Wall
	-Wextra
	-Werror
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-DPA_ENABLE_AUDIO=1
	-DPA_ENABLE_ARMS=1
	-DPA_ENABLE_DOME_MOTOR=1
	-DPA_ENABLE_DOME_SBUS=1
	-DPA_AUDIO_DRIVER=AUDIO_SOFT_UART
	-DPA_DROID_NAME="\"R2-D2\""
	-DPA_LOG_LEVEL=2
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
	-D SSE_MAX_QUEUED_MESSAGES=8
	-DPA_ENABLE_STA_WIFI=0

; Compile-check for AUDIO_CHIRP backend — not flashed, compile-only CI verification.
; Switch PA_AUDIO_DRIVER in protoArtoo env to AUDIO_CHIRP to use on hardware.
[env:protoArtoo_chirp_check]
extends = env:protoArtoo
build_flags =
	-Os
	-Wall
	-Wextra
	-Werror
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-DPA_ENABLE_AUDIO=1
	-DPA_ENABLE_ARMS=1
	-DPA_ENABLE_DOME_MOTOR=1
	-DPA_ENABLE_DOME_SBUS=1
	-DPA_AUDIO_DRIVER=AUDIO_CHIRP
	-DPA_DROID_NAME="\"R2-D2\""

[env:native]
platform = native
test_filter = test_native/*
build_flags = -std=c++17 -Wall -Wextra
test_build_src = true
build_src_filter = -<*> +<drivers/hoverboard_uart.cpp> +<web/api_helpers.cpp> +<log_buffer.cpp> +<tasks/audio_dollar_parser.cpp>
lib_deps = ESP32Async/ESPAsyncWebServer @ 3.10.3
